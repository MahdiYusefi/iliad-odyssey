["g_achaeans","آخائیان","Achaeans","Ἀχαιοί","Achivi · Achaei","people","Greeks, Hellenes, Achaians, Akhaioi | یونانیان, آخاییان, هلنی‌ها","رایج‌ترین نامی که هومر برای یونانیانِ حاضر در جنگ تروا به کار می‌برد. «دانائوسیان» و «آرگوسی‌ها» نیز به همین معنا آمده‌اند. نام «هلنی» در هومر هنوز برای همه‌ی یونانیان به کار نمی‌رود.","Homer's most common name for the Greeks at Troy. 'Danaans' and 'Argives' are used with the same meaning. The name 'Hellenes' is not yet used in Homer for all Greeks.",["agamemnon","achilles","ships","g_danaans","g_argives"]],
["g_danaans","دانائوسیان","Danaans","Δαναοί","Danai","people","Danaoi, Danaans | دانائیان","نام دیگر یونانیان در هومر، که به دانائوس، نیای افسانه‌ای آرگوس، نسبت داده می‌شود. معنایش با آخائیان و آرگوسی‌ها یکی است.","Another Homeric name for the Greeks, traced to Danaus, a legendary ancestor from Argos. It means the same as Achaeans and Argives.",["g_achaeans","argos_city"]],
["g_argives","آرگوسی‌ها","Argives","Ἀργεῖοι","Argivi","people","Argeioi, Argives | آرگیوها","سومین نام کلی یونانیان در هومر، برگرفته از آرگوس. گاه به مردم شهر آرگوس و گاه به همه‌ی یونانیان اشاره دارد.","The third general name for the Greeks in Homer, from Argos. It can mean the people of the city of Argos or all the Greeks.",["argos_city","diomedes","g_achaeans"]],
["g_trojans","تروآییان","Trojans","Τρῶες","Troes · Troiani","people","Trojans, Teucrians | تروایی‌ها, اهالی تروا","مردم شهر تروا به فرمانروایی پریام. هم‌پیمانانی از سراسر آسیای صغیر و تراکیه، مانند لوکیایی‌ها و داردانیان، در کنارشان می‌جنگند. ایلیاد آنان را با همدردی تصویر می‌کند، نه با دشمنی.","The people of Troy under King Priam. Allies from across Asia Minor and Thrace, such as the Lycians and Dardanians, fight beside them. The Iliad portrays them with as much sympathy as hostility.",["troy","priam","hector","g_dardanians","g_lycians"]],
["g_dardanians","داردانیان","Dardanians","Δάρδανοι","Dardani","people","Dardanoi, Dardania | داردانی‌ها","مردم داردانیا در دامنه‌ی کوه ایدا، خویشاوندان نزدیک تروآییان، به فرماندهی آئنئاس. نامشان از داردانوس، نیای پادشاهان تروا، گرفته شده است.","The people of Dardania on the slopes of Mount Ida, close kin of the Trojans, led by Aeneas. They are named after Dardanus, ancestor of the Trojan kings.",["aeneas","ida","g_dardanus"]],
["g_myrmidons","میرمیدون‌ها","Myrmidons","Μυρμιδόνες","Myrmidones","people","Myrmidones | میرمیدونها","سپاهیان آشیل از فتیا که با پنجاه کشتی به تروا آمدند. در غیاب آشیل بیکار می‌مانند و در سرود ۱۶ به فرماندهی پاتروکلوس به میدان برمی‌گردند.","Achilles' troops from Phthia, who came to Troy in fifty ships. They sit idle while Achilles sulks, and in Book 16 return to battle under Patroclus.",["achilles","phthia","patroclus"]],
["g_phaeacians","فایاکیان","Phaeacians","Φαίηκες","Phaeaces","people","Phaiakes, Phaeacians | فائاکیان","دریانوردان افسانه‌ای اسخریا، نزدیک به خدایان، که کشتی‌هایشان بی‌سکان و بی‌ناخدا راه را می‌دانند. مهمان‌نوازی‌شان اودیسئوس را به خانه می‌رساند.","The legendary seafarers of Scheria, close to the gods, whose ships find their way without helmsman or rudder. Their hospitality brings Odysseus home.",["scheria","alcinous","arete","nausicaa"]],
["g_cyclopes","کوکلوپس‌ها","Cyclopes","Κύκλωπες","Cyclopes","people","Cyclops, Kyklopes | سیکلوپ‌ها, غول‌های یک‌چشم","قوم غول‌های یک‌چشم و بی‌قانون اودیسه که نه کشت می‌کنند، نه انجمن دارند و نه کشتی. هر کدام تنها با خانواده‌ی خود در غاری زندگی می‌کند. پولیفموس یکی از آنان است.","The lawless one-eyed giants of the Odyssey, who neither farm, hold assemblies nor build ships. Each lives alone in a cave with his family. Polyphemus is one of them.",["polyphemus","poseidon","g_telemus"]],
["g_lycians","لوکیایی‌ها","Lycians","Λύκιοι","Lycii","people","Lykioi | لیکیایی‌ها","هم‌پیمانان تروا از لوکیا در جنوب غربی آسیای صغیر، به فرماندهی سارپدون و گلاوکوس. از دلیرترین یاران تروآییان‌اند.","Troy's allies from Lycia in southwestern Asia Minor, led by Sarpedon and Glaucus. They are among the bravest of the Trojan allies.",["sarpedon","glaucus","g_lycia"]],
["g_thracians","تراکیایی‌ها","Thracians","Θρῇκες","Thraces","people","Thrakes | تراکی‌ها","هم‌پیمانان تروا از شمال دریای اژه. رسوس پادشاه آنان است. کیکون‌های اودیسه نیز در تراکیه زندگی می‌کنند.","Troy's allies from north of the Aegean. Rhesus is their king. The Cicones of the Odyssey also live in Thrace.",["rhesus","cicones","g_thrace"]],
["g_locrians","لوکریان","Locrians","Λοκροί","Locri","people","Lokroi | لوکری‌ها","مردم لوکریس در یونان مرکزی، به فرماندهی آژاکس کوچک. در ایلیاد کمانداران و فلاخن‌اندازان سبک‌اسلحه‌اند و زره سنگین ندارند.","The people of Locris in central Greece, led by Ajax the Lesser. In the Iliad they are light-armed archers and slingers without heavy armor.",["ajax_lesser"]],
["g_cephallenians","کفالنیان","Cephallenians","Κεφαλλῆνες","Cephallenes","people","Kephallenes, Cephallenia | کفالنی‌ها","نامی که ایلیاد برای سپاهیان اودیسئوس از ایتاکا و جزیره‌های پیرامون به کار می‌برد. اودیسئوس با دوازده کشتی به تروا آمد.","The Iliad's name for Odysseus' troops from Ithaca and the nearby islands. Odysseus brought twelve ships to Troy.",["odysseus","ithaca","g_same"]],
["g_ethiopians","اتیوپیایی‌ها","Ethiopians","Αἰθίοπες","Aethiopes","people","Aithiopes | حبشیان","مردمی پرهیزگار در دورترین کرانه‌ی جهان، کنار اقیانوس، که خدایان برای جشن قربانی نزدشان می‌روند. در ایلیاد زئوس به ضیافتشان رفته است و در آغاز اودیسه پوزئیدون نزد آنان است؛ غیبت او به دیگر خدایان فرصت می‌دهد درباره‌ی بازگشت اودیسئوس تصمیم بگیرند.","A pious people at the farthest edge of the world, by the Ocean, where the gods go to feast at sacrifices. In the Iliad Zeus is away at their banquet, and at the start of the Odyssey Poseidon is with them, which lets the other gods decide Odysseus' fate.",["zeus","poseidon","g_ocean"]],
["g_cimmerians","کیمری‌ها","Cimmerians","Κιμμέριοι","Cimmerii","people","Kimmerioi | کیمریان","مردمی در کرانه‌ی اقیانوس، در سرزمینی پوشیده از مه و تاریکی همیشگی که آفتاب هرگز بر آن نمی‌تابد. کشتی اودیسئوس پیش از ورود به جهان زیرین به سرزمین آنان می‌رسد.","A people by the Ocean in a land of mist and endless night where the sun never shines. Odysseus' ship reaches their land just before the entrance to the underworld.",["nekyia","hades","g_ocean"]],
["g_amazons","آمازون‌ها","Amazons","Ἀμαζόνες","Amazones","people","Amazones | آمازونها","زنان جنگاور افسانه‌ای. ایلیاد دو بار از آنان یاد می‌کند: پریام در جوانی در فروگیه با آنان جنگیده و بلروفون آنان را شکست داده است.","Legendary warrior women. The Iliad mentions them twice: Priam fought them in Phrygia in his youth, and Bellerophon defeated them.",["priam","g_bellerophon","g_phrygia"]],
["g_taphians","تافیان","Taphians","Τάφιοι","Taphii","people","Taphioi | تافی‌ها","دریانوردان و دزدان دریایی از جزیره‌ی تافوس. آتنا در نخستین دیدارش با تلماخوس خود را منتس، پادشاه تافیان، معرفی می‌کند. در داستان ائومائوس نیز دزدان تافی نقش دارند.","Seafarers and pirates from the island of Taphos. In her first visit to Telemachus, Athena poses as Mentes, king of the Taphians. Taphian pirates also figure in Eumaeus' story.",["athena","telemachus","eumaeus","g_mentes"]],
["g_centaurs","کنتاورها","Centaurs","Κένταυροι","Centauri","people","Kentauroi, Lapiths, Eurytion | سانتورها, لاپیت‌ها","موجودات نیمه‌اسب و نیمه‌انسان. نستور در ایلیاد از نبرد لاپیت‌ها با آنان در جوانی خود یاد می‌کند. در اودیسه آنتینوئوس داستان کنتاور مستی به نام اوروتیون را برای گدای ناشناس می‌گوید تا او را از دست زدن به کمان بترساند. خیرون، آموزگار آشیل، نیز کنتاور است.","Half-horse, half-human creatures. In the Iliad Nestor recalls fighting beside the Lapiths against them in his youth. In the Odyssey Antinous tells the beggar about a drunken centaur, Eurytion, to scare him off the bow. Chiron, Achilles' teacher, is also a centaur.",["nestor","antinous","g_chiron"]],
// divine groups & figures
["g_muses","موزها","Muses","Μοῦσαι","Musae (Camenae)","divine","Mousai, Muse | الهگان هنر, الهه‌ی شعر","دختران زئوس و ایزدبانوان شعر و یادمان. هر دو حماسه با خطاب به الهه‌ی شعر آغاز می‌شوند: «بخوان، ای الهه، خشم آشیل را» و «از آن مرد بگو، ای موز». پیش از فهرست کشتی‌ها نیز شاعر از موزها یاری می‌خواهد.","Daughters of Zeus and goddesses of poetry and memory. Both epics open by addressing the Muse: 'Sing, goddess, the wrath of Achilles' and 'Tell me, Muse, of the man'. The poet calls on them again before the Catalogue of Ships.",["homer","iliad","odyssey"]],
["g_nereids","نرئیدها","Nereids","Νηρηΐδες","Nereides","divine","Nereides, sea nymphs | پریان دریا","پریان دریا و خواهران تتیس، دختران نرئوس، پیر دریا. در سرود ۱۸ ایلیاد با تتیس در سوگ پاتروکلوس می‌نالند و در اودیسه در خاکسپاری آشیل می‌گریند.","Sea nymphs, sisters of Thetis and daughters of Nereus, the old man of the sea. In Iliad Book 18 they wail with Thetis for Patroclus, and in the Odyssey they weep at Achilles' funeral.",["thetis","achilles","patroclus"]],
["g_titans","تیتان‌ها","Titans","Τιτῆνες","Titani","divine","Titanes, Titan | تیتانها","نسل پیشین خدایان به رهبری کرونوس که زئوس شکستشان داد و در تارتاروس زندانی‌اند. هرا در سرود ۱۴، در پیمانش با هوپنوس (خواب)، به نام آنان سوگند می‌خورد.","The older generation of gods led by Cronus, defeated by Zeus and imprisoned in Tartarus. In Book 14 Hera swears an oath to Sleep by the Titans.",["zeus","hera","hypnos","g_cronus","g_tartarus"]],
["g_cronus","کرونوس","Cronus","Κρόνος","Saturnus (Saturn)","divine","Kronos, Cronos, Saturn | ساتورن, زحل","پدر زئوس، پوزئیدون، هادس و هرا، که زئوس او را برکنار کرد. لقب رایج زئوس در هومر «پسر کرونوس» است. پوزئیدون در سرود ۱۵ می‌گوید سه برادر جهان را میان خود تقسیم کردند: آسمان برای زئوس، دریا برای او و جهان زیرین برای هادس.","Father of Zeus, Poseidon, Hades and Hera, overthrown by Zeus. Zeus' common epithet in Homer is 'son of Cronus'. In Book 15 Poseidon says the three brothers divided the world: the sky for Zeus, the sea for him, and the underworld for Hades.",["zeus","hera","poseidon","g_titans","g_hades_god"]],
["g_hades_god","هادس (ایزد)","Hades (the god)","Ἀΐδης · Ἅιδης","Pluto · Dis Pater · Orcus","divine","Aides, Aidoneus, Pluton, Pluto, Dis | پلوتون, ایزد مردگان","برادر زئوس و پوزئیدون و فرمانروای مردگان، همسر پرسفونه. نام او بعدها بر خود جهان زیرین نیز نهاده شد. در ایلیاد گفته می‌شود که هراکلس روزی او را با تیر زخمی کرده است، و در نبرد خدایان از ترس اینکه زمین بشکافد و قلمرو مردگان آشکار شود، از تختش برمی‌جهد و فریاد می‌زند.","Brother of Zeus and Poseidon and ruler of the dead, husband of Persephone. His name later came to mean the underworld itself. In the Iliad, Heracles once wounded him with an arrow, and during the battle of the gods he cries out in fear that the earth will split open.",["hades","persephone","zeus","poseidon","g_cronus"]],
["g_dione","دیونه","Dione","Διώνη","Dione","divine","Dione | دیون","مادر آفرودیته در ایلیاد. وقتی دیومدس آفرودیته را زخمی می‌کند، دیونه او را دلداری می‌دهد و از خدایانی می‌گوید که از دست انسان‌ها رنج دیده‌اند.","Aphrodite's mother in the Iliad. When Diomedes wounds Aphrodite, Dione comforts her and tells of other gods who have suffered at the hands of mortals.",["aphrodite","diomedes"]],
["g_eris","اریس","Eris (Strife)","Ἔρις","Discordia","divine","Strife, Discord, Discordia | ستیز, نفاق","ایزدبانوی ستیز و خواهر آرس. ایلیاد او را چنین وصف می‌کند که نخست کوچک است و سپس آن‌قدر بزرگ می‌شود که سرش به آسمان می‌رسد؛ زئوس او را به کشتی‌های یونانیان می‌فرستد تا شور جنگ برانگیزد. داستان سیب زرین او در هومر نیامده است.","Goddess of strife and sister of Ares. In the Iliad she starts small but grows until her head touches the sky; Zeus sends her to the Greek ships to stir up battle. The story of her golden apple is not in Homer.",["ares","zeus","judgment"]],
["g_ate","آته","Ate (Delusion)","Ἄτη","Ate","divine","Ate, delusion, folly, Prayers, Litai | کوری خرد, فریب","ایزدبانوی کوری خرد که آدمیان را به خطا می‌کشاند. آگاممنون در سرود ۱۹ گناه خود را به گردن او می‌اندازد. فوینیکس در سرود ۹ از «دعاها» می‌گوید که لنگان در پی او می‌آیند تا آسیبش را جبران کنند.","The goddess of delusion who leads people into ruinous error. In Book 19 Agamemnon blames her for his own wrong. In Book 9 Phoenix tells of the Prayers who limp after her to repair the harm she does.",["agamemnon","phoenix","quarrel"]],
["g_eos","ائوس (سپیده‌دم)","Eos (Dawn)","Ἠώς","Aurora","divine","Dawn, Aurora, rosy-fingered | سپیده, آئورا","ایزدبانوی سپیده‌دم؛ لقب معروفش «سپیده‌ی گلگون‌انگشت» بارها در هر دو حماسه تکرار می‌شود. همسر تیتونوس و مادر ممنون است. در اودیسه، آتنا سپیده‌دم را نگه می‌دارد تا شب دیدار اودیسئوس و پنلوپه درازتر شود.","Goddess of the dawn; her famous epithet 'rosy-fingered Dawn' recurs throughout both epics. She is the wife of Tithonus and mother of Memnon. In the Odyssey, Athena holds back the dawn to lengthen the night of Odysseus and Penelope's reunion.",["athena","penelope","g_memnon"]],
["g_winds","بادها","The Winds","Ἄνεμοι","Venti (Aquilo, Favonius, Auster, Eurus)","divine","Boreas, Zephyrus, Zephyr, Notus, Eurus, Aquilo, Favonius, Auster | باد شمال, باد غرب, بوره‌آس, زفیروس","چهار باد اصلی: بورئاس (شمال)، زفوروس (غرب)، نوتوس (جنوب) و ائوروس (شرق). در سرود ۲۳ ایلیاد ایریس بورئاس و زفوروس را فرامی‌خواند تا هیزم‌های سوزاندن پیکر پاتروکلوس را شعله‌ور کنند. در اودیسه پوزئیدون هر چهار را بر قایق چوبی اودیسئوس می‌شوراند و آئولوس نگهبان آنان است.","The four main winds: Boreas (north), Zephyrus (west), Notus (south) and Eurus (east). In Iliad Book 23 Iris summons Boreas and Zephyrus to light Patroclus' pyre. In the Odyssey Poseidon unleashes all four on Odysseus' raft, and Aeolus is their keeper.",["aeolus","iris","patroclus","poseidon"]],
["g_harpies","هارپی‌ها","Harpies","Ἅρπυιαι","Harpyiae","divine","Harpyiai, Podarge | هارپیها","روح‌های توفان که آدمیان را می‌ربایند و ناپدید می‌کنند. پنلوپه و تلماخوس می‌گویند گویی هارپی‌ها اودیسئوس را ربوده‌اند. مادر اسبان جاودان آشیل نیز هارپی‌ای به نام پوداگه است.","Storm spirits who snatch people away without a trace. Penelope and Telemachus say it is as if the Harpies had carried Odysseus off. The mother of Achilles' immortal horses is a Harpy named Podarge.",["penelope","telemachus","g_horses"]],
["g_erinyes","ارینوس‌ها","Erinyes (Furies)","Ἐρινύες","Furiae · Dirae","divine","Erinys, Furies, Eumenides | ایزدبانوان انتقام","ایزدبانوان انتقام که به‌ویژه گناه بر ضد پدر و مادر و مهمان را کیفر می‌دهند. پدر فوینیکس او را به نام آنان نفرین کرد، و در سرود ۱۹ ارینوس‌ها صدای اسب سخنگوی آشیل را خاموش می‌کنند.","Goddesses of vengeance who punish crimes especially against parents and guests. Phoenix's father cursed him by invoking them, and in Book 19 the Erinyes silence the voice of Achilles' talking horse.",["phoenix","g_horses","persephone"]],
["g_hebe","هبه","Hebe","Ἥβη","Iuventas (Juventas)","divine","Hebe, youth | ایزدبانوی جوانی","ایزدبانوی جوانی و دختر زئوس و هرا که در ایلیاد برای خدایان نکتار می‌ریزد. در اودیسه همسر هراکلس جاودان‌شده در المپ است.","Goddess of youth and daughter of Zeus and Hera, who pours nectar for the gods in the Iliad. In the Odyssey she is the wife of the deified Heracles on Olympus.",["hera","zeus","olympus","g_heracles"]],
["g_dionysus","دیونوسوس","Dionysus","Διώνυσος","Bacchus · Liber","divine","Dionysos, Bacchus, Bakchos | باکوس","ایزد شراب. در سرود ۶ ایلیاد، دیومدس داستان لوکورگوس را می‌گوید که دیونوسوس را آزار داد و او از ترس به دامن تتیس در دریا گریخت. در اودیسه، کوزه‌ی زرینی که استخوان‌های آشیل و پاتروکلوس در آن است هدیه‌ی دیونوسوس و ساخته‌ی هفائستوس است.","God of wine. In Iliad Book 6, Diomedes tells how Lycurgus persecuted Dionysus, who fled in terror into the sea to Thetis. In the Odyssey, the golden urn holding the bones of Achilles and Patroclus was a gift of Dionysus, made by Hephaestus.",["diomedes","thetis","achilles","hephaestus"]],
["g_atlas","اطلس","Atlas","Ἄτλας","Atlas","divine","Atlas | آتلاس","تیتانی که ستون‌های جداکننده‌ی زمین و آسمان را نگه می‌دارد و ژرفای همه‌ی دریاها را می‌شناسد. در اودیسه پدر کالیپسو است.","The Titan who holds the pillars that keep earth and sky apart and knows the depths of every sea. In the Odyssey he is Calypso's father.",["calypso","g_titans"]],
["g_thoosa","توئوسا","Thoosa","Θόωσα","Thoosa","divine","Thoosa, nymph | توسا","پری دریایی، دختر فورکوس، که از پوزئیدون پولیفموس را به دنیا آورد. زئوس در آغاز اودیسه از او یاد می‌کند تا دلیل خشم پوزئیدون را توضیح دهد.","A sea nymph, daughter of Phorcys, who bore Polyphemus to Poseidon. Zeus mentions her at the start of the Odyssey to explain Poseidon's anger.",["polyphemus","poseidon","g_phorcys"]],
["g_lampetia","لامپتیا","Lampetia","Λαμπετίη","Lampetia","divine","Lampetie, Phaethusa | فائتوسا","یکی از دو دختر هلیوس که گاوهای او را در تریناکیه نگهبانی می‌کنند. اوست که خبر کشتار گاوها را به پدرش می‌رساند.","One of the two daughters of Helios who tend his cattle on Thrinacia. She carries the news of their slaughter to her father.",["helios","cattle","g_thrinacia"]],
["g_horses","اسبان آشیل","Horses of Achilles","Ξάνθος καὶ Βαλίος","Xanthus et Balius","divine","Xanthus, Xanthos, Balius, Balios, horses | کسانتوس, بالیوس, اسب سخنگو","دو اسب جاودان، کسانتوس و بالیوس، هدیه‌ی خدایان به پلئوس. در سرود ۱۷ در سوگ پاتروکلوس اشک می‌ریزند. در سرود ۱۹ هرا به کسانتوس صدای انسانی می‌دهد و او مرگ نزدیک آشیل را پیشگویی می‌کند، تا آنکه ارینوس‌ها خاموشش می‌کنند.","Two immortal horses, Xanthus and Balius, a gift of the gods to Peleus. In Book 17 they weep for Patroclus. In Book 19 Hera gives Xanthus a human voice and he foretells Achilles' coming death, until the Erinyes silence him.",["achilles","patroclus","peleus","hera","g_automedon"]],
// minor figures
["g_chryseis","کریسئیس","Chryseis","Χρυσηΐς","Chryseis (Astynome)","figure","Chryseis, Astynome | دختر کریسس","دختر کریسس، کاهن آپولون، که اسیر آگاممنون شده است. آگاممنون می‌گوید او را بر همسرش کلوتمنسترا ترجیح می‌دهد، اما برای پایان دادن به طاعون ناچار می‌شود او را پس بدهد. اودیسئوس او را به شهر کریسه بازمی‌گرداند.","Daughter of Chryses, priest of Apollo, and Agamemnon's captive. Agamemnon says he prefers her to his wife Clytemnestra, but must return her to end the plague. Odysseus brings her back to the town of Chryse.",["chryses","agamemnon","quarrel","odysseus","g_chryse"]],
["g_mentes","منتس","Mentes","Μέντης","Mentes","figure","Mentes, king of the Taphians | منتیس","پادشاه تافیان و دوست قدیمی اودیسئوس. آتنا در سرود ۱ اودیسه در هیئت او نزد تلماخوس می‌آید و او را به سفر در پی پدر برمی‌انگیزد. نباید با منتور اشتباه شود.","King of the Taphians and an old friend of Odysseus. In Odyssey Book 1 Athena visits Telemachus in his likeness and urges him to search for his father. Not to be confused with Mentor.",["athena","telemachus","mentor","g_taphians"]],
["g_meriones","مریونس","Meriones","Μηριόνης","Meriones","figure","Meriones of Crete | مریون","یار و هم‌رزم ایدومنئوس از کرت و کمانداری ماهر. در مسابقه‌های سوگ پاتروکلوس برنده‌ی تیراندازی است و برای شبیخون شبانه کلاهخود دندان‌گرازی خود را به اودیسئوس می‌دهد.","Idomeneus' squire and comrade from Crete, and a skilled archer. He wins the archery contest at Patroclus' funeral games and lends Odysseus his boar's-tusk helmet for the night raid.",["idomeneus","crete","odysseus","g_helmet"]],
["g_automedon","آوتومدون","Automedon","Αὐτομέδων","Automedon","figure","Automedon, charioteer | اتومدون","ارابه‌ران آشیل. ارابه‌ی پاتروکلوس را در سرود ۱۶ می‌راند و پس از مرگ او، اسبان گریان را دوباره به نبرد می‌آورد.","Achilles' charioteer. He drives Patroclus' chariot in Book 16 and, after Patroclus' death, brings the weeping horses back into battle.",["achilles","patroclus","g_horses"]],
["g_cebriones","کبریونس","Cebriones","Κεβριόνης","Cebriones","figure","Kebriones, charioteer of Hector | کبریون","برادر ناتنی و ارابه‌ران هکتور. پاتروکلوس با سنگی او را می‌کشد و بر سر پیکرش نبردی سخت میان پاتروکلوس و هکتور درمی‌گیرد.","Hector's half-brother and charioteer. Patroclus kills him with a stone, and a fierce fight breaks out between the two over his body.",["hector","patroclus"]],
["g_helenus","هلنوس","Helenus","Ἕλενος","Helenus","figure","Helenos, seer | هلن (پیشگو)","پسر پریام و بهترین پیشگوی تروا. در سرود ۶ از هکتور می‌خواهد به شهر برود تا زنان تروا برای آتنا نذر کنند، و در سرود ۷ پیشنهاد نبرد تن‌به‌تن هکتور و آژاکس از اوست.","A son of Priam and Troy's best seer. In Book 6 he sends Hector into the city so the Trojan women can pray to Athena, and in Book 7 he proposes the duel between Hector and Ajax.",["priam","hector","ajax"]],
["g_agenor","آگنور","Agenor","Ἀγήνωρ","Agenor","figure","Agenor, son of Antenor | آژنور","جنگاور تروآیی و پسر آنتنور. در سرود ۲۱ جرأت می‌کند در برابر آشیل بایستد؛ آپولون او را نجات می‌دهد و خود به شکل او درمی‌آید تا آشیل را از دروازه‌های شهر دور کند و تروآییان بگریزند.","A Trojan warrior, son of Antenor. In Book 21 he dares to face Achilles; Apollo rescues him and takes his form to lure Achilles away from the gates so the Trojans can escape.",["antenor","achilles","apollo"]],
["g_laomedon","لائومدون","Laomedon","Λαομέδων","Laomedon","figure","Laomedon, father of Priam | لاومدون","پدر پریام و پادشاه پیشین تروا. پوزئیدون و آپولون یک سال برای او کار کردند و دیوار تروا را ساختند، اما او مزدشان را نداد و تهدیدشان کرد. پوزئیدون در سرود ۲۱ این را یکی از دلایل کینه‌اش به تروا می‌شمارد.","Priam's father and an earlier king of Troy. Poseidon and Apollo served him for a year and built the walls of Troy, but he cheated them of their wages and threatened them. In Book 21 Poseidon names this as a reason for his grudge against Troy.",["priam","poseidon","apollo","troy"]],
["g_dardanus","داردانوس","Dardanus","Δάρδανος","Dardanus","figure","Dardanos | داردانوس","پسر زئوس و نیای پادشاهان تروا. آئنئاس در سرود ۲۰ تبارنامه‌ی خاندان را از داردانوس تا پریام و خود بازمی‌گوید.","Son of Zeus and ancestor of the Trojan kings. In Book 20 Aeneas recites the family line from Dardanus down to Priam and himself.",["zeus","aeneas","priam","g_dardanians"]],
["g_ganymede","گانیمد","Ganymede","Γανυμήδης","Ganymedes · Catamitus","figure","Ganymedes | گانیمدس","شاهزاده‌ی تروآیی و زیباترین آدمیان، که خدایان او را ربودند تا ساقی زئوس باشد. آئنئاس در تبارنامه‌اش از او یاد می‌کند.","A Trojan prince, the most beautiful of mortals, whom the gods carried off to be Zeus' cupbearer. Aeneas mentions him in his genealogy.",["zeus","aeneas","troy"]],
["g_memnon","ممنون","Memnon","Μέμνων","Memnon","figure","Memnon, son of Dawn | ممنون حبشی","پسر ائوس (سپیده‌دم) و پادشاه اتیوپیایی‌ها که پس از ایلیاد به یاری تروا آمد. در اودیسه گفته می‌شود که آنتیلوخوس، پسر نستور، به دست او کشته شد.","Son of Eos (Dawn) and king of the Ethiopians, who came to Troy's aid after the events of the Iliad. The Odyssey says Antilochus, Nestor's son, was killed by him.",["antilochus","nestor","g_eos","g_ethiopians"]],
["g_heracles","هراکلس","Heracles","Ἡρακλῆς","Hercules","figure","Herakles, Hercules | هرکول","بزرگ‌ترین قهرمان نسل پیشین. آگاممنون در سرود ۱۹ می‌گوید چگونه هرا با فریب زئوس زاده شدن او را به تأخیر انداخت. در سفر اودیسئوس به جهان زیرین، او «سایه»ی هراکلس را با کمانی آماده می‌بیند، در حالی که خود هراکلس در المپ کنار هبه است. کمان اودیسئوس نیز از راه ایفیتوس به خاندان هراکلس پیوند دارد.","The greatest hero of the earlier generation. In Book 19 Agamemnon tells how Hera tricked Zeus to delay his birth. In the Odyssey's underworld, Odysseus sees his phantom with bow drawn, while Heracles himself is on Olympus with Hebe. Odysseus' bow also connects to Heracles' story through Iphitus.",["hera","zeus","nekyia","g_hebe","g_bow"]],
["g_meleager","ملئاگروس","Meleager","Μελέαγρος","Meleager","figure","Meleagros, Calydonian boar | ملیگر","قهرمان کالودون که فوینیکس در سرود ۹ داستانش را برای آشیل می‌گوید: او نیز از سر خشم از جنگ کناره گرفت، هدایا را نپذیرفت و سرانجام بی‌پاداش به نبرد بازگشت. فوینیکس با این داستان به آشیل هشدار می‌دهد.","The hero of Calydon whose story Phoenix tells Achilles in Book 9: he too withdrew from battle in anger, refused gifts and finally returned to fight with no reward. Phoenix tells it as a warning to Achilles.",["phoenix","achilles","embassy","g_calydon"]],
["g_bellerophon","بلروفون","Bellerophon","Βελλεροφόντης","Bellerophon","figure","Bellerophontes, Chimaera, Chimera | کیمرا","پدربزرگ گلاوکوس، که گلاوکوس در سرود ۶ داستانش را برای دیومدس می‌گوید: او کیمرا، هیولای آتش‌افکن، را کشت و با آمازون‌ها و سولومیان جنگید. پیوند مهمانی خاندان او با پدربزرگ دیومدس، دو جنگاور را از نبرد بازمی‌دارد.","Glaucus' grandfather, whose story Glaucus tells Diomedes in Book 6: he killed the fire-breathing Chimera and fought the Amazons and the Solymi. His family's guest-friendship with Diomedes' grandfather keeps the two warriors from fighting.",["glaucus","diomedes","g_amazons","g_lycia"]],
["g_niobe","نیوبه","Niobe","Νιόβη","Niobe","figure","Niobe | نیوبی","مادری که به داشتن دوازده فرزند در برابر لتو فخر فروخت و آپولون و آرتمیس همه را کشتند. در سرود ۲۴ آشیل داستان او را برای پریام می‌گوید: حتی نیوبه پس از آن سوگ دوباره غذا خورد، پس پریام نیز باید غذا بخورد.","A mother who boasted of her twelve children over Leto, and Apollo and Artemis killed them all. In Book 24 Achilles tells Priam her story: even Niobe turned to food after her grief, so Priam too should eat.",["achilles","priam","leto","apollo","artemis"]],
["g_tantalus","تانتالوس","Tantalus","Τάνταλος","Tantalus","figure","Tantalos | تانتال","یکی از گناهکارانی که اودیسئوس در جهان زیرین می‌بیند: در آبگیری تا چانه ایستاده، اما هر بار که خم می‌شود آب فرو می‌رود و میوه‌های بالای سرش با باد دور می‌شوند. واژه‌ی انگلیسی tantalize از نام اوست.","One of the sinners Odysseus sees in the underworld: he stands in a pool up to his chin, but the water drains whenever he bends to drink and the fruit above him blows away. The English word 'tantalize' comes from his name.",["nekyia","hades"]],
["g_sisyphus","سیزیف","Sisyphus","Σίσυφος","Sisyphus","figure","Sisyphos | سیسوفوس","گناهکاری که اودیسئوس در جهان زیرین می‌بیند: سنگی بزرگ را به سختی تا بالای تپه می‌غلتاند و سنگ هر بار پیش از رسیدن به قله دوباره فرو می‌غلتد.","A sinner Odysseus sees in the underworld: he strains to roll a huge boulder uphill, and every time, just before the top, it rolls back down.",["nekyia","hades"]],
["g_tityos","تیتوس","Tityos","Τιτυός","Tityus","figure","Tityus | تیتیوس","غولی که به لتو تجاوز کرد. اودیسئوس او را در جهان زیرین می‌بیند که بر زمین افتاده و دو کرکس جگرش را می‌خورند.","A giant who assaulted Leto. Odysseus sees him in the underworld, stretched on the ground while two vultures tear at his liver.",["nekyia","leto"]],
["g_minos","مینوس","Minos","Μίνως","Minos","figure","Minos of Crete | مینوس","پادشاه افسانه‌ای کرت و پسر زئوس، پدربزرگ ایدومنئوس. اودیسئوس او را در جهان زیرین می‌بیند که با عصای زرین میان مردگان داوری می‌کند.","The legendary king of Crete, son of Zeus and grandfather of Idomeneus. Odysseus sees him in the underworld, holding a golden scepter and judging the dead.",["nekyia","crete","idomeneus","zeus"]],
["g_orion","اوریون","Orion","Ὠρίων","Orion","figure","Orion the hunter | شکارچی","شکارچی غول‌پیکر. کالیپسو در اودیسه می‌گوید آرتمیس او را کشت چون ایزدبانوی سپیده‌دم عاشقش شده بود. اودیسئوس سایه‌اش را در جهان زیرین در حال شکار می‌بیند. صورت فلکی او بر سپر آشیل نیز نقش بسته است.","A giant hunter. In the Odyssey Calypso says Artemis killed him because Dawn had fallen in love with him. Odysseus sees his shade hunting in the underworld. His constellation also appears on the Shield of Achilles.",["artemis","calypso","nekyia","shield"]],
["g_oedipus","اودیپوس و اپیکاسته","Oedipus & Epicaste","Οἰδιπόδης · Ἐπικάστη","Oedipus · Iocasta","figure","Oedipus, Oidipous, Epicaste, Jocasta, Iocaste | ادیپ, ژوکاست","در جهان زیرین، اودیسئوس اپیکاسته (که در منابع بعدی یوکاسته نام دارد) را می‌بیند که ناآگاهانه با پسرش اودیپوس ازدواج کرد و چون حقیقت آشکار شد، خود را حلق‌آویز کرد. اودیپوس در تبای ماند و رنج کشید.","In the underworld, Odysseus sees Epicaste (called Jocasta in later sources), who unknowingly married her son Oedipus and hanged herself when the truth came out. Oedipus stayed on in Thebes and suffered.",["nekyia","g_thebes"]],
["g_chiron","خیرون","Chiron","Χείρων","Chiron","figure","Cheiron, centaur | کایرون","کنتاور خردمند، «دادگرترین کنتاورها»، که آشیل را پرورد و دانش داروها را به او آموخت. نیزه‌ی آشیل، از چوب زبان‌گنجشکِ کوه پلیون، هدیه‌ی خیرون به پلئوس بود و جز آشیل کسی نمی‌توانست آن را به کار ببرد.","The wise centaur, 'most just of the centaurs', who raised Achilles and taught him medicine. Achilles' ash spear from Mount Pelion was Chiron's gift to Peleus, and no one but Achilles could wield it.",["achilles","peleus","g_centaurs"]],
["g_atreus","آترئوس","Atreus","Ἀτρεύς","Atreus","figure","Atreus, Atreides, Atridae | آتریدها","پدر آگاممنون و منلائوس؛ به همین دلیل این دو برادر را «آتریدها» (پسران آترئوس) می‌نامند. عصای شاهی آگاممنون از او به برادرش توئستس و سپس به آگاممنون رسید.","Father of Agamemnon and Menelaus, who are therefore called the 'Atreidae' (sons of Atreus). Agamemnon's royal scepter passed from him to his brother Thyestes and then to Agamemnon.",["agamemnon","menelaus","g_scepter"]],
["g_tydeus","تودئوس","Tydeus","Τυδεύς","Tydeus","figure","Tydeus, Tydides | تیدئوس","پدر دیومدس و از «هفت تن در برابر تبای». آگاممنون در سرود ۴ و آتنا در سرود ۵ با یادآوری دلاوری‌های او دیومدس را به نبرد برمی‌انگیزند.","Father of Diomedes and one of the Seven against Thebes. Agamemnon in Book 4 and Athena in Book 5 spur Diomedes on by recalling his father's deeds.",["diomedes","athena","agamemnon","g_thebes"]],
["g_telamon","تلامون","Telamon","Τελαμών","Telamon","figure","Telamon, Telamonian | تلامون","پادشاه سالامیس و پدر آژاکس بزرگ و توکروس. آژاکس را «آژاکس تلامونی» می‌نامند.","King of Salamis and father of Ajax the Great and Teucer. Ajax is called 'Telamonian Ajax'.",["ajax","teucer","g_salamis"]],
["g_eetion","ائتیون","Eetion","Ἠετίων","Eetion","figure","Eetion of Thebe | اتیون","پدر آندروماخه و پادشاه تبه. آشیل او را کشت اما پیکرش را با سلاح‌هایش به احترام سوزاند. چنگ آشیل، اسب پداسوس و توده‌ی آهنی که در مسابقه‌های سوگ پاتروکلوس پرتاب شد، از غنیمت‌های شهر او بودند.","Andromache's father and king of Thebe. Achilles killed him but honorably burned his body in his armor. Achilles' lyre, the horse Pedasus and the iron weight used in the funeral games came from the plunder of his city.",["andromache","achilles","g_thebe"]],
["g_euryalus","ائورولوس","Euryalus","Εὐρύαλος","Euryalus","figure","Euryalos, Laodamas, discus | لائوداماس","جوان فایاکی که در بازی‌های سرود ۸ اودیسئوس را مسخره می‌کند و او را بازرگانی بی‌هنر می‌خواند. اودیسئوس سنگی را دورتر از همه پرتاب می‌کند و ائورولوس بعد با هدیه‌ی شمشیری پوزش می‌خواهد. لائوداماس، پسر آلکینوئوس، کسی است که اودیسئوس را به بازی فرامی‌خواند.","A young Phaeacian who taunts Odysseus at the games of Book 8, calling him an unathletic merchant. Odysseus hurls a discus farther than anyone, and Euryalus later apologizes with the gift of a sword. Laodamas, Alcinous' son, is the one who invites Odysseus to compete.",["odysseus","alcinous","scheria"]],
["g_halitherses","هالیترسس","Halitherses","Ἁλιθέρσης","Halitherses","figure","Halitherses, eagle omen | هالیترس","پیشگوی سالخورده‌ی ایتاکا. در انجمن سرود ۲، دو عقاب را نشانه‌ی بازگشت نزدیک اودیسئوس و نابودی خواستگاران می‌داند. در سرود ۲۴ به خانواده‌های خواستگاران هشدار می‌دهد که انتقام نگیرند.","Ithaca's elderly seer. At the assembly in Book 2 he reads two eagles as a sign of Odysseus' imminent return and the suitors' doom. In Book 24 he warns the suitors' families not to seek revenge.",["telemachus","suitors","ithaca"]],
["g_eupeithes","ائوپیتس","Eupeithes","Εὐπείθης","Eupithes","figure","Eupeithes, father of Antinous | اوپیتس","پدر آنتینوئوس که پس از کشتار، خانواده‌های خواستگاران را به انتقام از اودیسئوس برمی‌انگیزد. لائرتس با نیرویی که آتنا به او داده او را با نیزه می‌کشد و سپس آتنا جنگ را پایان می‌دهد.","Antinous' father, who rouses the suitors' families to take revenge on Odysseus. Laertes, strengthened by Athena, kills him with a spear, and Athena then ends the fighting.",["antinous","laertes","athena","suitors"]],
["g_dolius","دولیوس","Dolius","Δολίος","Dolius","figure","Dolius, old servant | دولیوس","خدمتکار پیر و وفادار لائرتس که با پسرانش در کشتزار کار می‌کند. در سرود ۲۴ از دیدن اودیسئوس شاد می‌شود و در نبرد پایانی همراه اوست. شگفت آنکه پدر ملانتیوس و ملانتو، دو خدمتکار خیانتکار، نیز «دولیوس» نام دارد.","Laertes' old and loyal servant who works the farm with his sons. In Book 24 he rejoices to see Odysseus and joins him in the final fight. Oddly, the two treacherous servants Melanthius and Melantho are also called children of 'Dolius'.",["laertes","odysseus","melanthius","melantho"]],
["g_medon","مدون","Medon","Μέδων","Medon","figure","Medon, herald | مدون","جارچی کاخ ایتاکا. نقشه‌ی خواستگاران برای کمین تلماخوس را به پنلوپه خبر می‌دهد. در کشتار، تلماخوس از اودیسئوس می‌خواهد از کشتن او بگذرد، و مدون که زیر پوست گاوی پنهان شده بود جان به در می‌برد.","The herald of the Ithacan palace. He warns Penelope of the suitors' plan to ambush Telemachus. In the slaughter, Telemachus asks Odysseus to spare him; he survives hidden under an oxhide.",["penelope","telemachus","suitors","phemius"]],
["g_ctesippus","کتسیپوس","Ctesippus","Κτήσιππος","Ctesippus","figure","Ktesippos, ox hoof | کتسیپ","خواستگاری از جزیره‌ی سامه که به تمسخر سم گاوی به سوی گدای ناشناس پرتاب می‌کند. در کشتار، فیلویتیوس گاوچران او را می‌کشد و به طعنه می‌گوید این پاداش آن «هدیه» است.","A suitor from Same who mockingly throws an ox hoof at the unknown beggar. In the slaughter, Philoetius the cowherd kills him and jeers that this repays his 'gift'.",["suitors","philoetius","odysseus","g_same"]],
["g_leodes","لئودس","Leodes","Λειώδης","Leodes","figure","Leiodes, suitor priest | لیودس","خواستگاری که برای دیگر خواستگاران فال قربانی می‌گرفت و از گستاخی آنان بیزار بود. نخستین کسی است که کمان را می‌آزماید و نمی‌تواند زه کند. در کشتار به زانو می‌افتد و امان می‌خواهد، اما اودیسئوس او را نمی‌بخشد.","A suitor who served as their sacrificial priest and disliked the others' insolence. He is the first to try the bow and fails to string it. In the slaughter he kneels and begs for mercy, but Odysseus does not spare him.",["contest","suitors","odysseus"]],
["g_noemon","نوئمون","Noemon","Νοήμων","Noemon","figure","Noemon | نوئمون","مردی از ایتاکا که کشتی خود را به تلماخوس قرض می‌دهد. وقتی ساده‌دلانه از خواستگاران می‌پرسد کشتی‌اش کی بازمی‌گردد، آنان از سفر پنهانی تلماخوس آگاه می‌شوند و نقشه‌ی کمین را می‌کشند.","An Ithacan who lends Telemachus his ship. When he innocently asks the suitors when it will return, they learn of Telemachus' secret voyage and plot their ambush.",["telemachus","suitors","antinous"]],
["g_hermione","هرمیونه","Hermione","Ἑρμιόνη","Hermione","figure","Hermione, Megapenthes | مگاپنتس","تنها دختر منلائوس و هلن. وقتی تلماخوس به اسپارت می‌رسد، منلائوس جشن عروسی او با نئوپتولموس، پسر آشیل، و عروسی پسرش مگاپنتس را برپا کرده است.","The only daughter of Menelaus and Helen. When Telemachus arrives in Sparta, Menelaus is celebrating her wedding to Neoptolemus, Achilles' son, and the wedding of his son Megapenthes.",["helen","menelaus","neoptolemus","sparta"]],
["g_telemus","تلموس","Telemus","Τήλεμος","Telemus","figure","Telemos, seer of the Cyclopes | تلموس","پیشگوی کوکلوپس‌ها که پیش‌تر به پولیفموس گفته بود مردی به نام اودیسئوس او را کور خواهد کرد. پولیفموس پس از کوری به یاد این پیشگویی می‌افتد.","The seer of the Cyclopes, who had once told Polyphemus that a man named Odysseus would blind him. Polyphemus remembers the prophecy after he is blinded.",["polyphemus","odysseus","g_cyclopes"]],
["g_iphitus","ایفیتوس","Iphitus","Ἴφιτος","Iphitus","figure","Iphitos, Eurytus | اوروتوس","پسر ائوروتوس، کماندار بزرگ، که کمان پدرش را به اودیسئوس جوان هدیه داد. بعدها هراکلس او را در خانه‌ی خود کشت. اودیسئوس این کمان را به تروا نبرد و در خانه به یادگار نگه داشت؛ همان کمان مسابقه است.","Son of the great archer Eurytus, who gave his father's bow to the young Odysseus. Heracles later murdered him in his own house. Odysseus did not take the bow to Troy but kept it at home as a keepsake; it is the bow of the contest.",["odysseus","contest","g_heracles","g_bow"]],
["g_menoetius","منویتیوس","Menoetius","Μενοίτιος","Menoetius","figure","Menoitios, father of Patroclus | منوئتیوس","پدر پاتروکلوس. پس از آنکه پاتروکلوس در کودکی ناخواسته همبازی‌اش را کشت، او را به خانه‌ی پلئوس آورد و همان‌جا پاتروکلوس با آشیل بزرگ شد. نستور یادآوری می‌کند که منویتیوس از پاتروکلوس خواسته بود رایزن آشیل باشد.","Patroclus' father. After Patroclus accidentally killed a playmate as a boy, Menoetius brought him to Peleus' house, where he grew up with Achilles. Nestor recalls that Menoetius told Patroclus to be Achilles' counselor.",["patroclus","peleus","nestor"]],
["g_eurybates","ائوروباتس","Eurybates","Εὐρυβάτης","Eurybates","figure","Eurybates, herald | اوریباتس","نام دو جارچی در ایلیاد: یکی همراه تالتوبیوس بریسئیس را از آشیل می‌برد، و دیگری جارچی اودیسئوس است که به گفته‌ی اودیسئوس در اودیسه، پوستی تیره و موهای فرفری داشت.","The name of two heralds in the Iliad: one who takes Briseis from Achilles with Talthybius, and another, Odysseus' herald, described in the Odyssey as dark-skinned with curly hair.",["talthybius","briseis","odysseus"]],
// places
["g_tenedos","تندوس","Tenedos","Τένεδος","Tenedus","place","Tenedos, Bozcaada | بوزجاآدا","جزیره‌ای کوچک روبه‌روی تروا. کریسس در دعای خود آپولون را فرمانروای تندوس می‌خواند. پوزئیدون اسبانش را میان تندوس و ایمبروس نگه می‌دارد. نستور در اودیسه می‌گوید پس از جنگ نخست به تندوس رفتند و آنجا میان یونانیان اختلاف افتاد.","A small island facing Troy. Chryses calls Apollo lord of Tenedos in his prayer. Poseidon stables his horses between Tenedos and Imbros. In the Odyssey, Nestor says that after the war they first sailed to Tenedos, where the Greeks fell out.",["apollo","chryses","poseidon","nestor","troy"]],
["g_lemnos","لمنوس","Lemnos","Λῆμνος","Lemnus","place","Lemnos, Limnos | لیمنوس","جزیره‌ای در شمال اژه، سرزمین محبوب هفائستوس. وقتی زئوس او را از آسمان پرتاب کرد، یک روز تمام افتاد و در لمنوس فرود آمد. فیلوکتتس در آنجا رها شد و هرا در سرود ۱۴ برای دیدار با خواب به آنجا می‌رود.","An island in the northern Aegean, Hephaestus' favorite land. When Zeus hurled him from heaven he fell for a whole day and landed on Lemnos. Philoctetes was abandoned there, and in Book 14 Hera goes there to find Sleep.",["hephaestus","philoctetes","hypnos","hera"]],
["g_aulis","آولیس","Aulis","Αὐλίς","Aulis","place","Aulis | آولیس","بندری در بوئوتیا که ناوگان یونان پیش از حرکت به تروا در آن گرد آمد. اودیسئوس در سرود ۲ نشانه‌ی آنجا را یادآوری می‌کند: ماری هشت جوجه‌گنجشک و مادرشان را بلعید، و کالخاس این نه پرنده را به نه سال جنگ و پیروزی در سال دهم تعبیر کرد. (نام این بندر را گاه «اولیس» هم می‌نویسند که نباید با اولیس، نام لاتینی اودیسئوس، اشتباه شود.)","A harbor in Boeotia where the Greek fleet gathered before sailing to Troy. In Book 2 Odysseus recalls the omen there: a snake ate nine sparrows, which Calchas read as nine years of war and victory in the tenth. (Not to be confused with 'Ulysses'.)",["calchas","odysseus","ships","agamemnon"]],
["g_hellespont","هلسپونت (داردانل)","Hellespont","Ἑλλήσποντος","Hellespontus","place","Hellespont, Dardanelles, Çanakkale | تنگه‌ی داردانل","تنگه‌ای که دریای اژه را به مرمره می‌پیوندد و تروا در کنار آن است. در اودیسه، روح آگاممنون می‌گوید یونانیان گور آشیل و پاتروکلوس را بر دماغه‌ای بلند کنار هلسپونت ساختند تا از دریا دیده شود.","The strait linking the Aegean to the Sea of Marmara, beside which Troy stands. In the Odyssey, Agamemnon's ghost says the Greeks built the tomb of Achilles and Patroclus on a high headland by the Hellespont, visible from the sea.",["troy","achilles","patroclus","ships"]],
["g_simois","رود سیمویس","Simois","Σιμόεις","Simois","place","Simoeis, river | سیموئیس","دومین رود دشت تروا که به اسکاماندروس می‌ریزد. در سرود ۲۱، اسکاماندروس از سیمویس یاری می‌خواهد تا با هم آشیل را غرق کنند.","The second river of the Trojan plain, which joins the Scamander. In Book 21 the Scamander calls on the Simois to help drown Achilles.",["scamander","achilles","troy"]],
["g_chryse","کریسه","Chryse","Χρύση","Chryse","place","Chryse | کریسا","شهرک کرانه‌ای نزدیک تروا با پرستشگاه آپولون، جای خدمت کریسس. در سرود ۱ اودیسئوس با کشتی کریسئیس را به آنجا بازمی‌گرداند و قربانی‌ای بزرگ برگزار می‌شود.","A coastal town near Troy with a temple of Apollo, where Chryses served. In Book 1 Odysseus sails Chryseis back there and a great sacrifice is held.",["chryses","apollo","odysseus","g_chryseis"]],
["g_thebe","تبه","Thebe","Θήβη Ὑποπλακίη","Thebe","place","Thebe under Plakos, Hypoplakian Thebe | تبه‌ی زیر پلاکوس","شهری در آسیای صغیر زیر کوه پلاکوس، زادگاه آندروماخه، که آشیل آن را غارت کرد و پدر و برادران آندروماخه را کشت. کریسئیس هم در همین یورش اسیر شد. نباید با تبای یونان یا تبای مصر اشتباه شود.","A city in Asia Minor below Mount Plakos, Andromache's birthplace, sacked by Achilles, who killed her father and brothers. Chryseis was captured in the same raid. Not to be confused with Greek Thebes or Egyptian Thebes.",["andromache","achilles","g_eetion","g_chryseis"]],
["g_lycia","لوکیا","Lycia","Λυκίη","Lycia","place","Lykia, Xanthus river | لیکیا","سرزمینی در جنوب غربی آسیای صغیر کنار رود کسانتوس، میهن سارپدون و گلاوکوس. ایزدان خواب و مرگ پیکر سارپدون را برای خاکسپاری به آنجا بازمی‌گردانند. بلروفون نیز در آنجا کیمرا را کشت.","A land in southwestern Asia Minor by the river Xanthus, home of Sarpedon and Glaucus. Sleep and Death carry Sarpedon's body back there for burial. Bellerophon killed the Chimera there.",["sarpedon","glaucus","hypnos","g_lycians","g_bellerophon"]],
["g_thrace","تراکیه","Thrace","Θρῄκη","Thracia","place","Thrake, Thracia | تراکیا","سرزمینی در شمال اژه با اسبان نامدار و شراب نیرومند. رسوس و کیکون‌ها از آنجا هستند. در ترانه‌ی دمودوکوس، آرس پس از رهایی از تور هفائستوس به تراکیه می‌گریزد.","A land north of the Aegean known for fine horses and strong wine. Rhesus and the Cicones come from there. In Demodocus' song, Ares flees to Thrace after escaping Hephaestus' net.",["rhesus","cicones","ares","g_thracians"]],
["g_cyprus","قبرس و پافوس","Cyprus & Paphos","Κύπρος · Πάφος","Cyprus · Paphus","place","Kypros, Paphos, Cypris | پافوس","جزیره‌ی آفرودیته، که به همین دلیل «کوپریس» (بانوی قبرس) خوانده می‌شود. در ترانه‌ی دمودوکوس، آفرودیته پس از رسوایی به پرستشگاهش در پافوس می‌رود. زره آگاممنون هدیه‌ی کینوراس، پادشاه قبرس، بود.","Aphrodite's island, which is why she is called 'Cypris'. In Demodocus' song, she retreats to her shrine at Paphos after the scandal. Agamemnon's breastplate was a gift from Cinyras, king of Cyprus.",["aphrodite","agamemnon","demodocus"]],
["g_phrygia","فروگیه","Phrygia","Φρυγίη","Phrygia","place","Phrygia, Sangarius | فریگیه","سرزمینی در درون آسیای صغیر و هم‌پیمان تروا. هکابه از آنجاست و برادرش آسیوس کنار رود سنگاریوس زندگی می‌کند. پریام در جوانی در فروگیه در برابر آمازون‌ها جنگیده است.","An inland region of Asia Minor allied with Troy. Hecuba comes from there, and her brother Asius lives by the river Sangarius. In his youth Priam fought the Amazons in Phrygia.",["hecuba","priam","troy","g_amazons"]],
["g_thebes","تبای (یونان)","Thebes (Greece)","Θῆβαι","Thebae","place","Thebai, Seven against Thebes, Boeotia | تبس, هفت تن در برابر تبای","شهر بزرگ بوئوتیا و زادگاه تیرزیاس. تودئوس، پدر دیومدس، در جنگ «هفت تن» بر ضد آن جنگید و پسرانشان سرانجام آن را گشودند. سرگذشت اودیپوس نیز در آن رخ داد.","The great city of Boeotia and Tiresias' home. Tydeus, Diomedes' father, fought against it with the Seven, and their sons later took it. The story of Oedipus also took place there.",["tiresias","diomedes","g_tydeus","g_oedipus"]],
["g_calydon","کالودون","Calydon","Καλυδών","Calydon","place","Kalydon, Aetolia, Calydonian boar | کالیدون","شهری در آیتولیا و صحنه‌ی داستان ملئاگروس که فوینیکس برای آشیل بازمی‌گوید: آرتمیس گرازی وحشی بر آن فرستاد و جنگی میان کورت‌ها و آیتولیان درگرفت.","A city in Aetolia and the setting of the Meleager story Phoenix tells Achilles: Artemis sent a wild boar against it, and war broke out between the Curetes and the Aetolians.",["phoenix","artemis","g_meleager"]],
["g_salamis","سالامیس","Salamis","Σαλαμίς","Salamis","place","Salamis | سالامین","جزیره‌ای نزدیک آتن و سرزمین تلامون. آژاکس بزرگ دوازده کشتی از آنجا به تروا آورد.","An island near Athens and the land of Telamon. Ajax the Great brought twelve ships from there to Troy.",["ajax","teucer","g_telamon"]],
["g_athens","آتن","Athens","Ἀθῆναι","Athenae","place","Athenai, Athenians, Menestheus, Erechtheus | آتنی‌ها","در فهرست کشتی‌ها، آتنیان به فرماندهی منستئوس پنجاه کشتی می‌آورند. در اودیسه، آتنا پس از دیدار با اودیسئوس در اسخریا به آتن، به خانه‌ی ارختئوس، می‌رود.","In the Catalogue of Ships, the Athenians under Menestheus bring fifty ships. In the Odyssey, after meeting Odysseus on Scheria, Athena goes to Athens, to the house of Erechtheus.",["athena","ships"]],
["g_scyros","اسکوروس","Scyros","Σκῦρος","Scyrus","place","Skyros | اسکیروس","جزیره‌ای در اژه که نئوپتولموس در آن بزرگ شد. اودیسئوس به روح آشیل می‌گوید که خود پسرش را با کشتی از اسکوروس به تروا آورد.","An Aegean island where Neoptolemus grew up. Odysseus tells Achilles' ghost that he himself brought his son from Scyros to Troy by ship.",["neoptolemus","achilles","odysseus"]],
["g_dodona","دودونا","Dodona","Δωδώνη","Dodona","place","Dodona, oracle, oak | دودون","پرستشگاه کهن زئوس در شمال غربی یونان، که کاهنانش پابرهنه بر زمین می‌خوابند. آشیل در سرود ۱۶ به «زئوس دودونایی» دعا می‌کند تا پاتروکلوس پیروز و سالم بازگردد. در داستان ساختگی اودیسئوس، او برای شنیدن سخن بلوط مقدس زئوس به دودونا رفته است.","The ancient shrine of Zeus in northwestern Greece, whose priests sleep on the bare ground. In Book 16 Achilles prays to 'Zeus of Dodona' for Patroclus' victory and safe return. In one of Odysseus' invented tales, he has gone to Dodona to hear Zeus' sacred oak.",["zeus","achilles","patroclus","odysseus"]],
["g_pytho","پوتو (دلفی)","Pytho (Delphi)","Πυθώ","Pytho · Delphi","place","Delphi, Pytho, oracle | دلفی, پیشگاه دلفی","پرستشگاه آپولون که بعدها دلفی نامیده شد. آشیل در سرود ۹ از گنج‌های آن یاد می‌کند. در اودیسه، دمودوکوس می‌خواند که آگاممنون پیش از جنگ در پوتو از آپولون پیشگویی گرفته بود.","Apollo's shrine, later called Delphi. In Book 9 Achilles mentions its treasures. In the Odyssey, Demodocus sings that Agamemnon received a prophecy from Apollo at Pytho before the war.",["apollo","agamemnon","achilles","demodocus"]],
["g_delos","دلوس","Delos","Δῆλος","Delos","place","Delos, palm tree | دلس","جزیره‌ی زادگاه آپولون و آرتمیس. اودیسئوس نائوسیکا را به نهال نخلی که روزی کنار محراب آپولون در دلوس دیده بود مانند می‌کند.","The island where Apollo and Artemis were born. Odysseus compares Nausicaa to a young palm tree he once saw beside Apollo's altar on Delos.",["nausicaa","odysseus","apollo","artemis"]],
["g_dulichium","دولیخیون","Dulichium","Δουλίχιον","Dulichium","place","Doulichion, Dulichion | دولیکیوم","جزیره‌ای در قلمرو اودیسئوس. بیشترین شمار خواستگاران، پنجاه و دو تن، از آنجا بودند، از جمله آمفینوموس.","An island in Odysseus' realm. The largest group of suitors, fifty-two, came from there, including Amphinomus.",["suitors","amphinomus","ithaca","g_same","g_zacynthus"]],
["g_same","سامه","Same","Σάμη","Same","place","Same, Samos, Cephallenia | سامی","جزیره‌ای در قلمرو اودیسئوس، که معمولاً همان کفالونیای امروز دانسته می‌شود. بیست و چهار خواستگار، از جمله کتسیپوس، از آنجا بودند. خواستگاران در تنگه‌ی میان سامه و ایتاکا برای تلماخوس کمین کردند.","An island in Odysseus' realm, usually identified with modern Kefalonia. Twenty-four suitors came from there, including Ctesippus. The suitors laid their ambush for Telemachus in the strait between Same and Ithaca.",["suitors","telemachus","ithaca","g_cephallenians","g_ctesippus"]],
["g_zacynthus","زاکونتوس","Zacynthus","Ζάκυνθος","Zacynthus","place","Zakynthos, Zante | زاکینتوس, زانته","جزیره‌ی پوشیده از جنگل در قلمرو اودیسئوس. بیست خواستگار از آنجا بودند. دوازده تن باقی‌مانده از ۱۰۸ خواستگار از خود ایتاکا بودند.","A wooded island in Odysseus' realm. Twenty suitors came from there; the remaining twelve of the 108 were from Ithaca itself.",["suitors","ithaca","g_dulichium","g_same"]],
["g_neriton","کوه نریتون","Mount Neriton","Νήριτον","Neritus","place","Neritos, Neritum | نریتوس","کوه پوشیده از جنگل ایتاکا که لرزش برگ‌هایش از دور پیداست. اودیسئوس هنگام معرفی خود به فایاکیان از آن نام می‌برد، و آتنا در سرود ۱۳ آن را به اودیسئوس نشان می‌دهد تا ایتاکا را بازشناسد.","Ithaca's wooded mountain with its trembling leaves visible from afar. Odysseus names it when introducing himself to the Phaeacians, and Athena points it out in Book 13 so he will recognize Ithaca.",["ithaca","odysseus","athena"]],
["g_phorcys","بندر فورکوس و غار پریان","Harbor of Phorcys & Cave of the Nymphs","Φόρκυνος λιμήν","Portus Phorcynis","place","Phorkys, Phorcys, cave of the nymphs, harbour, olive tree | غار پریان","بندری در ایتاکا که به نام فورکوس، ایزد پیر دریا، خوانده می‌شود و درخت زیتونی بلند و غاری مقدسِ پریان در کنار آن است. فایاکیان اودیسئوسِ خفته را با هدایایش آنجا بر ساحل می‌گذارند و آتنا هدایا را در غار پنهان می‌کند.","A harbor on Ithaca named after Phorcys, an old sea god, with a tall olive tree and a cave sacred to the nymphs beside it. The Phaeacians set the sleeping Odysseus ashore there with his gifts, and Athena hides the treasure in the cave.",["ithaca","scheria","athena","odysseus","g_thoosa"]],
["g_thrinacia","تریناکیه","Thrinacia","Θρινακίη","Trinacria","place","Thrinakia, Trinacria, Sicily | سیسیل, جزیره‌ی خورشید","جزیره‌ای که گاوها و گوسفندان مقدس هلیوس در آن چرا می‌کنند. بادهای مخالف یک ماه یاران اودیسئوس را آنجا نگه می‌دارند تا گرسنگی وادارشان کند گاوها را بکشند. رومیان آن را با سیسیل یکی می‌دانستند.","The island where Helios' sacred cattle and sheep graze. Contrary winds keep Odysseus' crew there for a month until hunger drives them to kill the cattle. The Romans identified it with Sicily.",["cattle","helios","eurylochus","g_lampetia"]],
["g_aeolia","آیولیا","Aeolia","Αἰολίη","Aeolia","place","Aiolia, floating island | جزیره‌ی بادها","جزیره‌ی شناور آئولوس با دیواری از مفرغ و صخره‌های صاف. آئولوس با شش پسر و شش دخترش آنجا زندگی می‌کند و اودیسئوس یک ماه مهمان اوست.","Aeolus' floating island, ringed by a bronze wall and sheer cliffs. Aeolus lives there with his six sons and six daughters, and Odysseus is his guest for a month.",["aeolus","odysseus","g_winds"]],
["g_pharos","فاروس","Pharos","Φάρος","Pharus","place","Pharos, Alexandria | فانوس","جزیره‌ای کوچک روبه‌روی مصر، یک روز راه با کشتی از کرانه، که منلائوس بیست روز در آن گرفتار بود تا پروتئوس را گرفت. بعدها فانوس دریایی معروف اسکندریه در آنجا ساخته شد.","A small island off Egypt, a day's sail from the coast, where Menelaus was stranded for twenty days until he caught Proteus. The famous lighthouse of Alexandria was later built there.",["proteus","menelaus","egypt"]],
["g_sidon","صیدون و فنیقیه","Sidon & Phoenicia","Σιδών · Φοίνικες","Sidon · Phoenices","place","Sidonians, Phoenicians, Phoinikes | فنیقی‌ها, صیدا","سرزمین بازرگانان و صنعتگران ماهر کرانه‌ی شام. هکابه از جامه‌های گلدوزی‌شده‌ی صیدونی که پاریس آورده بود، زیباترین را نذر آتنا می‌کند. جام نقره‌ای که آشیل در مسابقه‌ها جایزه می‌دهد و جامی که منلائوس به تلماخوس می‌دهد، کار صیدونیان است. ائومائوس را نیز فنیقیان ربودند و فروختند.","The land of skilled traders and craftsmen on the Levantine coast. Hecuba offers Athena the finest of the Sidonian embroidered robes Paris brought home. The silver bowl Achilles gives as a prize and the bowl Menelaus gives Telemachus are Sidonian work. Phoenician traders also kidnapped and sold Eumaeus.",["hecuba","paris","menelaus","eumaeus"]],
["g_ocean","اقیانوس (اوکئانوس)","Ocean (Oceanus)","Ὠκεανός","Oceanus","place","Okeanos, Oceanus, Tethys | اوکئانوس, تتوس","رود بزرگی که گرداگرد زمین روان است؛ اوکئانوس ایزدِ این رود نیز هست. هرا در ایلیاد او و همسرش تتوس را سرچشمه‌ی خدایان می‌خواند. لبه‌ی بیرونی سپر آشیل نقش اقیانوس است، و کشتی اودیسئوس برای رسیدن به جهان زیرین تا کرانه‌ی آن می‌رود.","The great river encircling the earth, and also a god. In the Iliad Hera calls him and his wife Tethys the origin of the gods. The outer rim of the Shield of Achilles shows Ocean, and Odysseus' ship sails to its shore to reach the underworld.",["shield","nekyia","hera","g_cimmerians"]],
["g_elysium","دشت الیزه","Elysian Fields","Ἠλύσιον πεδίον","Elysium · Campi Elysii","place","Elysium, Elysian plain, Champs-Élysées | الیزه, الیزیوم","سرزمینی در کرانه‌ی جهان، جایی که زندگی آسان است و برف و باران نمی‌بارد. پروتئوس به منلائوس می‌گوید او نخواهد مرد، بلکه خدایان او را به آنجا خواهند برد چون همسر هلن و داماد زئوس است.","A land at the edge of the world where life is easy and there is no snow or rain. Proteus tells Menelaus he will not die but will be taken there by the gods, because he is Helen's husband and so Zeus' son-in-law.",["menelaus","proteus","helen"]],
["g_tartarus","تارتاروس","Tartarus","Τάρταρος","Tartarus","place","Tartaros, abyss | تارتار","مغاکی تاریک بسیار پایین‌تر از جهان مردگان که تیتان‌ها و کرونوس در آن زندانی‌اند. زئوس در سرود ۸ تهدید می‌کند هر ایزدی را که از فرمانش سر بپیچد به تارتاروس پرتاب کند.","A dark abyss far below the land of the dead, where the Titans and Cronus are imprisoned. In Book 8 Zeus threatens to hurl into Tartarus any god who disobeys him.",["zeus","hades","g_titans","g_cronus"]],
["g_asphodel","چمنزار اسفودل","Asphodel Meadow","ἀσφοδελὸς λειμών","Pratum Asphodeli","place","Asphodel Meadows, asphodel | دشت اسفودل","چمنزاری در جهان زیرین که ارواح در آن پرسه می‌زنند. روح آشیل پس از شنیدن خبر دلاوری پسرش با گام‌های بلند بر آن دور می‌شود، و ارواح خواستگاران در سرود ۲۴ به آن می‌رسند.","A meadow in the underworld where the ghosts wander. Achilles' ghost strides away across it, proud after hearing of his son's courage, and the suitors' souls arrive there in Book 24.",["hades","achilles","suitors","neoptolemus"]],
["g_styx","رود استوکس و رودهای جهان زیرین","Styx & the underworld rivers","Στύξ","Styx","place","Styx, Acheron, Cocytus, Kokytos, Pyriphlegethon | آخرون, کوکوتوس","استوکس رودی در جهان زیرین است که بزرگ‌ترین سوگند خدایان به نام آن خورده می‌شود؛ هرا و کالیپسو به آن سوگند می‌خورند. کیرکه در اودیسه رودهای دیگر را نیز نام می‌برد: آخرون، کوکوتوس و پوریفلگتون.","The Styx is a river of the underworld by which the gods swear their greatest oath; Hera and Calypso swear by it. In the Odyssey Circe also names the other rivers: Acheron, Cocytus and Pyriphlegethon.",["hades","hera","calypso","circe"]],
// objects & concepts
["g_aegis","اژیس","Aegis","Αἰγίς","Aegis","object","Aigis, Gorgon, storm shield | سپر زئوس, گورگون","سپر یا پوشش طوفانی و پرشرابه‌ی زئوس با سر گورگون، که آتنا و آپولون هم به کار می‌برند. آپولون در سرود ۱۵ با تکان دادن آن یونانیان را به هراس می‌اندازد و آتنا در سرود ۲۲ اودیسه آن را از سقف تالار بالا می‌برد و خواستگاران وحشت‌زده می‌گریزند.","Zeus' tasseled storm-shield or cape bearing the Gorgon's head, also used by Athena and Apollo. In Book 15 Apollo shakes it and the Greeks panic, and in Odyssey Book 22 Athena raises it from the hall's roof and the suitors flee in terror.",["zeus","athena","apollo","contest"]],
["g_moly","مولو","Moly","μῶλυ","Moly","object","Moly, magic herb | گیاه جادویی","گیاه جادویی با ریشه‌ی سیاه و گل سفید که آدمیان به سختی می‌توانند آن را از زمین بکنند، اما برای خدایان آسان است. هرمس آن را به اودیسئوس می‌دهد تا جادوی کیرکه بر او کارگر نشود.","A magic herb with a black root and a milk-white flower, hard for mortals to dig up but easy for gods. Hermes gives it to Odysseus to protect him against Circe's magic.",["hermes","circe","odysseus"]],
["g_nepenthe","نپنتس (داروی فراموشی)","Nepenthe","νηπενθές","Nepenthes","object","Nepenthes, drug of forgetfulness | دارو, داروی اندوه‌زدا","دارویی که اندوه و خشم را از یاد می‌زداید؛ هلن آن را در شراب مهمانان می‌ریزد. او این دارو را از پولودامنا، همسر تون، در مصر گرفته بود.","A drug that banishes grief and anger; Helen pours it into her guests' wine. She received it in Egypt from Polydamna, the wife of Thon.",["helen","egypt","telemachus","menelaus"]],
["g_ambrosia","آمبروزیا و نکتار","Ambrosia & Nectar","ἀμβροσίη · νέκταρ","Ambrosia · Nectar","object","ambrosia, nectar, ichor | خوراک خدایان, ایکور","خوراک و نوشیدنی خدایان که آنان را جاودان نگه می‌دارد. تتیس آمبروزیا در بینی پاتروکلوس می‌چکاند تا پیکرش فاسد نشود، و آتنا به آشیلِ روزه‌دار نکتار و آمبروزیا می‌دهد. کالیپسو آمبروزیا می‌خورد در حالی که اودیسئوس خوراک انسانی می‌خورد. به جای خون، در رگ‌های خدایان «ایکور» روان است.","The food and drink of the gods that keeps them immortal. Thetis drips ambrosia into Patroclus' nostrils to keep his body from decay, and Athena gives the fasting Achilles nectar and ambrosia. Calypso eats ambrosia while Odysseus eats mortal food. Instead of blood, 'ichor' flows in the gods' veins.",["thetis","patroclus","athena","calypso"]],
["g_scepter","عصای آگاممنون","Agamemnon's Scepter","σκῆπτρον","Sceptrum","object","scepter, sceptre, staff | عصای شاهی","عصای شاهی‌ای که هفائستوس ساخت و از زئوس به هرمس، پلوپس، آترئوس، توئستس و سرانجام به آگاممنون رسید. در سرود ۲ اودیسئوس با همین عصا ترسیتس را می‌زند. در انجمن‌ها هر که عصا را در دست دارد حق سخن دارد.","The royal scepter made by Hephaestus, passed from Zeus to Hermes, Pelops, Atreus, Thyestes and finally Agamemnon. In Book 2 Odysseus beats Thersites with it. In assemblies, whoever holds the scepter has the right to speak.",["agamemnon","hephaestus","thersites","g_atreus"]],
["g_armor","زره آشیل","Armor of Achilles","τεύχεα Ἀχιλλῆος","Arma Achillis","object","armour, arms of Achilles, judgment of arms | سلاح‌های آشیل","آشیل دو زره دارد. زره نخست را، که هدیه‌ی خدایان به پلئوس بود، پاتروکلوس می‌پوشد و هکتور پس از کشتن او آن را برمی‌دارد و خود می‌پوشد. زره دوم را هفائستوس می‌سازد. پس از مرگ آشیل، بر سر این زره میان آژاکس و اودیسئوس رقابت درگرفت که به خودکشی آژاکس انجامید.","Achilles has two sets of armor. The first, a gift of the gods to Peleus, is worn by Patroclus and stripped by Hector, who puts it on himself. Hephaestus forges the second. After Achilles' death, the contest between Ajax and Odysseus over this armor led to Ajax's suicide.",["achilles","patroclus","hector","shield","ajax"]],
["g_bow","کمان اودیسئوس","Bow of Odysseus","τόξον","Arcus Ulixis","object","bow, twelve axes | کمان","کمانی که ایفیتوس، پسر ائوروتوس، به اودیسئوس جوان هدیه داد. اودیسئوس آن را به تروا نبرد و در خانه نگه داشت. هیچ‌یک از خواستگاران نمی‌توانند زهش کنند؛ اودیسئوس آن را به نرمی زه می‌کند، همچون خنیاگری که سیم چنگ می‌بندد.","A bow given to the young Odysseus by Iphitus son of Eurytus. Odysseus did not take it to Troy but kept it at home. None of the suitors can string it; Odysseus strings it effortlessly, like a bard stringing a lyre.",["contest","odysseus","penelope","g_iphitus"]],
["g_bed","تخت زناشویی","The Olive-tree Bed","λέχος","Lectus","object","bed, olive tree, marriage bed | تخت, درخت زیتون","تختی که اودیسئوس خود بر تنه‌ی درخت زیتونی ریشه‌دار ساخت و اتاق خواب را گرداگرد آن بنا کرد، و تنها او و پنلوپه و یک کنیز از رازش آگاه بودند. پنلوپه وانمود می‌کند تخت را جابه‌جا کرده‌اند و خشم اودیسئوس هویت او را ثابت می‌کند.","A bed Odysseus built himself on the trunk of a living olive tree, with the bedroom built around it; only he, Penelope and one maid knew its secret. Penelope pretends the bed has been moved, and Odysseus' outrage proves who he is.",["penelope","odysseus"]],
["g_shroud","کفن لائرتس","Laertes' Shroud","φᾶρος","Textum Penelopae","object","shroud, web, weaving, loom | بافندگی پنلوپه, ترفند پنلوپه","ترفند پنلوپه: به خواستگاران گفت پس از بافتن کفن لائرتس شوهر برمی‌گزیند. سه سال روزها بافت و شب‌ها شکافت، تا آنکه در سال چهارم کنیزی راز را فاش کرد. داستان سه بار در اودیسه بازگو می‌شود.","Penelope's trick: she told the suitors she would choose a husband once she finished weaving a shroud for Laertes. For three years she wove by day and unpicked by night, until in the fourth year a maid betrayed her. The story is told three times in the Odyssey.",["penelope","laertes","suitors","metis"]],
["g_helmet","کلاهخود دندان گراز","Boar's-tusk Helmet","κυνέη ὀδοῦσι συός","Galea dentibus aprinis","object","boar's tusk helmet, boar tusk helmet | کلاهخود","کلاهخودی چرمی پوشیده از ردیف‌های دندان گراز که مریونس برای شبیخون شبانه به اودیسئوس می‌دهد. نمونه‌هایی از این کلاهخود در گورهای موکنایی پیدا شده و نشان می‌دهد برخی جزئیات شعر هومر یادگار سده‌ها پیش از اوست.","A leather helmet covered with rows of boar's tusks, which Meriones lends Odysseus for the night raid. Real examples have been found in Mycenaean tombs, showing that some details in Homer go back centuries before his time.",["odysseus","dolon","mycenae","g_meriones"]],
["g_catalogue","فهرست کشتی‌ها","Catalogue of Ships","νεῶν κατάλογος","Catalogus Navium","object","Catalogue of Ships, Trojan catalogue | سیاهه‌ی کشتی‌ها","بخش بلندی از سرود ۲ ایلیاد که ۲۹ دسته‌ی سپاه یونان، فرماندهانشان و شمار کشتی‌هایشان را برمی‌شمارد و روی‌هم ۱٬۱۸۶ کشتی می‌شود. پس از آن فهرست کوتاه‌تری از تروآییان و هم‌پیمانانشان می‌آید.","A long passage in Iliad Book 2 listing the 29 Greek contingents, their leaders and their ships, 1,186 ships in all. A shorter list of the Trojans and their allies follows.",["ships","iliad","agamemnon","g_muses"]],
["g_epithets","صفت‌های ثابت","Homeric Epithets","ἐπίθετα","Epitheta","object","epithet, rosy-fingered dawn, swift-footed, grey-eyed, wine-dark sea | لقب‌ها, صفت هومری","عبارت‌های تکراری که همراه نام‌ها می‌آیند، مانند «آشیل تیزپا»، «اودیسئوس پرترفند»، «آتنای چشم‌روشن»، «سپیده‌ی گلگون‌انگشت» و «دریای شراب‌رنگ». این قالب‌ها به خنیاگران شفاهی کمک می‌کرد بیت‌ها را در وزن شش‌پایه بداهه بسرایند.","Recurring phrases attached to names, such as 'swift-footed Achilles', 'Odysseus of many wiles', 'grey-eyed Athena', 'rosy-fingered Dawn' and 'the wine-dark sea'. These formulas helped oral bards improvise lines in hexameter.",["homer","achilles","odysseus","athena","g_eos"]]

/* ---------- graph data ---------- */
const nodes=N.map(a=>({id:a[0],fa:a[1],gk:a[2],la:a[3],t:a[4],m:a[5],d:a[6]}));
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
nodes.forEach(n=>{const e=EN[n.id];n.en=e[0];n.alias=e[1];n.den=e[2];n.ro=ROMAN[n.id]||"";});
const gloss=G.map(a=>({id:a[0],fa:a[1],en:a[2],gk:a[3],ro:a[4],c:a[5],alias:a[6],d:a[7],den:a[8],rel:a[9],gl:true}));
const gById=Object.fromEntries(gloss.map(g=>[g.id,g]));
const links=L.filter(l=>byId[l[0]]&&byId[l[1]]).map(l=>({source:l[0],target:l[1],label:l[2],en:LE[l[0]+"|"+l[1]]||""}));
const adj={};nodes.forEach(n=>adj[n.id]=[]);
links.forEach(l=>{adj[l.source].push({id:l.target,l}); adj[l.target].push({id:l.source,l});});
nodes.forEach(n=>{n.deg=adj[n.id].length;n.r=n.t==="epic"?24:6+Math.sqrt(n.deg)*2.6;n.minor=n.deg<4&&n.t!=="epic";n.hub=n.deg>=9||n.t==="epic";});

let lang="fa";
try{const s=localStorage.getItem("homer-lang");if(s==="en"||s==="fa")lang=s;}catch(e){}
const U=k=>UI[lang][k];
const num=n=>lang==="fa"?Number(n).toLocaleString("fa-IR"):String(n);
const nm=n=>lang==="fa"?n.fa:n.en;
const tname=t=>lang==="fa"?TYPES[t].n:TYPES_EN[t];
const memText=m=>lang==="fa"?MEM[m]:MEM_EN[m];
const sgn=()=>lang==="fa"?1:-1;   // Iliad on the reading-start side
function renderStatic(){
  const html=document.documentElement;
  html.lang=lang; html.dir=lang==="fa"?"rtl":"ltr";
  document.title=lang==="fa"?"اطلس ایلیاد و اودیسه":"Iliad & Odyssey Atlas";
  document.querySelectorAll("[data-i]").forEach(el=>el.innerHTML=U(el.dataset.i));
  document.getElementById("q").placeholder=U("ph");
  const lb=document.getElementById("langbtn"); lb.textContent=U("lang"); lb.lang=lang==="fa"?"en":"fa";
  const C=lang==="fa"?COMPARE:COMPARE_EN;

    return `<div class="gcat"><h3>${GCAT[c][lang]} (${num(items.length)})</h3><div class="items">${items.map(g=>`<button data-g="${g.id}">${lang==="fa"?g.fa:g.en}</button>`).join("")}</div></div>`;}).join("");

/* ---------- render ---------- */
const svg=d3.select("#svg"),box=document.getElementById("graph");
const root=svg.append("g");
const zoneG=root.append("g"),linkG=root.append("g"),nodeG=root.append("g");
let portrait=box.clientWidth<640;
let sim;

function layout(){
  portrait=box.clientWidth<640;
  const S=portrait?520:520*sgn();
  const T={I:S,B:0,O:-S};
  nodes.forEach(n=>{n.fx=null;n.fy=null;n.x=undefined;n.y=undefined;n.vx=0;n.vy=0;});
  if(portrait){byId.iliad.fx=0;byId.iliad.fy=-720;byId.odyssey.fx=0;byId.odyssey.fy=720;}
  else{byId.iliad.fx=740*sgn();byId.iliad.fy=0;byId.odyssey.fx=-740*sgn();byId.odyssey.fy=0;}
  const along=n=>T[n.m];
  if(sim)sim.stop();
  sim=d3.forceSimulation(nodes)
    .force("link",d3.forceLink(links).id(d=>d.id).distance(l=>40+l.source.r+l.target.r).strength(.18))
    .force("charge",d3.forceManyBody().strength(-420))
    .force("collide",d3.forceCollide(d=>d.r+20))
    .force("x",portrait?d3.forceX(0).strength(.09):d3.forceX(along).strength(.3))
    .force("y",portrait?d3.forceY(along).strength(.3):d3.forceY(0).strength(.07))
    .stop();
  for(let i=0;i<400;i++)sim.tick();
  drawZones();
  sim.on("tick",draw);
  draw();
}
function drawZones(){
  const z=U("zones"),s=sgn();
  const pos=portrait?[[0,-880],[0,0],[0,880]]:[[780*s,-420],[0,-470],[-780*s,-420]];
  zoneG.selectAll("text").data(z).join("text").attr("class","zone").attr("x",(d,i)=>pos[i][0]).attr("y",(d,i)=>pos[i][1]).attr("font-size",portrait?110:120).text(d=>d);
}

const link=linkG.selectAll("line").data(links).join("line").attr("class","link");
const node=nodeG.selectAll("g").data(nodes).join("g")
  .attr("class",d=>"node "+(d.t==="epic"?"epic ":"")+(d.minor?"minor ":"")+(d.hub?"hub":""))
  .attr("tabindex",0).attr("role","button");
node.filter(d=>d.m==="B"&&d.t!=="epic").append("circle").attr("class","both").attr("r",d=>d.r+4.5).style("stroke",d=>`var(--t-${d.t})`);
node.append("circle").attr("class","core").attr("r",d=>d.r).style("fill",d=>`var(--t-${d.t})`);
const labels=node.append("text").attr("dy",d=>d.t==="epic"?d.r+30:d.r+16);
function setLabels(){labels.text(nm);node.attr("aria-label",nm);}

function draw(){
  link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  node.attr("transform",d=>`translate(${d.x},${d.y})`);
  if(typeof step!=="undefined"&&step>=0&&TOUR[step].id){const d=byId[TOUR[step].id];pulse.attr("cx",d.x).attr("cy",d.y);}
}

/* zoom */
const zoom=d3.zoom().scaleExtent([.15,4]).on("zoom",e=>{
  root.attr("transform",e.transform);
  const k=e.transform.k;
  svg.style("--lf",(14/Math.pow(Math.min(k,1),.75)).toFixed(2));
  svg.classed("z1",k<.5).classed("z2",k>=.5&&k<.85);
});
svg.call(zoom).on("dblclick.zoom",null);
function fit(dur=0){
  const w=box.clientWidth,h=box.clientHeight;
  const vis=nodes.filter(match);
  const xs=vis.map(n=>n.x),ys=vis.map(n=>n.y);
  const x0=Math.min(...xs)-60,x1=Math.max(...xs)+60,y0=Math.min(...ys)-60,y1=Math.max(...ys)+70;
  const k=Math.min(w/(x1-x0),h/(y1-y0));
  const t=d3.zoomIdentity.translate(w/2-k*(x0+x1)/2,h/2-k*(y0+y1)/2).scale(k);
  (dur?svg.transition().duration(dur):svg).call(zoom.transform,t);
}
document.getElementById("zin").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.4);
document.getElementById("zout").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.4);

function apply(){
  if(pinned&&!match(byId[pinned]))pinned=null;
  if(hover&&!match(byId[hover]))hover=null;
  const a=hover||pinned;
  const gs=!a&&glossSel?gById[glossSel]:null;
  const nb=a?new Set([a,...adj[a].map(x=>x.id)]):gs?new Set(gs.rel.filter(r=>byId[r])):null;
  svg.classed("focus",!!nb);
  node.style("display",d=>match(d)?null:"none")
      .classed("dim",d=>nb?!nb.has(d.id):false).classed("sel",d=>d.id===a||(gs&&nb.has(d.id)));
  link.style("display",l=>match(l.source)&&match(l.target)?null:"none")
      .classed("hot",l=>a&&(l.source.id===a||l.target.id===a))
      .classed("dim",l=>nb?!(a&&(l.source.id===a||l.target.id===a)):false);
  if(a)render(a);else if(gs)renderGloss(gs);else render(null);
}
function match(d){
  if(filter==="all")return true;
  if(d.t==="epic")return filter==="B"?true:(filter==="I"?d.id==="iliad"||d.id==="homer":d.id==="odyssey"||d.id==="homer");
  return filter==="B"?d.m==="B":(d.m===filter||d.m==="B");
}

/* search: Persian, English, Roman names, Greek, alternate spellings */
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[‌\s\-'’.]+/g,"").replace(/ي/g,"ی").replace(/ك/g,"ک");
nodes.forEach(n=>{n.hay=[n.fa,n.en,n.la,n.gk,n.alias,n.ro].map(norm).join("|");});
gloss.forEach(g=>{g.hay=[g.fa,g.en,g.gk,g.ro,g.alias].map(norm).join("|");});
const q=document.getElementById("q"),sugg=document.getElementById("sugg");
function runSearch(){
  const s=norm(q.value.trim());
  if(!s){sugg.hidden=true;return;}
  const gname=g=>lang==="fa"?g.fa:g.en;
  const score=x=>{const names=[x.fa,x.en,x.la||"",...(x.ro||"").split(/[·(),]/)].map(norm).filter(Boolean);
    if(names.some(v=>v===s))return -1;
    if((x.alias||"").split(/[|,]/).map(norm).some(v=>v===s))return -.5;
    if(names.some(v=>v.startsWith(s)))return 0; return 1;};
  const hn=nodes.filter(match).filter(n=>n.hay.includes(s)).map(n=>({n,sc:score(n),w:n.deg}));
  const hg=gloss.filter(g=>g.hay.includes(s)).map(g=>({g,sc:score(g),w:0}));
  const hits=[...hn,...hg].sort((a,b)=>a.sc-b.sc||(a.g?1:0)-(b.g?1:0)||b.w-a.w).slice(0,9);
  sugg.innerHTML=hits.length?hits.map(h=>{
    if(h.n){const n=h.n;return `<button data-id="${n.id}">${nm(n)} <span style="color:var(--muted);font-size:12px">· ${lang==="fa"?n.en:n.fa} · ${tname(n.t)}</span></button>`;}
    const g=h.g;return `<button data-g="${g.id}">${gname(g)} <span style="color:var(--muted);font-size:12px">· ${lang==="fa"?g.en:g.fa} · ${GCAT[g.c][lang]}</span><span class="tag">${U("gTag")}</span></button>`;}).join("")
    :`<button disabled style="color:var(--muted)">${U("none")}</button>`;
  sugg.hidden=false;
  sugg.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>{focusNode(b.dataset.id);sugg.hidden=true;q.value="";});
  sugg.querySelectorAll("button[data-g]").forEach(b=>b.onclick=()=>{openGloss(b.dataset.g);sugg.hidden=true;q.value="";});
}
q.addEventListener("input",runSearch);
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=sugg.querySelector("button[data-id],button[data-g]");if(b)b.click();}if(e.key==="Escape")sugg.hidden=true;});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))sugg.hidden=true;});

    sim.force("x",d3.forceX(n=>({I:520*sgn(),B:0,O:-520*sgn()})[n.m]).strength(.3));draw();fit();}

}

function showWelcome(){

    <ol><li>${TU("w1")}</li><li>${TU("w2")}</li><li>${TU("w3")}</li></ol>

function startTour(){
  if(filter!=="all"){filter="all";document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.f==="all"));apply();}
  panel.classList.remove("open");step=0;box.classList.add("touring");renderTour();
}
function endTour(){
  step=-1;tourEl.hidden=true;box.classList.remove("touring");showPulse(null);pinned=null;apply();fit(500);
  try{localStorage.setItem("homer-seen","1");}catch(e){}
}
function renderTour(){
  if(step<0)return;
  const S=TOUR[step],t=S[lang],last=step===TOUR.length-1;
  tourEl.innerHTML=`<div class="row" style="margin-top:0"><span class="step">${num(step+1)} ${TU("of")} ${num(TOUR.length)}</span>
     <span class="dots">${TOUR.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</span></div>
    <h2>${t[0]}</h2><p>${t[1]}</p>
    <div class="row"><button class="btn" id="tprev" ${step===0?"disabled":""}>${TU("prev")}</button>
     <button class="btn primary" id="tnext">${last?TU("done"):TU("next")}</button>
     ${S.id?`<button class="btn link" id="tmore">${TU("more")}</button>`:""}
     <button class="btn link" id="texit" style="margin-inline-start:auto">${TU("exit")}</button></div>`;
  tourEl.hidden=false;
  document.getElementById("tprev").onclick=()=>{step--;renderTour();};
  document.getElementById("tnext").onclick=()=>{if(last)endTour();else{step++;renderTour();}};
  document.getElementById("texit").onclick=endTour;
  const m=document.getElementById("tmore");if(m)m.onclick=()=>{panel.classList.add("open");if(!mobile())panel.scrollIntoView({block:"nearest"});};
  if(S.id){
    pinned=S.id;hover=null;apply();
    const d=byId[S.id],w=box.clientWidth,h=box.clientHeight,k=Math.max(Math.min(d3.zoomTransform(svg.node()).k,1.1),.9);
    const yOff=-Math.min(tourEl.offsetHeight/2+10,h*.25);
    svg.transition().duration(650).call(zoom.transform,d3.zoomIdentity.translate(w/2-k*d.x,h/2+yOff-k*d.y).scale(k));
    showPulse(S.id);
  }else{showPulse(null);pinned=null;apply();fit(500);}
}
document.addEventListener("keydown",e=>{
  if(step<0||e.target.tagName==="INPUT")return;
  const fwd=lang==="fa"?"ArrowLeft":"ArrowRight",back=lang==="fa"?"ArrowRight":"ArrowLeft";
  if(e.key===fwd){document.getElementById("tnext").click();}
  else if(e.key===back&&step>0){step--;renderTour();}
  else if(e.key==="Escape")endTour();
});
document.getElementById("tourbtn").onclick=()=>{welcome.hidden=true;startTour();};

function siblingsOf(id){const me=parentsOf(id);if(!me)return[];return PAR.filter(p=>p[0]!==id&&((me.f&&p[1]===me.f)||(me.m&&p[2]===me.m))).map(p=>p[0]);}

    const x=E[0];setLast(x);
    if(x.gl)return (L==="fa"?`${ent(x.id,L)} با این موارد مرتبط است: `:`${ent(x.id,L)} is related to: `)+list(x.rel.map(i=>ent(i,L)),L);
    return (L==="fa"?`${ent(x.id,L)} ${num2(adj[x.id].length,L)} پیوند دارد:<ul>`:`${ent(x.id,L)} has ${adj[x.id].length} connections:<ul>`)+adj[x.id].slice().sort((a,b)=>byId[b.id].deg-byId[a.id].deg).map(c=>`<li>${ent(c.id,L)}: ${L==="fa"?c.l.label:c.l.en}</li>`).join("")+"</ul>";}

  // describe entity
  if(E.length){
    const x=E[0];setLast(x);
    const head=`<b>${L==="fa"?x.fa:x.en}</b> <span class="muted" dir="ltr">${x.gk}${x.ro?" · "+x.ro:""}</span>`;
    const typ=x.gl?GCAT[x.c][L]:(L==="fa"?TYPES[x.t].n:TYPES_EN[x.t]);
    return `${head}<br><small class="muted">${typ} · ${memOf(x,L)}</small><br>${descOf(x,L)}<br>${x.gl?ent(x.id,L):ent(x.id,L)} <small class="muted">${L==="fa"?"← برای دیدن در گراف بزنید":"← tap to open"}</small>`;
  }

  // fuzzy fallback
  const words=t.split(" ").filter(w=>w.length>=4);
  const sug=[];for(const k of keys){if(sug.length>=5)break;if(words.some(w=>k.includes(w)||w.includes(k))){const x=idx.get(k).x;if(!sug.includes(x))sug.push(x);}}
  if(sug.length)return (L==="fa"?"مطمئن نیستم منظورتان چیست. شاید یکی از اینها:":"I'm not sure what you mean. Perhaps one of these:")+"<br>"+sug.map(x=>ent(x.id,L)).join(" ");
  return helpText(L,false,true);
}
function famRel(a,b,L){
  const pa=parentsOf(a),pb=parentsOf(b),r=[];
  const N=i=>ent(i,L);
  if(pa&&(pa.f===b||pa.m===b))r.push(L==="fa"?`${N(b)} ${pa.f===b?"پدر":"مادر"} ${N(a)} است.`:`${N(b)} is ${N(a)}'s ${pa.f===b?"father":"mother"}.`);
  if(pb&&(pb.f===a||pb.m===a))r.push(L==="fa"?`${N(a)} ${pb.f===a?"پدر":"مادر"} ${N(b)} است.`:`${N(a)} is ${N(b)}'s ${pb.f===a?"father":"mother"}.`);
  if(SPO.some(p=>p.includes(a)&&p.includes(b)))r.push(L==="fa"?`${N(a)} و ${N(b)} همسرند.`:`${N(a)} and ${N(b)} are married.`);
  if(LOV.some(p=>p.includes(a)&&p.includes(b)))r.push(L==="fa"?`${N(a)} و ${N(b)} معشوق یکدیگرند.`:`${N(a)} and ${N(b)} are lovers.`);
  if(siblingsOf(a).includes(b)||(a==="ajax"&&b==="teucer")||(a==="teucer"&&b==="ajax"))r.push(L==="fa"?`${N(a)} و ${N(b)} خواهر و برادر (یا برادر) هستند.`:`${N(a)} and ${N(b)} are siblings.`);
  KILL.forEach(k=>{if(k[0].includes(a)&&k[1]===b)r.push(L==="fa"?`${N(a)} در کشتن ${N(b)} نقش داشت.`:`${N(a)} took part in killing ${N(b)}.`);if(k[0].includes(b)&&k[1]===a)r.push(L==="fa"?`${N(b)} در کشتن ${N(a)} نقش داشت.`:`${N(b)} took part in killing ${N(a)}.`);});
  return r.join("<br>");
}
function bfs(a,b){
  const prev={[a]:null},q=[a];
  while(q.length){const c=q.shift();if(c===b)break;
    for(const n of adj[c]){if(!(n.id in prev)&&byId[n.id].t!=="epic"){prev[n.id]={from:c,l:n.l};q.push(n.id);}}}
  if(!(b in prev))return null;const steps=[];let c=b;
  while(prev[c]){steps.unshift({a:prev[c].from,b:c,l:prev[c].l});c=prev[c].from;}
  return steps.length<=5?steps:null;
}
const num2=(n,L)=>L==="fa"?Number(n).toLocaleString("fa-IR"):String(n);
function helpText(L,greet,miss){
  const fa=`${greet?"سلام! ":miss?"پاسخی برای این پرسش ندارم. ":""}من دستیار محلی همین صفحه‌ام و بدون اینترنت، از داده‌های همین نقشه پاسخ می‌دهم. می‌توانید بپرسید:<ul>
<li>درباره‌ی هر شخصیت، ایزد، مکان یا قوم: «آتنا کیست؟»، «میرمیدون‌ها»</li><li>کشتن و مرگ: «چه کسی هکتور را کشت؟»، «آشیل چگونه مرد؟»</li>
<li>خانواده: «پدر آشیل کیست؟»، «همسر هکتور»</li><li>رابطه‌ی دو نفر: «رابطه‌ی آتنا و اودیسئوس»</li><li>نام رومی یا یونانی: «نام رومی هرا»</li>
<li>خلاصه‌ی سرود: «سرود ۱۱ اودیسه»</li><li>فهرست: «ایزدان اودیسه»، «اقوام»</li><li>پرسش‌های کلی: «چرا جنگ تروا آغاز شد؟»، «کدام را اول بخوانم؟»، «ترجمه‌های فارسی»</li>
<li>فرمان: «فقط اودیسه را نشان بده»، «تور را شروع کن»</li></ul>`;
  const en=`${greet?"Hello! ":miss?"I don't have an answer for that. ":""}I'm this page's local assistant: I work offline and answer from the map's own data. You can ask:<ul>
<li>About any character, god, place or people: "Who is Athena?", "Myrmidons"</li><li>Killings and deaths: "Who killed Hector?", "How did Achilles die?"</li>
<li>Family: "Who is Achilles' father?", "Hector's wife"</li><li>How two figures connect: "Athena and Odysseus"</li><li>Roman or Greek names: "Roman name of Hera"</li>
<li>Book summaries: "Odyssey book 11"</li><li>Lists: "gods in the Odyssey", "peoples"</li><li>General questions: "Why did the Trojan War start?", "Which should I read first?", "translations"</li>
<li>Commands: "show only the Odyssey", "start the tour"</li></ul>`;
  return L==="fa"?fa:en;
}

  sug:["چه کسی هکتور را کشت؟","رابطه‌ی آتنا و اودیسئوس","پدر آشیل کیست؟","نام رومی پوزئیدون","سرود ۹ ایلیاد","چرا جنگ تروا آغاز شد؟","ایزدان هوادار تروا","کدام را اول بخوانم؟"]},
 en:{fab:"Ask the assistant",t:"Iliad & Odyssey assistant",s:"Local and offline · based on this page's data",ph:"Ask in English or Persian…",send:"Send",

function chatLang(){const c=CUI[lang];document.getElementById("chatfabT").textContent=c.fab;document.getElementById("chatT").textContent=c.t;document.getElementById("chatS").textContent=c.s;
  inp.placeholder=c.ph;document.getElementById("chatB").textContent=c.send;

  document.querySelectorAll("#sugs button").forEach(b=>b.onclick=()=>ask(b.textContent));

function add(cls,html,dir){const d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;d.dir=dir||"auto";msgs.appendChild(d);
  d.querySelectorAll("button.ent").forEach(b=>b.onclick=()=>{if(mobile())toggle(false);b.dataset.id?focusNode(b.dataset.id):openGloss(b.dataset.g);});
  msgs.scrollTop=msgs.scrollHeight;}
const bot=h=>add("bot",h);
function ask(q){q=q.trim();if(!q)return;add("me",q.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"})[c]));
  let a;try{a=answer(q);}catch(e){a=helpText(PF.test(q)?"fa":"en",false,true);}
  const L=PF.test(q)?"fa":/[a-z]/i.test(q)?"en":lang;setTimeout(()=>add("bot",a,L==="fa"?"rtl":"ltr"),120);}

window.chatLang=chatLang;window.homerAsk=answer;
