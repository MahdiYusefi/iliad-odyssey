<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اطلس ایلیاد و اودیسه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&family=Gentium+Book+Plus&display=swap">
<style>
/* Layout: legibility first — neutral surfaces, high-contrast text, graph + side panel (bottom sheet on phones) */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --raised:#eef0f3; --line:#d3d8df;
  --ink:#15181d; --muted:#4b5361; --accent:#1d5fc4; --on-accent:#ffffff; --scrim:rgba(245,246,248,.82);
  --t-epic:#b07514; --t-theme:#687384; --t-event:#cf3f55; --t-god:#2a68b8; --t-achaean:#d1621a;
  --t-trojan:#7c4fcf; --t-home:#2c8053; --t-voyage:#0c8483; --t-place:#8a6a38;
  --body:"Vazirmatn","Source Sans 3",Tahoma,"Segoe UI",sans-serif;
  --latin:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --greek:"Gentium Book Plus","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#171b21; --raised:#20262e; --line:#333b46;
  --ink:#eef1f5; --muted:#aab3c0; --accent:#7eb0ff; --on-accent:#0b1220; --scrim:rgba(16,19,24,.84);
  --t-epic:#f2c14e; --t-theme:#c2c9d3; --t-event:#ff7b8b; --t-god:#6ea9ff; --t-achaean:#ff9e5c;
  --t-trojan:#b893f7; --t-home:#5ccc8c; --t-voyage:#3ccfcd; --t-place:#d0ab72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#171b21; --raised:#20262e; --line:#333b46;
  --ink:#eef1f5; --muted:#aab3c0; --accent:#7eb0ff; --on-accent:#0b1220; --scrim:rgba(16,19,24,.84);
  --t-epic:#f2c14e; --t-theme:#c2c9d3; --t-event:#ff7b8b; --t-god:#6ea9ff; --t-achaean:#ff9e5c;
  --t-trojan:#b893f7; --t-home:#5ccc8c; --t-voyage:#3ccfcd; --t-place:#d0ab72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.9}
html[lang="en"] body{font-family:var(--latin);line-height:1.6}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;max-width:1400px;margin:0 auto}
header h1{font-weight:700;font-size:clamp(24px,3.6vw,34px);line-height:1.35;margin:0;text-wrap:balance}
header h1 span{color:var(--accent)}
header p{margin:8px 0 0;color:var(--muted);max-width:72ch}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-block:18px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 14px;border-radius:999px;cursor:pointer;line-height:1.5}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
button:focus-visible,input:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search input{width:100%;font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;line-height:1.5}
.search input::placeholder{color:var(--muted)}
.sugg{position:absolute;inset-inline:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;z-index:20;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sugg button{display:block;width:100%;text-align:start;font:inherit;font-size:15px;background:none;border:0;color:var(--ink);padding:7px 12px;cursor:pointer}
.sugg button:hover{background:var(--raised)}
.tools{display:flex;gap:8px}
.langbtn,.themebtn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 14px;border-radius:8px;cursor:pointer;line-height:1.5}
.langbtn:hover,.themebtn:hover{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%}
.legend .ring{background:none;border:1.5px dashed var(--ink)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.graph{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;height:min(76vh,780px);min-height:420px;overflow:hidden;touch-action:none}
.graph svg{width:100%;height:100%;display:block;cursor:grab}
.hint{position:absolute;bottom:10px;inset-inline-start:12px;font-size:13px;color:var(--muted);pointer-events:none;background:var(--surface);padding:0 6px;border-radius:4px}
.zoombtns{position:absolute;top:10px;inset-inline-end:10px;display:flex;flex-direction:column;gap:6px}
.zoombtns button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;cursor:pointer;line-height:1}
.zone{font-family:var(--body);font-weight:700;fill:var(--ink);opacity:.06;text-anchor:middle;pointer-events:none}
.link{stroke:var(--muted);stroke-opacity:.35;stroke-width:1.2}
.node{cursor:pointer}
.node circle.core{stroke:var(--surface);stroke-width:2}
.node circle.both{fill:none;stroke-dasharray:3 3;stroke-width:1.6}
.node text{font-family:var(--body);font-weight:500;font-size:calc(var(--lf,14) * 1px);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:4.5px;stroke-linejoin:round;pointer-events:none}
html[lang="en"] .node text{font-family:var(--latin);font-weight:600}
.node.epic text{font-weight:700;font-size:calc(var(--lf,14) * 1.5px)}
svg.z1 .node:not(.hub) text,svg.z2 .node.minor text{display:none}
svg.focus .node:not(.dim) text{display:inline}
svg.focus .node.dim text{display:none}
.dim{opacity:.13}
.link.hot{stroke:var(--accent);stroke-opacity:1;stroke-width:2.2}
.node.sel circle.core{stroke:var(--ink);stroke-width:3}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;position:sticky;top:12px;max-height:min(76vh,780px);overflow:auto}
.panel .type{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);font-weight:600}
.panel .type i{width:12px;height:12px;border-radius:50%}
.panel h2{font-weight:700;font-size:28px;line-height:1.35;margin:6px 0 0}
.panel .gk{font-family:var(--greek);text-align:start;color:var(--muted);font-size:16px}
.panel .gk em{font-family:var(--latin);font-style:normal;font-size:15px}
.badge{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;background:var(--raised);color:var(--ink);border-radius:6px;padding:1px 10px}
.panel p{margin:12px 0 0;font-size:16px}
.panel h3{font-size:14px;color:var(--muted);font-weight:600;margin:20px 0 8px}
.conns{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.conns button{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;width:100%;text-align:start;font:inherit;font-size:15px;background:var(--raised);border:1px solid transparent;border-radius:8px;color:var(--ink);padding:6px 10px;cursor:pointer;line-height:1.5}
.conns button:hover{border-color:var(--accent)}
.conns b{font-weight:700}
.conns span{color:var(--muted);font-size:14px}
.conns i{width:10px;height:10px;border-radius:50%;flex:none}
.close{display:none}
.intro ul{padding-inline-start:20px;margin:8px 0 0}
.intro a{color:var(--accent);font-weight:600}
section.more{margin-top:40px}
section.more h2{font-weight:700;font-size:26px;margin:0 0 4px}
section.more > p{color:var(--muted);margin:0 0 16px}
.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
thead th{font-weight:700;font-size:17px;background:var(--raised)}
tbody th{color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td,tr:last-child th{border-bottom:0}
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;margin-top:28px}
.books article{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.books h3{font-weight:700;font-size:21px;margin:0}
.books h3 small{font-family:var(--greek);font-weight:400;font-size:16px;color:var(--muted);margin-inline-start:8px}
.books ol{list-style-type:decimal;padding-inline-start:30px;margin:10px 0 0}
html[lang="fa"] .books ol{list-style-type:persian}
.books li{padding-block:5px;border-bottom:1px solid var(--line)}
.books li:last-child{border-bottom:0}
.books li::marker{color:var(--accent);font-weight:700}
footer{margin-top:32px;color:var(--muted);font-size:14px}
@media (max-width:860px){
  .stage{grid-template-columns:1fr}
  .graph{height:66vh;min-height:380px}
  .panel{position:fixed;inset:auto 0 0 0;top:auto;max-height:64vh;border-radius:16px 16px 0 0;z-index:30;
    padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
    transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  .panel.open{transform:none}
  .close{display:block;position:sticky;top:0;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--raised);color:var(--ink);font-size:18px;cursor:pointer;float:inline-end;margin-bottom:4px}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.welcome{position:absolute;inset:0;display:grid;place-items:center;background:var(--scrim);z-index:6;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;max-width:460px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.22)}
.card h2{font-size:22px;font-weight:700;margin:0 0 6px;line-height:1.4}
.card p{margin:0;color:var(--muted)}
.card ol{margin:12px 0 0;padding-inline-start:22px;display:grid;gap:4px}
.card ol li::marker{color:var(--accent);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.btn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 16px;border-radius:8px;cursor:pointer;line-height:1.5}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.link{border:0;background:none;color:var(--muted);padding-inline:6px}
.tour{position:absolute;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:460px;z-index:6;padding:16px 18px}
.tour .step{font-size:13px;font-weight:600;color:var(--accent)}
.tour h2{font-size:20px;margin:2px 0 4px}
.tour p{color:var(--ink);font-size:15px}
.dots{display:flex;gap:4px;margin-inline-start:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.graph.touring .hint{display:none}
@keyframes pulse{0%{r:var(--r0);opacity:.9}100%{r:calc(var(--r0) + 22px);opacity:0}}
.pulse{fill:none;stroke:var(--accent);stroke-width:2.5;pointer-events:none;animation:pulse 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.7}}
.roman{margin-top:4px;font-size:15px;color:var(--muted)}
.roman b{color:var(--ink);font-family:var(--latin);font-weight:600}
.badge.gl{background:none;border:1px dashed var(--line);color:var(--muted)}
.panel .type i.gl{background:none;border:1.5px solid var(--muted)}
.sugg .tag{display:inline-block;font-size:11px;font-weight:600;border:1px dashed var(--line);border-radius:4px;padding:0 5px;margin-inline-start:4px;color:var(--muted)}
section.gloss{margin-top:40px}
section.gloss h2{font-weight:700;font-size:26px;margin:0 0 4px}
section.gloss > p{color:var(--muted);margin:0 0 16px;max-width:72ch}
.gcats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.gcat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.gcat h3{font-size:16px;margin:0 0 8px;color:var(--muted);font-weight:600}
.gcat .items{display:flex;flex-wrap:wrap;gap:6px}
.gcat button{font:inherit;font-size:14px;background:var(--raised);border:1px solid transparent;border-radius:6px;color:var(--ink);padding:2px 10px;cursor:pointer;line-height:1.6}
.gcat button:hover{border-color:var(--accent)}
.chatfab{position:fixed;z-index:40;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:15px;font-weight:700;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.chatfab .dot{width:9px;height:9px;border-radius:50%;background:var(--on-accent);opacity:.85}
.chat{position:fixed;z-index:41;bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));width:min(420px,calc(100vw - 32px));height:min(600px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.28);overflow:hidden}
.chat[hidden]{display:none}
.chat header{display:flex;align-items:flex-start;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--raised)}
.chat header div{display:grid;flex:1;min-width:0}
.chat header b{font-size:16px}
.chat header small{color:var(--muted);font-size:12.5px;line-height:1.5}
.chat .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;flex:none}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;font-size:15px;line-height:1.75;overflow-wrap:anywhere}
.msg.bot{background:var(--raised);align-self:flex-start;border-start-start-radius:4px}
.msg.me{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-start-end-radius:4px}
.msg ul,.msg ol{margin:6px 0 0;padding-inline-start:20px}
.msg small,.msg .muted{color:var(--muted)}
.msg button.ent{font:inherit;font-size:14.5px;font-weight:600;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 7px;margin:1px 0;cursor:pointer;line-height:1.6}
.msg button.ent:hover{border-color:var(--accent)}
.sugs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:thin}
.sugs button{flex:none;font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;white-space:nowrap}
.sugs button:hover{border-color:var(--accent)}
#chatF{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
#chatF input{flex:1;min-width:0;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
@media (max-width:560px){.chat{inset:0;width:auto;height:auto;border-radius:0;bottom:0;padding-top:env(safe-area-inset-top,0px)}}
</style>
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
<header>
  <h1 data-i="h1"></h1>
  <p data-i="lead"></p>
</header>

<div class="toolbar">
  <div class="chips" role="group" aria-label="گزینش حماسه">
    <button class="chip" data-f="all" aria-pressed="true" data-i="all"></button>
    <button class="chip" data-f="I" aria-pressed="false" data-i="I"></button>
    <button class="chip" data-f="O" aria-pressed="false" data-i="O"></button>
    <button class="chip" data-f="B" aria-pressed="false" data-i="B"></button>
  </div>
  <div class="search">
    <input id="q" type="search" autocomplete="off" aria-label="Search / جست‌وجو">
    <div class="sugg" id="sugg" hidden></div>
  </div>
  <div class="tools"><button class="themebtn" id="tourbtn"></button><button class="themebtn" id="themebtn"></button><button class="langbtn" id="langbtn" lang="en"></button></div>
</div>
<div class="legend" id="legend"></div>

<div class="stage">
  <div class="graph" id="graph">
    <svg id="svg" role="img" aria-label="گراف پیوند شخصیت‌های ایلیاد و اودیسه"></svg>
    <div class="zoombtns">
      <button id="zin" aria-label="بزرگ‌نمایی">+</button>
      <button id="zout" aria-label="کوچک‌نمایی">−</button>
      <button id="zfit" aria-label="نمایش کامل" style="font-size:14px">⤢</button>
    </div>
    <div class="hint" data-i="hint"></div>
    <div class="welcome" id="welcome" hidden></div>
    <div class="tour card" id="tour" hidden role="dialog" aria-live="polite"></div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<section class="more">
  <h2 data-i="cmpH"></h2>
  <p data-i="cmpP"></p>
  <div class="cmp-wrap"><table>
    <thead><tr><th></th><th data-i="I"></th><th data-i="O"></th></tr></thead>
    <tbody id="cmp"></tbody>
  </table></div>

  <div class="books">
    <article><h3><span data-i="bIH"></span> <small>Ἰλιάς</small></h3><ol id="bI"></ol></article>
    <article><h3><span data-i="bOH"></span> <small>Ὀδύσσεια</small></h3><ol id="bO"></ol></article>
  </div>
</section>
<section class="gloss" id="glossary"><h2 data-i="gH"></h2><p data-i="gP"></p><div class="gcats" id="gcats"></div></section>
<footer data-i="foot"></footer>
</div>

<script>
const TYPES={
  epic:{n:"حماسه و سراینده",c:"#e8bf63"},
  theme:{n:"مضمون",c:"#e9dfcf"},
  event:{n:"رویداد",c:"#f0956a"},
  god:{n:"ایزدان",c:"#8db6e6"},
  achaean:{n:"یونانیان",c:"#d4794a"},
  trojan:{n:"تروآییان",c:"#c8648a"},
  home:{n:"ایتاکا و خاندان اودیسئوس",c:"#8cb878"},
  voyage:{n:"سفر دریایی اودیسئوس",c:"#5cb8b2"},
  place:{n:"مکان",c:"#b8a58d"}
};
const MEM={I:"فقط در ایلیاد",O:"فقط در اودیسه",B:"در هر دو حماسه"};

// [id, نام فارسی, یونانی, لاتین, نوع, حضور, توضیح]
const N=[
["iliad","ایلیاد","Ἰλιάς","Iliad","epic","I","«ایلیاد» داستان چند هفته از سال دهم جنگ تروا است، نه کل جنگ. در ۲۴ سرود و نزدیک به ۱۵٬۷۰۰ بیت، با خشم آشیل و کناره‌گیری‌اش از جنگ در پی نزاع با آگاممنون آغاز می‌شود و پس از مرگ پاتروکلوس و کشته شدن هکتور، با سوگواری و خاکسپاری هکتور پایان می‌یابد. نه آغاز جنگ در آن روایت می‌شود و نه سقوط تروا. مضمون‌های اصلی‌اش افتخار، مرگ و بهای خشم است."],
["odyssey","اودیسه","Ὀδύσσεια","Odyssey","epic","O","«اودیسه» داستان بازگشت ده‌ساله‌ی اودیسئوس از تروا به خانه است. در ۲۴ سرود و حدود ۱۲٬۱۰۰ بیت، روایت از پسرش تلماخوس آغاز می‌شود، سپس به ماجراهای دریایی اودیسئوس می‌رسد که بیشترش را خود او در دربار فایاکیان بازگو می‌کند، و با بازگشت به ایتاکا، کشتن خواستگاران و دیدار دوباره با پنلوپه پایان می‌یابد. زمان روایت اصلی تنها حدود چهل روز است. اگر ایلیاد حماسه‌ی جنگ است، اودیسه حماسه‌ی زیرکی، مهمان‌نوازی و خانه است."],
["homer","هومر","Ὅμηρος","Homer","epic","B","سراینده‌ی هر دو حماسه بنا بر سنت یونانی. احتمالاً در سده‌ی هشتم یا هفتم پیش از میلاد در ایونیه، کرانه‌ی غربی آسیای صغیر، می‌زیسته است. اینکه هومر یک نفر بوده یا نامی برای سنتی دیرینه از خنیاگران شفاهی، هنوز محل بحث است و به آن «مسئله‌ی هومری» می‌گویند. بیشتر پژوهشگران ایلیاد را کهن‌تر از اودیسه می‌دانند."],

["menis","خشم (منیس)","μῆνις","Mēnis — wrath","theme","B","نخستین واژه‌ی ایلیاد «خشم» است. خشم آشیل بر آگاممنون، و سپس خشم ویرانگرش بر هکتور، داستان را پیش می‌برد. این واژه بیشتر برای خشم خدایان به کار می‌رفت و کاربردش برای یک انسان، شدت و بی‌اندازگی خشم آشیل را نشان می‌دهد."],
["kleos","آوازه‌ی جاودان (کلئوس)","κλέος","Kleos — glory","theme","B","آوازه‌ای که پس از مرگ می‌ماند و از راه همین ترانه‌ها زنده است. آشیل می‌داند اگر در تروا بماند عمری کوتاه اما نامی جاودان خواهد داشت، و اگر برگردد عمری دراز اما بی‌نام. در اودیسه، روح او همین ارزش را زیر سؤال می‌برد؛ اودیسئوس آوازه را نه با مرگ در نبرد، بلکه با زنده ماندن و بازگشت به دست می‌آورد."],
["nostos","بازگشت (نوستوس)","νόστος","Nostos — homecoming","theme","B","بازگشت به خانه، مضمون محوری اودیسه. سرنوشت دیگر سرداران یونانی نیز در اودیسه گفته می‌شود: نستور و منلائوس سرانجام به خانه رسیدند، آگاممنون در خانه‌ی خود کشته شد و آژاکس کوچک در دریا غرق شد. واژه‌ی «نوستالژی» از همین ریشه است."],
["xenia","مهمان‌نوازی (کسنیا)","ξενία","Xenia — guest-friendship","theme","B","آیین مقدس رابطه‌ی میزبان و مهمان که زئوس نگهبان آن است. جنگ تروا با شکستن همین آیین به دست پاریس آغاز شد. اودیسه تقریباً سراسر آزمون این آیین است: فایاکیان، نستور و ائومائوس میزبانان نمونه‌اند؛ پولیفموس و خواستگاران آن را پایمال می‌کنند و کیفر می‌بینند."],
["metis","زیرکی (متیس)","μῆτις","Mētis — cunning","theme","B","هوش عملی و ترفند؛ فضیلتی که اودیسئوس را از دیگر قهرمانان جدا می‌کند. در ایلیاد پیروزی بیشتر با نیروی بازوست؛ در اودیسه با ترفندهایی چون نام «هیچ‌کس»، اسب چوبی، جامه‌ی گدایی و کفن‌بافی پنلوپه. آتنا خود ایزدبانوی همین گونه از خرد است."],

["judgment","داوری پاریس","κρίσις Πάριδος","Judgment of Paris","event","I","پیش‌زمینه‌ی جنگ: پاریس باید از میان هرا، آتنا و آفرودیته زیباترین را برمی‌گزید. آفرودیته با وعده‌ی زیباترین زن جهان، یعنی هلن، برنده شد و دشمنی هرا و آتنا با تروا از همین‌جا آغاز شد. ایلیاد این داستان را روایت نمی‌کند و تنها یک بار، در سرود ۲۴، به آن اشاره می‌کند."],
["quarrel","نزاع آشیل و آگاممنون","ἔρις","The Quarrel","event","I","رویداد آغازین ایلیاد (سرود ۱). آگاممنون به‌ناچار کنیز خود، کریسئیس، را به پدرش کریسس بازمی‌گرداند تا طاعون آپولون فروکش کند، و به جبران، بریسئیس را از آشیل می‌گیرد. آشیل نزدیک است شمشیر بکشد که آتنا بازش می‌دارد؛ سپس از جنگ کناره می‌گیرد و از مادرش می‌خواهد کاری کند که یونانیان شکست بخورند."],
["embassy","سفارت نزد آشیل","πρεσβεία","The Embassy","event","I","در سرود ۹، آگاممنون اودیسئوس، آژاکس و فوینیکس پیر را با پیشنهاد هدایای فراوان و بازگرداندن بریسئیس نزد آشیل می‌فرستد. آشیل پیشنهاد را رد می‌کند و از دو سرنوشت پیش رویش سخن می‌گوید: عمر کوتاه با نام جاودان، یا عمر دراز بی‌نام."],
["shield","سپر آشیل","ἀσπὶς Ἀχιλλῆος","Shield of Achilles","event","I","در سرود ۱۸، هفائستوس به خواهش تتیس سپری نو برای آشیل می‌سازد. نقش‌های آن، از آسمان و ستارگان تا شهری در صلح با جشن عروسی و دادگاه، شهری در محاصره، کشتزار، تاکستان و رقص، تصویری از کل زندگی انسانی است که بیرون از جنگ جریان دارد. این توصیف الگوی وصف آثار هنری در ادبیات غرب شد."],
["ransom","بازخرید پیکر هکتور","λύτρα Ἕκτορος","Ransom of Hector","event","I","پایان ایلیاد (سرود ۲۴). پریام با گاری پر از هدیه، شبانه و با راهنمایی هرمس به چادر آشیل می‌رود. آشیل که به یاد پدر پیر خود می‌افتد، با او می‌گرید، پیکر هکتور را پس می‌دهد و برای خاکسپاری آتش‌بس اعلام می‌کند. حماسه‌ی خشم با همدردی پایان می‌یابد."],
["horse","اسب چوبی","δούρειος ἵππος","Wooden Horse","event","O","ترفند اودیسئوس برای فتح تروا. داستان آن در ایلیاد نیست؛ در اودیسه سه بار بازگو می‌شود: از زبان هلن و منلائوس در اسپارت، در ترانه‌ی دمودوکوس در دربار فایاکیان، و از زبان خود اودیسئوس برای روح آشیل، وقتی از دلاوری پسر او درون اسب می‌گوید. این ماجرا پیوند اصلی میان پایان جنگ و آغاز سفر بازگشت است."],
["nekyia","سفر به جهان زیرین","νέκυια","Nekyia","event","O","سرود ۱۱ اودیسه و مهم‌ترین نقطه‌ی پیوند دو حماسه. اودیسئوس به راهنمایی کیرکه به لبه‌ی جهان می‌رود تا پیشگویی تیرزیاس را بشنود. در آنجا با مادرش و سپس با قهرمانان ایلیاد، آگاممنون، آشیل و آژاکس، روبه‌رو می‌شود و هر یک نگاهی تازه و تلخ به ارزش‌های جنگ تروا می‌اندازد."],
["cattle","گاوهای هلیوس","βόες Ἠελίοιο","Cattle of Helios","event","O","در جزیره‌ی تریناکیه، گاوهای مقدس خورشید چرا می‌کنند. با وجود هشدار تیرزیاس و کیرکه، یاران گرسنه‌ی اودیسئوس در غیاب او گاوها را سر می‌برند. زئوس کشتی را با صاعقه نابود می‌کند و تنها اودیسئوس زنده می‌ماند. بیت‌های آغازین اودیسه از همین گناه یاد می‌کنند."],
["contest","مسابقه‌ی کمان و کشتار خواستگاران","τόξου θέσις · μνηστηροφονία","Contest of the Bow","event","O","سرودهای ۲۱ و ۲۲. پنلوپه اعلام می‌کند با کسی ازدواج می‌کند که کمان اودیسئوس را زه کند و تیری از میان دوازده سر تبر بگذراند. هیچ خواستگاری حتی نمی‌تواند کمان را زه کند؛ گدای ناشناس به‌آسانی این کار را می‌کند و سپس همراه تلماخوس و دو خدمتکار وفادار، خواستگاران را می‌کشد."],

["achilles","آشیل","Ἀχιλλεύς","Achilles","achaean","B","بزرگ‌ترین جنگاور یونانیان، پسر پلئوس و تتیسِ ایزدبانوی دریا. ایلیاد با «خشم آشیل» آغاز می‌شود: وقتی آگاممنون بریسئیس را از او می‌گیرد، از جنگ کناره می‌گیرد و یونانیان پیاپی شکست می‌خورند. مرگ پاتروکلوس او را به میدان بازمی‌گرداند و او هکتور را می‌کشد، اما در پایان با پریامِ سوگوار همدردی می‌کند. مرگ خودش در هیچ‌یک از دو حماسه روایت نمی‌شود؛ در اودیسه، روحش در جهان زیرین می‌گوید ترجیح می‌دهد روی زمین کارگری مزدبگیر باشد تا پادشاه مردگان."],
["agamemnon","آگاممنون","Ἀγαμέμνων","Agamemnon","achaean","B","پادشاه موکنای، فرمانده‌ی کل سپاه یونان و برادر منلائوس. غرور او در گرفتن بریسئیس از آشیل، بحران اصلی ایلیاد را می‌سازد. در اودیسه بارها از سرنوشتش یاد می‌شود: پس از بازگشت از تروا، همسرش کلوتمنسترا و معشوق او آیگیستوس او را کشتند و روحش این داستان را در جهان زیرین برای اودیسئوس بازمی‌گوید. سرنوشت او نقطه‌ی مقابل بازگشت پیروزمندانه‌ی اودیسئوس است."],
["menelaus","منلائوس","Μενέλαος","Menelaus","achaean","B","پادشاه اسپارت و همسر هلن؛ ربوده شدن هلن به دست پاریس دلیل جنگ بود. در سرود ۳ ایلیاد با پاریس نبرد تن‌به‌تن می‌کند و نزدیک است او را بکشد که آفرودیته پاریس را نجات می‌دهد. در اودیسه، او و هلن پس از هشت سال سرگردانی به اسپارت بازگشته‌اند و از تلماخوس پذیرایی می‌کنند؛ منلائوس ماجرای به چنگ آوردن پروتئوس، پیر دریا، را تعریف می‌کند."],
["odysseus","اودیسئوس","Ὀδυσσεύς","Odysseus · Ulysses","achaean","B","پادشاه ایتاکا و تنها شخصیت بزرگی که در هر دو حماسه نقش اصلی دارد؛ پل میان این دو اثر. در ایلیاد سخنوری زیرک و رایزنی قابل‌اعتماد است: سپاه را از فرار بازمی‌دارد، در هیئت سفارت نزد آشیل سخن می‌گوید و با دیومدس شبیخون شبانه می‌زند. در اودیسه قهرمان اصلی است: ده سال پس از جنگ در دریاها سرگردان می‌ماند، همه‌ی یارانش را از دست می‌دهد و سرانجام در جامه‌ی گدا به خانه بازمی‌گردد. صفت همیشگی‌اش «پرترفند» است."],
["patroclus","پاتروکلوس","Πάτροκλος","Patroclus","achaean","B","یار نزدیک و همدم آشیل. وقتی یونانیان در آستانه‌ی شکست‌اند، زره آشیل را می‌پوشد و تروآییان را عقب می‌راند، اما آپولون گیج و بی‌سلاحش می‌کند و هکتور او را می‌کشد (سرود ۱۶). مرگ او نقطه‌ی چرخش ایلیاد است. روحش در خواب آشیل ظاهر می‌شود و خاکسپاری می‌خواهد؛ در اودیسه نیز سایه‌اش کنار آشیل در جهان زیرین دیده می‌شود."],
["ajax","آژاکس","Αἴας","Ajax the Great","achaean","B","آژاکس پسر تلامون، تنومندترین جنگاور یونانیان پس از آشیل و دیوار دفاعی آنان در کنار کشتی‌ها. با هکتور نبرد تن‌به‌تنی می‌کند که بی‌برنده پایان می‌یابد. پس از مرگ آشیل، بر سر سلاح‌های او به اودیسئوس باخت و خودکشی کرد. در اودیسه، روحش از کینه حاضر نمی‌شود با اودیسئوس سخن بگوید. این سکوت یکی از ماندگارترین سکوت‌های ادبیات است."],
["diomedes","دیومدس","Διομήδης","Diomedes","achaean","B","پادشاه آرگوس و جوان‌ترین سردار بزرگ یونانی. در سرود ۵ ایلیاد، با پشتیبانی آتنا چنان می‌جنگد که حتی آفرودیته و آرس را زخمی می‌کند. با اودیسئوس به شبیخون شبانه می‌رود (سرود ۱۰). در اودیسه، نستور تعریف می‌کند که دیومدس به سلامت به خانه رسید."],
["nestor","نستور","Νέστωρ","Nestor","achaean","B","پادشاه سالخورده‌ی پولوس و پیرترین سردار یونانی؛ اندرزگویی پرحرف که از خاطرات جوانی‌اش برای دیگران نمونه می‌آورد. در ایلیاد میان آشیل و آگاممنون میانجی‌گری می‌کند و پیشنهاد می‌دهد پاتروکلوس با زره آشیل به جنگ برود. در سرود ۳ اودیسه، میزبان تلماخوس است و از بازگشت سرداران یونانی سخن می‌گوید."],
["briseis","بریسئیس","Βρισηΐς","Briseis","achaean","I","زنی که آشیل در یکی از یورش‌ها به اسارت گرفته بود. وقتی آگاممنون ناچار می‌شود کنیز خود را پس بدهد، بریسئیس را از آشیل می‌گیرد و خشم آشیل از همین‌جا برمی‌خیزد. در سرود ۱۹ به آشیل بازگردانده می‌شود و بر پیکر پاتروکلوس، که همیشه با او مهربان بود، سوگواری می‌کند."],
["clytemnestra","کلوتمنسترا","Κλυταιμνήστρα","Clytemnestra","achaean","B","همسر آگاممنون. در سرود ۱ ایلیاد، آگاممنون آشکارا می‌گوید کنیز اسیرش را بر او ترجیح می‌دهد. در اودیسه، او و آیگیستوس آگاممنون را هنگام بازگشت می‌کشند و روح آگاممنون او را نماد خیانت می‌داند، در برابر پنلوپه که نماد وفاداری است. این مقایسه بارها در اودیسه تکرار می‌شود."],

["hector","هکتور","Ἕκτωρ","Hector","trojan","I","بزرگ‌ترین جنگاور تروا، پسر پریام و هکابه و همسر آندروماخه. مدافع شهری است که می‌داند احتمالاً سقوط خواهد کرد. وداعش با آندروماخه و پسر خردسالش در سرود ۶ از انسانی‌ترین صحنه‌های ایلیاد است. پاتروکلوس را می‌کشد و خود به دست آشیل کشته می‌شود؛ آخرین بیت ایلیاد درباره‌ی خاکسپاری اوست."],
["priam","پریام","Πρίαμος","Priam","trojan","I","پادشاه سالخورده‌ی تروا و پدر پنجاه پسر، از جمله هکتور و پاریس. با هلن مهربان است و او را مقصر جنگ نمی‌داند. در سرود ۲۴، با راهنمایی هرمس شبانه به چادر آشیل می‌رود، دست قاتل پسرش را می‌بوسد و پیکر هکتور را بازپس می‌گیرد؛ دیداری که دو دشمن را در اندوه به هم نزدیک می‌کند."],
["paris","پاریس","Πάρις · Ἀλέξανδρος","Paris · Alexandros","trojan","I","شاهزاده‌ی تروا که نام دیگرش الکساندروس است. با بردن هلن از خانه‌ی میزبانش منلائوس، قانون مقدس مهمان‌نوازی را شکست و جنگ را به راه انداخت. در ایلیاد جنگاوری نه‌چندان دلیر است و هکتور بارها سرزنشش می‌کند. هکتورِ در حال مرگ پیش‌بینی می‌کند که پاریس با یاری آپولون آشیل را خواهد کشت."],
["andromache","آندروماخه","Ἀνδρομάχη","Andromache","trojan","I","همسر هکتور. پدر و هفت برادرش به دست آشیل کشته شده‌اند و همه‌ی امیدش هکتور است. در سرود ۶ از او می‌خواهد در شهر بماند؛ در سرود ۲۲ از بالای دیوار کشیده شدن پیکر او را می‌بیند. در سوگواری‌اش در سرود ۲۴، آینده‌ی تلخ خود و پسرشان آستوآناکس را پیش‌بینی می‌کند."],
["hecuba","هکابه","Ἑκάβη","Hecuba","trojan","I","ملکه‌ی تروا، همسر پریام و مادر هکتور. در سرود ۲۲ از بالای دیوار به هکتور التماس می‌کند که به درون شهر بازگردد و پس از مرگ او از سوگواران اصلی است. با سفر پریام به اردوگاه دشمن مخالفت می‌کند، چون می‌ترسد او را هم از دست بدهد."],
["aeneas","آئنئاس","Αἰνείας","Aeneas","trojan","I","شاهزاده‌ای تروآیی، پسر آفرودیته و آنخیسس. در ایلیاد دو بار از مرگ نجات می‌یابد: یک بار به دست مادرش وقتی دیومدس زخمی‌اش می‌کند، و یک بار به دست پوزئیدون، چون سرنوشتش این است که پس از سقوط تروا زنده بماند و بر بازماندگان فرمان براند. ویرژیل بعدها در «انه‌اید» او را نیای رومیان دانست."],
["chryses","کریسس","Χρύσης","Chryses","trojan","I","کاهن آپولون. برای آزاد کردن دخترش کریسئیس، که اسیر آگاممنون است، با هدایای فراوان می‌آید اما آگاممنون تحقیرش می‌کند. کریسس از آپولون یاری می‌خواهد و آپولون طاعونی بر اردوگاه یونانیان می‌فرستد. این زنجیره، نخستین گره‌ی داستان ایلیاد است."],
["helen","هلن","Ἑλένη","Helen","trojan","B","همسر منلائوس که با پاریس به تروا رفت و بهانه‌ی جنگ شد. در ایلیاد پشیمان است و خود را سرزنش می‌کند؛ از بالای دیوار سرداران یونانی را به پریام معرفی می‌کند و در سوگ هکتور می‌گوید او هرگز با وی تند سخن نگفته بود. در اودیسه دوباره ملکه‌ی اسپارت است؛ به تلماخوس دارویی برای فراموشی اندوه می‌دهد و از ورود پنهانی اودیسئوس به تروا حکایت می‌کند."],

["zeus","زئوس","Ζεύς","Zeus","god","B","پدر خدایان و انسان‌ها. در ایلیاد، به خواهش تتیس، اراده می‌کند تروآییان موقتاً پیروز شوند تا ارزش آشیل آشکار شود؛ این «خواست زئوس» در بیت‌های آغازین ایلیاد آمده است. در اودیسه، انجمن خدایان به ریاست او بازگشت اودیسئوس را تصویب می‌کند و کشتی یاران اودیسئوس را به کیفر خوردن گاوهای هلیوس با صاعقه نابود می‌کند. نگهبان مهمانان و پناهندگان نیز هست."],
["hera","هرا","Ἥρα","Hera","god","B","همسر و خواهر زئوس و دشمن سرسخت تروا از زمان داوری پاریس. در سرود ۱۴ ایلیاد با کمربند آفرودیته زئوس را می‌فریبد و به خواب می‌برد تا پوزئیدون بتواند به یونانیان یاری برساند. در اودیسه نقش اندکی دارد."],
["athena","آتنا","Ἀθηνᾶ","Athena","god","B","ایزدبانوی خرد، جنگ سنجیده و پیشه‌ها. در ایلیاد هوادار یونانیان است: آشیل را از کشتن آگاممنون بازمی‌دارد، به دیومدس نیرو می‌دهد و با فریب، هکتور را به رویارویی با آشیل می‌کشاند. در اودیسه حامی همیشگی اودیسئوس و تلماخوس است؛ اغلب در هیئت انسان‌ها، مانند منتور، ظاهر می‌شود و در پایان میان خاندان اودیسئوس و خانواده‌های خواستگاران صلح برقرار می‌کند."],
["apollo","آپولون","Ἀπόλλων","Apollo","god","B","ایزد کمان، طاعون، شفا و موسیقی و هوادار تروا. ایلیاد با طاعونی آغاز می‌شود که او به خواهش کاهنش کریسس می‌فرستد. پاتروکلوس را با ضربه‌ای بی‌سلاح می‌کند و تا واپسین لحظه پشتیبان هکتور است. در اودیسه، روز کشتار خواستگاران با جشن آپولون، ایزد کمانداران، هم‌زمان است."],
["aphrodite","آفرودیته","Ἀφροδίτη","Aphrodite","god","B","ایزدبانوی عشق که در داوری پاریس برنده شد و هلن را به پاریس وعده داد. در ایلیاد پاریس را از دست منلائوس می‌رباید و هنگام نجات پسرش آئنئاس به دست دیومدس زخمی می‌شود. در اودیسه، دمودوکوس ترانه‌ای طنزآمیز درباره‌ی گرفتار شدن او و آرس در تور نامرئی همسرش هفائستوس می‌خواند."],
["poseidon","پوزئیدون","Ποσειδῶν","Poseidon","god","B","ایزد دریا و زمین‌لرزه. در ایلیاد هوادار یونانیان است و در غفلت زئوس پنهانی به آنان یاری می‌رساند، هرچند آئنئاس را از مرگ نجات می‌دهد. در اودیسه دشمن اصلی اودیسئوس است، چون او پسرش پولیفموس را کور کرد؛ همین خشم بازگشت او را سال‌ها به تأخیر می‌اندازد."],
["hermes","هرمس","Ἑρμῆς","Hermes","god","B","پیام‌آور خدایان و راهنمای مسافران و ارواح. در ایلیاد پریام را پنهانی از میان اردوگاه یونانیان به چادر آشیل می‌برد. در اودیسه فرمان آزادی اودیسئوس را به کالیپسو می‌رساند، گیاه جادویی «مولو» را برای ایمنی از جادوی کیرکه به او می‌دهد و در پایان ارواح خواستگاران را به جهان زیرین می‌برد."],
["thetis","تتیس","Θέτις","Thetis","god","B","ایزدبانوی دریا و مادر آشیل که می‌داند پسرش عمری کوتاه خواهد داشت. در ایلیاد از زئوس می‌خواهد آشیل را با شکست یونانیان گرامی بدارد و پس از مرگ پاتروکلوس، از هفائستوس زره تازه‌ای برای او می‌گیرد. در اودیسه، روح آگاممنون تعریف می‌کند که تتیس و پریان دریا در خاکسپاری آشیل گریستند."],
["ares","آرس","Ἄρης","Ares","god","B","ایزد جنگ و خشونت بی‌مهار که در ایلیاد بیشتر در کنار تروآییان است. در سرود ۵ دیومدس با یاری آتنا زخمی‌اش می‌کند و او نعره‌زنان به المپ می‌گریزد. در اودیسه، قهرمان ترانه‌ی عشق پنهانی‌اش با آفرودیته است."],
["hephaestus","هفائستوس","Ἥφαιστος","Hephaestus","god","B","ایزد آهنگری و آتش. در سرود ۱۸ ایلیاد برای آشیل سپری می‌سازد که تمام جهان، از جنگ و صلح تا کشتزار و جشن عروسی، بر آن نقش بسته است. در اودیسه، تور نامرئی‌ای می‌سازد و همسرش آفرودیته را با آرس در آن گرفتار می‌کند."],

["penelope","پنلوپه","Πηνελόπεια","Penelope","home","O","همسر اودیسئوس که بیست سال چشم‌به‌راه او ماند. برای عقب انداختن خواستگاران گفت پس از بافتن کفن لائرتس شوهر برمی‌گزیند و سه سال هر شب بافته‌ی روز را می‌شکافت. خود او مسابقه‌ی کمان را پیشنهاد می‌کند و در پایان با پرسیدن راز تخت زناشویی، که بر تنه‌ی درخت زیتون ساخته شده، اودیسئوس را می‌آزماید. در زیرکی همتای همسرش است."],
["telemachus","تلماخوس","Τηλέμαχος","Telemachus","home","O","پسر اودیسئوس که هنگام رفتن پدر نوزاد بود. چهار سرود نخست اودیسه درباره‌ی اوست: با راهنمایی آتنا به پولوس و اسپارت سفر می‌کند تا از پدر خبری بیابد، و در این سفر بزرگ می‌شود. در کشتار خواستگاران در کنار پدر می‌جنگد."],
["laertes","لائرتس","Λαέρτης","Laertes","home","O","پدر سالخورده‌ی اودیسئوس که از اندوه به کشتزاری دورافتاده پناه برده است. در سرود ۲۴، اودیسئوس با نام بردن درختانی که پدرش در کودکی به او بخشیده بود، خود را به او می‌شناساند. آتنا نیرویی تازه به او می‌دهد و او هم در نبرد پایانی شرکت می‌کند."],
["eumaeus","ائومائوس","Εὔμαιος","Eumaeus","home","O","خوک‌بان وفادار اودیسئوس که در کودکی شاهزاده بوده و دزدان دریایی او را به بردگی فروخته‌اند. با آنکه تهیدست است، از گدای ناشناس به گرمی پذیرایی می‌کند. شاعر بارها او را مستقیم خطاب می‌کند، نشانه‌ای از دلبستگی ویژه به این شخصیت."],
["eurycleia","اوروکلئیا","Εὐρύκλεια","Eurycleia","home","O","دایه‌ی پیر اودیسئوس. هنگام شستن پای گدا، از روی زخم کهنه‌ای که گرازی در جوانی به اودیسئوس زده بود، او را می‌شناسد؛ اودیسئوس گلویش را می‌گیرد تا رازش فاش نشود."],
["argos","آرگوس (سگ)","Ἄργος","Argos the dog","home","O","سگ شکاری اودیسئوس که او پیش از رفتن پرورشش داده بود. بیست سال بعد، پیر و رهاشده روی کپه‌ای کود افتاده است؛ صاحبش را بی‌درنگ می‌شناسد، دم تکان می‌دهد و می‌میرد. اودیسئوس پنهانی اشک می‌ریزد."],
["suitors","خواستگاران","μνηστῆρες","The Suitors","home","O","صد و هشت مرد جوان از اشراف ایتاکا و جزیره‌های پیرامون که سال‌ها در کاخ اودیسئوس جشن می‌گیرند، دارایی او را می‌خورند و پنلوپه را زیر فشار می‌گذارند تا یکی از آنان را برگزیند. برای کشتن تلماخوس هم نقشه می‌کشند. در سرود ۲۲ همه به دست اودیسئوس و همراهانش کشته می‌شوند."],
["antinous","آنتینوئوس","Ἀντίνοος","Antinous","home","O","گستاخ‌ترین و قدرتمندترین خواستگار. طرح کمین برای کشتن تلماخوس از اوست و چهارپایه‌ای به سوی گدای ناشناس پرتاب می‌کند. نخستین کسی است که با تیر اودیسئوس، درست هنگام نوشیدن از جام، کشته می‌شود."],

["alcinous","آلکینوئوس","Ἀλκίνοος","Alcinous","voyage","O","پادشاه فایاکیان در اسخریا. از اودیسئوس پذیرایی شاهانه می‌کند و در دربار اوست که اودیسئوس سرگذشت سفرهایش را در چهار سرود (۹ تا ۱۲) بازمی‌گوید. سپس او را با هدایای فراوان به ایتاکا می‌فرستد."],
["nausicaa","نائوسیکا","Ναυσικάα","Nausicaa","voyage","O","دختر جوان آلکینوئوس. هنگام شستن جامه‌ها در کنار دریا، اودیسئوسِ کشتی‌شکسته و برهنه را می‌یابد و با دلیری و خونسردی راه کاخ را به او نشان می‌دهد. دیدار آن دو از ظریف‌ترین صحنه‌های اودیسه است."],
["demodocus","دمودوکوس","Δημόδοκος","Demodocus","voyage","O","خنیاگر نابینای دربار فایاکیان. ترانه‌هایش درباره‌ی جنگ تروا، به‌ویژه داستان اسب چوبی، اودیسئوس را به گریه می‌اندازد و او ناچار هویتش را فاش می‌کند. یونانیان باستان در این خنیاگر نابینا تصویری از خود هومر می‌دیدند."],
["polyphemus","پولیفموس","Πολύφημος","Polyphemus","voyage","O","غول یک‌چشم و پسر پوزئیدون. اودیسئوس و یارانش را در غارش زندانی می‌کند و چند تن را می‌خورد. اودیسئوس نام خود را «هیچ‌کس» می‌گوید، او را مست و کور می‌کند و زیر شکم قوچ‌ها می‌گریزد. اما اودیسئوس هنگام رفتن نام واقعی خود را فریاد می‌زند و نفرین پوزئیدون را به جان می‌خرد."],
["circe","کیرکه","Κίρκη","Circe","voyage","O","ایزدبانو و جادوگری در جزیره‌ی آیایا که یاران اودیسئوس را به خوک بدل می‌کند. اودیسئوس با گیاه مولو که هرمس به او داده، از جادو در امان می‌ماند و او را وادار می‌کند یارانش را بازگرداند. یک سال نزد او می‌مانند و کیرکه راه جهان زیرین و خطرهای پیش رو را نشانش می‌دهد."],
["calypso","کالیپسو","Καλυψώ","Calypso","voyage","O","پری جزیره‌ی اوگوگیا. هفت سال اودیسئوس را نزد خود نگه می‌دارد و به او جاودانگی پیشنهاد می‌کند، اما اودیسئوس هر روز در ساحل برای خانه می‌گرید. با فرمان زئوس که هرمس می‌آورد، ناچار رهایش می‌کند. نامش در یونانی یعنی «پنهان‌کننده»."],
["sirens","سیرن‌ها","Σειρῆνες","Sirens","voyage","O","موجوداتی که با آوازشان دریانوردان را به سوی مرگ می‌کشانند. به سفارش کیرکه، اودیسئوس گوش یارانش را با موم می‌بندد و از آنان می‌خواهد او را به دکل ببندند تا آواز را بشنود و زنده بماند. وعده‌ی آنان دانستن همه‌ی رویدادهای تروا و همه‌ی دانش جهان است."],
["scylla","اسکیلا و خاروبدیس","Σκύλλα · Χάρυβδις","Scylla & Charybdis","voyage","O","دو خطر در دو سوی تنگه‌ای باریک: اسکیلا، هیولایی شش‌سر که از هر کشتی شش مرد می‌رباید، و خاروبدیس، گردابی که دریا را می‌بلعد. اودیسئوس به راهنمایی کیرکه از کنار اسکیلا می‌گذرد و شش تن از یارانش را از دست می‌دهد."],
["tiresias","تیرزیاس","Τειρεσίας","Tiresias","voyage","O","پیشگوی نابینای تبای. اودیسئوس به جهان زیرین می‌رود تا از روح او راه بازگشت را بپرسد. تیرزیاس هشدار می‌دهد که به گاوهای هلیوس دست نزنند و پیش‌بینی می‌کند اودیسئوس تنها و دیر به خانه خواهد رسید و در پیری آرام خواهد مرد."],
["aeolus","آئولوس","Αἴολος","Aeolus","voyage","O","نگهبان بادها. همه‌ی بادهای مخالف را در کیسه‌ای چرمی به اودیسئوس می‌سپارد. وقتی ایتاکا در دیدرس است و اودیسئوس به خواب رفته، یارانش به گمان آنکه کیسه پر از طلاست بازش می‌کنند و طوفان آنان را به عقب بازمی‌گرداند."],
["lotus","لوتوس‌خواران","Λωτοφάγοι","Lotus-Eaters","voyage","O","مردمی که میوه‌ی لوتوس می‌خورند. هر یک از یاران اودیسئوس که از آن می‌چشد، میل بازگشت به خانه را فراموش می‌کند و اودیسئوس به زور آنان را به کشتی بازمی‌گرداند. نخستین تهدید سفر، نه جان یاران بلکه خواست بازگشتشان را نشانه می‌گیرد."],

["troy","تروا","Ἴλιος · Τροίη","Troy · Ilion","place","B","شهری در شمال غربی آسیای صغیر (ترکیه‌ی امروز) که یونانیان ده سال محاصره‌اش کردند؛ نام «ایلیاد» از نام دیگر آن، ایلیون، آمده است. تمام ایلیاد در دشت و پای دیوارهای آن می‌گذرد، اما سقوطش در ایلیاد روایت نمی‌شود و آن را از خاطرات و ترانه‌های اودیسه می‌شنویم. بیشتر پژوهشگران ویرانه‌های تپه‌ی حصارلیک را همان تروا می‌دانند."],
["ithaca","ایتاکا","Ἰθάκη","Ithaca","place","B","جزیره‌ای کوچک و سنگلاخ در دریای ایونی و قلمرو اودیسئوس. در ایلیاد تنها در فهرست کشتی‌ها و لقب اودیسئوس آمده است؛ در اودیسه هدف تمام سفر و صحنه‌ی نیمه‌ی دوم داستان است. اودیسئوس آن را با همه‌ی فقرش بر جزیره‌ی بهشتی کالیپسو ترجیح می‌دهد."],
["sparta","اسپارت","Σπάρτη","Sparta · Lacedaemon","place","B","قلمرو منلائوس در لاکدایمون، جایی که پاریس هلن را از آن برد. در سرود ۴ اودیسه، تلماخوس در کاخ پرشکوه منلائوس و هلن مهمان می‌شود."],
["pylos","پولوس","Πύλος","Pylos","place","B","قلمرو نستور در جنوب غربی پلوپونز. در ایلیاد نستور بارها از جنگ‌های جوانی‌اش در آنجا یاد می‌کند؛ در اودیسه نخستین مقصد تلماخوس در جست‌وجوی خبر از پدر است."],
["ogygia","اوگوگیا","Ὠγυγίη","Ogygia","place","O","جزیره‌ی دورافتاده‌ی کالیپسو که «ناف دریا» خوانده می‌شود. اودیسئوس هفت سال در آن گرفتار است و داستان اودیسه هنگامی آغاز می‌شود که او هنوز آنجاست."],
["aeaea","آیایا","Αἰαίη","Aeaea","place","O","جزیره‌ی کیرکه. اودیسئوس و یارانش یک سال در آن می‌مانند و از آنجا به لبه‌ی جهان، به آستانه‌ی جهان زیرین، سفر می‌کنند."],
["scheria","اسخریا","Σχερίη","Scheria · Phaeacia","place","O","سرزمین فایاکیان، دریانوردانی افسانه‌ای که کشتی‌هایشان بی‌سکان راه را می‌دانند. آخرین ایستگاه پیش از ایتاکا و جایی که اودیسئوس داستانش را بازمی‌گوید. پوزئیدون کشتی‌ای را که او را رساند، در راه بازگشت به سنگ بدل می‌کند."],
["hades","جهان زیرین (هادس)","Ἅιδης","Hades · Underworld","place","B","قلمرو مردگان. در ایلیاد روح پاتروکلوس پیش از خاکسپاری نمی‌تواند به آن وارد شود و در خواب از آشیل یاری می‌خواهد. در اودیسه دو بار به آن سر می‌زنیم: در سرود ۱۱ اودیسئوس با ارواح دیدار می‌کند و در سرود ۲۴ ارواح خواستگاران به آنجا می‌رسند. اینجا همان جایی است که قهرمانان ایلیاد، پس از مرگ، در اودیسه دوباره سخن می‌گویند."]

const EN={
iliad:["Iliad","Ilias, Iliados, Ilium | ایلیاد هومر","The Iliad covers a few weeks in the tenth year of the Trojan War, not the whole war. In 24 books and about 15,700 lines, it begins with the wrath of Achilles and his quarrel with Agamemnon, and moves through the death of Patroclus and the killing of Hector to the mourning and funeral of Hector. Neither the start of the war nor the fall of Troy is narrated. Its great subjects are honor, mortality and the cost of rage."],
odyssey:["Odyssey","Odysseia, Odyssee | ادیسه, اودیسه‌ی هومر","The Odyssey tells of Odysseus' ten-year journey home from Troy. In 24 books and about 12,100 lines, it opens with his son Telemachus, then reaches Odysseus' sea adventures, most of which he narrates himself at the Phaeacian court, and ends with his return to Ithaca, the killing of the suitors and his reunion with Penelope. The main narrative covers only about forty days. If the Iliad is the epic of war, the Odyssey is the epic of cunning, hospitality and home."],
homer:["Homer","Homeros | همر, هومروس","The poet of both epics according to Greek tradition. He probably lived in the 8th or 7th century BC in Ionia, on the western coast of Asia Minor. Whether Homer was one person or a name for a long tradition of oral bards is still debated; this is known as the Homeric Question. Most scholars think the Iliad is older than the Odyssey."],
menis:["Wrath (mēnis)","wrath, rage, anger, menis | خشم, غضب","The first word of the Iliad is 'wrath'. Achilles' anger at Agamemnon, and then his devastating rage at Hector, drives the story. The word was normally used for the anger of gods, and using it for a mortal marks how extreme Achilles' anger is."],
kleos:["Glory (kleos)","glory, fame, renown, kleos | افتخار, شهرت, آوازه","Fame that outlives death and survives through songs like these. Achilles knows that if he stays at Troy he will have a short life but undying glory, and if he goes home, a long life without a name. In the Odyssey his ghost questions that choice, and Odysseus wins glory not by dying in battle but by surviving and coming home."],
nostos:["Homecoming (nostos)","homecoming, return, nostalgia, nostos | بازگشت, نوستالژی","The return home, the central theme of the Odyssey. The homecomings of other Trojan War heroes are also told: Nestor and Menelaus got home in the end, Agamemnon was murdered in his own house, and Ajax the Lesser drowned at sea. The word 'nostalgia' comes from the same root."],
xenia:["Hospitality (xenia)","hospitality, guest friendship, guest-friend, xenia | مهمان‌نوازی","The sacred bond between host and guest, protected by Zeus. The Trojan War began when Paris violated it. The Odyssey is almost entirely a test of this custom: the Phaeacians, Nestor and Eumaeus are model hosts, while Polyphemus and the suitors trample on it and are punished."],
metis:["Cunning (mētis)","cunning, wit, intelligence, trickery, metis | زیرکی, ترفند, حیله","Practical intelligence and trickery, the quality that sets Odysseus apart from other heroes. In the Iliad victory mostly comes from strength; in the Odyssey it comes from the name 'Nobody', the Wooden Horse, a beggar's disguise and Penelope's weaving trick. Athena is the goddess of exactly this kind of wisdom."],
judgment:["Judgment of Paris","judgement, golden apple, apple of discord, Eris | سیب طلایی, سیب نفاق","The background to the war: Paris had to choose the most beautiful among Hera, Athena and Aphrodite. Aphrodite won by promising him the most beautiful woman in the world, Helen, and the hatred of Hera and Athena for Troy began here. The Iliad does not tell this story and alludes to it only once, in Book 24."],
quarrel:["The Quarrel","quarrel, dispute, feud, Book 1 | نزاع, دعوا","The opening event of the Iliad (Book 1). Agamemnon is forced to return his captive to her father Chryses to end Apollo's plague, and in compensation takes Briseis from Achilles. Achilles is about to draw his sword when Athena stops him; he withdraws from the fighting and asks his mother to make the Greeks suffer defeat."],
embassy:["The Embassy to Achilles","embassy, Phoenix, Book 9 | سفارت, فوینیکس","In Book 9, Agamemnon sends Odysseus, Ajax and old Phoenix to Achilles with an offer of rich gifts and the return of Briseis. Achilles refuses and speaks of his two possible fates: a short life with undying fame, or a long life without a name."],
shield:["Shield of Achilles","shield, armor, armour, Book 18 | سپر, زره","In Book 18, Hephaestus forges a new shield for Achilles at Thetis' request. Its scenes, from the sky and stars to a city at peace with a wedding and a lawsuit, a city under siege, ploughland, a vineyard and dancing, picture the whole of human life that goes on outside the war. The description became the model for ekphrasis in Western literature."],
ransom:["Ransom of Hector","ransom, Hector's body, Book 24 | بازخرید","The ending of the Iliad (Book 24). Priam, guided by Hermes, goes by night to Achilles' hut with a wagon full of gifts. Achilles, remembering his own old father, weeps with him, gives back Hector's body and grants a truce for the funeral. The epic of wrath ends in compassion."],
horse:["Wooden Horse","Trojan horse, wooden horse, Epeius | اسب تروا, اسب تروآ","Odysseus' trick for taking Troy. The story is not in the Iliad; the Odyssey tells it three times: Helen and Menelaus in Sparta, Demodocus at the Phaeacian court, and Odysseus himself to the ghost of Achilles, when he praises his son's courage inside the horse. It is the key link between the end of the war and the start of the journey home."],
nekyia:["Journey to the Underworld (Nekyia)","nekyia, nekuia, book of the dead, underworld journey, Book 11 | نکویا, جهان مردگان","Book 11 of the Odyssey and the most important bridge between the two epics. Guided by Circe, Odysseus travels to the edge of the world to hear Tiresias' prophecy. There he meets his mother and then the heroes of the Iliad, Agamemnon, Achilles and Ajax, each of whom casts a new and bitter light on the values of the Trojan War."],
cattle:["Cattle of Helios","oxen of the sun, Helios, Hyperion, Thrinacia, Thrinakia, Book 12 | هلیوس, تریناکیه, گاوهای خورشید","On the island of Thrinacia graze the sacred cattle of the Sun. Despite warnings from Tiresias and Circe, Odysseus' starving crew slaughter them while he is away. Zeus destroys the ship with a thunderbolt and only Odysseus survives. The opening lines of the Odyssey recall this crime."],
contest:["Contest of the Bow","bow, axes, slaughter of the suitors, mnesterophonia, Books 21-22 | کمان, کشتار خواستگاران","Books 21 and 22. Penelope announces she will marry whoever can string Odysseus' bow and shoot an arrow through twelve axe heads. None of the suitors can even string it; the unknown beggar does it with ease, then, with Telemachus and two loyal servants, kills the suitors."],
achilles:["Achilles","Achilleus, Akhilleus, Pelides, son of Peleus | آخیلس, آخیلئوس, اخیلوس, آشیل","The greatest Greek warrior, son of the sea goddess Thetis and Peleus. The Iliad opens with his wrath: when Agamemnon takes Briseis from him, he withdraws from battle and the Greeks suffer defeat after defeat. The death of Patroclus brings him back, and he kills Hector, but in the end he shows compassion to the grieving Priam. His own death is not narrated in either epic; in the Odyssey, his ghost says he would rather be a hired laborer on earth than king of the dead."],
agamemnon:["Agamemnon","Atreides, Atrides, son of Atreus | آگاممنون","King of Mycenae, commander-in-chief of the Greek army and brother of Menelaus. His arrogance in taking Briseis from Achilles creates the central crisis of the Iliad. The Odyssey recalls his fate repeatedly: on his return from Troy he was murdered by his wife Clytemnestra and her lover Aegisthus, and his ghost tells the story to Odysseus. His fate is the opposite of Odysseus' triumphant homecoming."],
menelaus:["Menelaus","Menelaos, Atreides | منلاس, منلائوس","King of Sparta and husband of Helen; her abduction by Paris caused the war. In Book 3 of the Iliad he fights Paris in a duel and nearly kills him before Aphrodite rescues Paris. In the Odyssey he and Helen are back in Sparta after eight years of wandering and host Telemachus; Menelaus tells how he wrestled Proteus, the Old Man of the Sea."],
odysseus:["Odysseus","Ulysses, Ulixes, Odysseus, Laertiades | اولیس, اولیسس, ادیسئوس, ادیسه","King of Ithaca and the only major figure who plays a central role in both epics, the bridge between them. In the Iliad he is a clever speaker and trusted counselor: he stops the army from fleeing, speaks in the embassy to Achilles and makes a night raid with Diomedes. In the Odyssey he is the hero: he wanders the seas for ten years after the war, loses all his men and finally returns home disguised as a beggar. His constant epithet is 'man of many turns'."],
patroclus:["Patroclus","Patroklos, Menoetiades | پاتروکل","Achilles' closest companion. When the Greeks are on the verge of defeat, he puts on Achilles' armor and drives the Trojans back, but Apollo stuns and disarms him and Hector kills him (Book 16). His death is the turning point of the Iliad. His ghost appears in Achilles' dream asking for burial; in the Odyssey his shade is seen beside Achilles in the underworld."],
ajax:["Ajax","Aias, Telamonian Ajax, Ajax the Great | آیاس, آژاکس بزرگ","Ajax son of Telamon, the mightiest Greek warrior after Achilles and their wall of defense by the ships. He fights a duel with Hector that ends without a winner. After Achilles' death he lost the contest for Achilles' armor to Odysseus and killed himself. In the Odyssey his ghost refuses to speak to Odysseus out of resentment: one of the most memorable silences in literature."],
diomedes:["Diomedes","Diomede, Tydides, son of Tydeus | دیومد","King of Argos and the youngest of the great Greek commanders. In Book 5 of the Iliad, backed by Athena, he fights so fiercely that he wounds even Aphrodite and Ares. He goes on the night raid with Odysseus (Book 10). In the Odyssey, Nestor reports that Diomedes reached home safely."],
nestor:["Nestor","Nestor of Pylos, Gerenian | نستور","The aged king of Pylos and the oldest Greek commander; a talkative adviser who draws examples from his youth. In the Iliad he mediates between Achilles and Agamemnon and suggests that Patroclus go into battle in Achilles' armor. In Book 3 of the Odyssey he hosts Telemachus and tells of the Greek heroes' homecomings."],
briseis:["Briseis","Briseis, Hippodameia | بریسئیس","A woman Achilles took captive in a raid. When Agamemnon must give up his own captive, he takes Briseis from Achilles, which sparks Achilles' wrath. She is returned to Achilles in Book 19 and mourns over the body of Patroclus, who had always been kind to her."],
clytemnestra:["Clytemnestra","Clytaemnestra, Klytaimnestra, Klytemnestra | کلیتمنسترا","Wife of Agamemnon. In Book 1 of the Iliad, Agamemnon openly says he prefers his captive to her. In the Odyssey, she and Aegisthus kill Agamemnon on his return, and his ghost names her the model of betrayal, set against Penelope, the model of fidelity. The comparison recurs throughout the Odyssey."],
hector:["Hector","Hektor | هکتور","The greatest Trojan warrior, son of Priam and Hecuba and husband of Andromache. He defends a city he knows will probably fall. His farewell to Andromache and their baby son in Book 6 is one of the most human scenes in the Iliad. He kills Patroclus and is killed by Achilles; the last line of the Iliad is about his funeral."],
priam:["Priam","Priamos | پریاموس","The aged king of Troy and father of fifty sons, including Hector and Paris. He is kind to Helen and does not blame her for the war. In Book 24, guided by Hermes, he goes by night to Achilles' hut, kisses the hands of his son's killer and ransoms Hector's body, a meeting that draws two enemies together in grief."],
paris:["Paris","Alexandros, Alexander | الکساندروس","Trojan prince, also called Alexandros. By carrying Helen off from the house of his host Menelaus, he broke the sacred law of hospitality and started the war. In the Iliad he is a less than brave fighter and Hector often rebukes him. The dying Hector foretells that Paris, with Apollo's help, will kill Achilles."],
andromache:["Andromache","Andromakhe | آندروماک","Wife of Hector. Her father and seven brothers were killed by Achilles, and Hector is all she has. In Book 6 she begs him to stay inside the city; in Book 22 she sees his body dragged from the walls. Her lament in Book 24 foresees the bitter future of herself and their son Astyanax."],
hecuba:["Hecuba","Hekabe, Hecabe | هکوبا, هکوب","Queen of Troy, wife of Priam and mother of Hector. In Book 22 she pleads with Hector from the walls to come inside, and after his death she is one of the chief mourners. She opposes Priam's journey to the enemy camp, fearing to lose him too."],
aeneas:["Aeneas","Aineias, Eneas | انه, انئاس, اینیاس","A Trojan prince, son of Aphrodite and Anchises. In the Iliad he is saved from death twice: by his mother when Diomedes wounds him, and by Poseidon, because he is fated to survive the fall of Troy and rule the survivors. Virgil later made him the ancestor of the Romans in the Aeneid."],
chryses:["Chryses","Chryses, priest of Apollo | کریسس کاهن","A priest of Apollo. He comes with rich gifts to free his daughter Chryseis, Agamemnon's captive, but Agamemnon insults him. Chryses prays to Apollo, who sends a plague on the Greek camp. This chain of events is the first knot of the Iliad's plot."],
helen:["Helen","Helen of Troy, Helene | هلن تروا, هلنا","Wife of Menelaus who went to Troy with Paris and became the cause of the war. In the Iliad she is regretful and blames herself; from the walls she names the Greek commanders for Priam, and in her lament for Hector she says he never spoke harshly to her. In the Odyssey she is queen of Sparta again; she gives Telemachus a drug that banishes grief and tells of Odysseus slipping into Troy in disguise."],
zeus:["Zeus","Jupiter, Jove, Kronides, Cronides, Cronion | ژوپیتر, مشتری","Father of gods and men. In the Iliad, at Thetis' request, he wills a temporary Trojan victory to show Achilles' worth; this 'plan of Zeus' is mentioned in the opening lines. In the Odyssey, the council of the gods under him approves Odysseus' return, and he destroys the crew's ship with a thunderbolt as punishment for eating the cattle of Helios. He is also the protector of guests and suppliants."],
hera:["Hera","Juno, Here | جونو, یونو","Wife and sister of Zeus and a relentless enemy of Troy since the Judgment of Paris. In Book 14 of the Iliad she seduces Zeus with Aphrodite's girdle and puts him to sleep so that Poseidon can help the Greeks. She has a small role in the Odyssey."],
athena:["Athena","Minerva, Pallas, Pallas Athene, Athene, Tritogeneia | مینروا, پالاس, آتنه, آتنا","Goddess of wisdom, strategic warfare and crafts. In the Iliad she supports the Greeks: she stops Achilles from killing Agamemnon, empowers Diomedes and tricks Hector into facing Achilles. In the Odyssey she is the constant protector of Odysseus and Telemachus; she often appears in human form, as Mentor for instance, and at the end imposes peace between Odysseus' family and the suitors' kin."],
apollo:["Apollo","Phoebus, Phoebus Apollo, Apollon | فیبوس, آپولو","God of the bow, plague, healing and music, and a supporter of Troy. The Iliad opens with the plague he sends at the prayer of his priest Chryses. He disarms Patroclus with a blow and stands behind Hector until the very end. In the Odyssey, the day of the suitors' slaughter coincides with a festival of Apollo, the archer god."],
aphrodite:["Aphrodite","Venus, Cypris, Kypris, Cytherea | ونوس, ناهید","Goddess of love who won the Judgment of Paris by promising him Helen. In the Iliad she snatches Paris away from Menelaus and is wounded by Diomedes while rescuing her son Aeneas. In the Odyssey, Demodocus sings a comic song about her and Ares being caught in an invisible net made by her husband Hephaestus."],
poseidon:["Poseidon","Neptune, Earthshaker, Enosichthon | نپتون","God of the sea and earthquakes. In the Iliad he supports the Greeks and secretly helps them while Zeus is distracted, though he also saves Aeneas from death. In the Odyssey he is Odysseus' main enemy, because Odysseus blinded his son Polyphemus; that anger delays his return for years."],
hermes:["Hermes","Mercury, Argeiphontes, Argus-slayer | مرکوری, عطارد","Messenger of the gods and guide of travelers and souls. In the Iliad he leads Priam secretly through the Greek camp to Achilles' hut. In the Odyssey he carries the order to free Odysseus to Calypso, gives Odysseus the magic herb moly against Circe's spells, and at the end leads the suitors' souls to the underworld."],
thetis:["Thetis","Thetis, sea nymph, Nereid | تتیس, پری دریایی","Sea goddess and mother of Achilles, who knows her son will die young. In the Iliad she asks Zeus to honor Achilles by letting the Greeks lose, and after Patroclus' death obtains new armor for him from Hephaestus. In the Odyssey, Agamemnon's ghost describes how Thetis and the sea nymphs wept at Achilles' funeral."],
ares:["Ares","Mars, Enyalius | مارس, مریخ","God of war and unrestrained violence, mostly on the Trojan side in the Iliad. In Book 5 Diomedes, helped by Athena, wounds him and he flees bellowing to Olympus. In the Odyssey he is the hero of the song about his secret love affair with Aphrodite."],
hephaestus:["Hephaestus","Vulcan, Hephaistos, Hephaestos | ولکان, وولکان","God of the forge and fire. In Book 18 of the Iliad he makes Achilles a shield showing the whole world, from war and peace to fields and a wedding feast. In the Odyssey he forges an invisible net and catches his wife Aphrodite in it with Ares."],
penelope:["Penelope","Penelopeia | پنه‌لوپه, پنلوپ","Wife of Odysseus, who waited twenty years for him. To delay the suitors she said she would choose a husband once she finished weaving a shroud for Laertes, and for three years she unpicked each night what she wove by day. She herself proposes the contest of the bow, and in the end tests Odysseus by the secret of their marriage bed, built on the trunk of an olive tree. She is her husband's equal in cunning."],
telemachus:["Telemachus","Telemachos, Telemakhos | تلماک","Odysseus' son, a baby when his father left. The first four books of the Odyssey (the 'Telemachy') follow him: guided by Athena, he travels to Pylos and Sparta for news of his father and grows up on the way. He fights at his father's side in the slaughter of the suitors."],
laertes:["Laertes","Laertes, father of Odysseus | لائرتس","Odysseus' elderly father, who has withdrawn in grief to a remote farm. In Book 24 Odysseus proves his identity by naming the trees his father gave him as a child. Athena restores his strength and he joins the final fight."],
eumaeus:["Eumaeus","Eumaios, swineherd | خوک‌بان","Odysseus' loyal swineherd, born a prince and sold into slavery by pirates as a child. Poor as he is, he gives the unknown beggar a warm welcome. The poet repeatedly addresses him directly, a sign of special affection for this character."],
eurycleia:["Eurycleia","Eurykleia, Euryclea, nurse | دایه","Odysseus' old nurse. While washing the beggar's feet she recognizes him by an old scar a boar gave him in his youth; Odysseus grips her throat to keep the secret."],
argos:["Argos the dog","Argus, dog, hound | آرگوس, سگ اودیسئوس","Odysseus' hunting dog, which he raised before leaving. Twenty years later, old and neglected, it lies on a dung heap; it recognizes its master at once, wags its tail and dies. Odysseus secretly wipes away a tear."],
suitors:["The Suitors","suitors, Eurymachus, Amphinomus | خواستگاران","One hundred and eight young nobles from Ithaca and the nearby islands who feast in Odysseus' palace for years, eat up his wealth and pressure Penelope to choose one of them. They also plot to kill Telemachus. In Book 22 all are killed by Odysseus and his allies."],
antinous:["Antinous","Antinoos | آنتینوس","The most arrogant and powerful of the suitors. The ambush to kill Telemachus is his plan, and he throws a stool at the unknown beggar. He is the first to die, shot by Odysseus' arrow just as he lifts a cup to drink."],
alcinous:["Alcinous","Alkinoos, Phaeacians, Arete | آلکینوس, فایاکیان","King of the Phaeacians on Scheria. He gives Odysseus royal hospitality, and it is at his court that Odysseus narrates his travels over four books (9 to 12). He then sends him home to Ithaca with many gifts."],
nausicaa:["Nausicaa","Nausikaa | نوسیکا","Alcinous' young daughter. Washing clothes by the sea, she finds the shipwrecked, naked Odysseus and with courage and composure shows him the way to the palace. Their meeting is one of the most delicate scenes in the Odyssey."],
demodocus:["Demodocus","Demodokos, bard, singer | خنیاگر, دمودوکس","The blind bard of the Phaeacian court. His songs about the Trojan War, especially the Wooden Horse, move Odysseus to tears and lead him to reveal his identity. Ancient Greeks saw in this blind bard a portrait of Homer himself."],
polyphemus:["Polyphemus","Cyclops, Cyclopes, Kyklops, Nobody, Outis | سیکلوپ, کوکلوپس, غول یک‌چشم","The one-eyed giant, son of Poseidon. He traps Odysseus and his men in his cave and eats several of them. Odysseus tells him his name is 'Nobody', gets him drunk, blinds him and escapes under the bellies of the rams. But as he sails away he shouts his real name, bringing Poseidon's curse on himself."],
circe:["Circe","Kirke | سیرسه, کرکه","A goddess and enchantress on the island of Aeaea who turns Odysseus' men into pigs. Protected by the herb moly from Hermes, Odysseus resists her magic and forces her to restore his men. They stay with her for a year, and Circe shows him the way to the underworld and the dangers ahead."],
calypso:["Calypso","Kalypso, Ogygia | کالیپسو","The nymph of the island of Ogygia. She keeps Odysseus with her for seven years and offers him immortality, but he weeps on the shore every day for home. On Zeus' orders, brought by Hermes, she has to let him go. Her name in Greek means 'she who conceals'."],
sirens:["Sirens","Seirenes, Sirens | سیرن, پریان آوازخوان","Creatures whose song lures sailors to their death. On Circe's advice Odysseus plugs his men's ears with wax and has himself tied to the mast so he can hear the song and live. They promise knowledge of everything that happened at Troy and all that happens on earth."],
scylla:["Scylla & Charybdis","Skylla, Charybdis, Kharybdis | سیلا, کاریبدیس","Two dangers on either side of a narrow strait: Scylla, a six-headed monster that snatches six men from every ship, and Charybdis, a whirlpool that swallows the sea. On Circe's advice Odysseus passes close to Scylla and loses six of his men."],
tiresias:["Tiresias","Teiresias, Tiresias the seer | تیرسیاس, تیرزیاس","The blind prophet of Thebes. Odysseus goes to the underworld to ask his ghost the way home. Tiresias warns them not to touch the cattle of Helios and foretells that Odysseus will reach home late and alone and die peacefully in old age."],
aeolus:["Aeolus","Aiolos, keeper of the winds, bag of winds | ائولوس, کیسه‌ی بادها","Keeper of the winds. He gives Odysseus all the contrary winds tied up in a leather bag. With Ithaca in sight and Odysseus asleep, his men open the bag thinking it holds gold, and a storm blows them all the way back."],
lotus:["Lotus-Eaters","Lotophagi, Lotophagoi, lotus eaters | لوتوس","A people who eat the fruit of the lotus. Any of Odysseus' men who taste it forget all desire to go home, and Odysseus drags them back to the ships by force. The first threat of the voyage targets not their lives but their will to return."],
troy:["Troy","Ilium, Ilion, Ilios, Troia, Hisarlik | ایلیون, تروآ, تروی","A city in northwestern Asia Minor (modern Turkey) besieged by the Greeks for ten years; the name 'Iliad' comes from its other name, Ilion. The entire Iliad takes place on its plain and beneath its walls, yet its fall is not narrated there; we hear of it through memories and songs in the Odyssey. Most scholars identify the ruins at Hisarlik with Troy."],
ithaca:["Ithaca","Ithaka, Ithaki | ایتاک","A small, rocky island in the Ionian Sea and Odysseus' kingdom. In the Iliad it appears only in the Catalogue of Ships and in Odysseus' title; in the Odyssey it is the goal of the whole journey and the setting of the second half. Odysseus prefers it, poor as it is, to Calypso's paradise island."],
sparta:["Sparta","Lacedaemon, Lakedaimon | لاکدایمون","Menelaus' kingdom in Lacedaemon, from which Paris took Helen. In Book 4 of the Odyssey, Telemachus is a guest in the splendid palace of Menelaus and Helen."],
pylos:["Pylos","Pylus | پیلوس","Nestor's kingdom in the southwestern Peloponnese. In the Iliad Nestor often recalls the battles of his youth there; in the Odyssey it is Telemachus' first stop in his search for news of his father."],
ogygia:["Ogygia","Ogygia, Calypso's island | جزیره‌ی کالیپسو","Calypso's remote island, called 'the navel of the sea'. Odysseus is trapped there for seven years, and the Odyssey begins while he is still there."],
aeaea:["Aeaea","Aiaia, Circe's island | جزیره‌ی کیرکه","Circe's island. Odysseus and his men stay there for a year and from there sail to the edge of the world, the threshold of the underworld."],
scheria:["Scheria","Phaeacia, Phaiakia, Scherie | فایاکیه","Land of the Phaeacians, legendary sailors whose ships know the way without a helmsman. The last stop before Ithaca and the place where Odysseus tells his story. Poseidon turns the ship that carried him home to stone on its way back."],
hades:["Underworld (Hades)","underworld, Hades, Erebus, Aides, land of the dead, Pluto | جهان مردگان, دوزخ","The realm of the dead. In the Iliad, Patroclus' ghost cannot enter it before burial and appears in a dream asking Achilles for help. In the Odyssey we visit it twice: in Book 11 Odysseus meets the ghosts, and in Book 24 the suitors' souls arrive there. This is where the heroes of the Iliad, after death, speak again in the Odyssey."]
