const X=[
// Greeks
["ajax_lesser","آژاکس کوچک","Αἴας ὁ Λοκρός","Ajax the Lesser","achaean","B","پسر اویلئوس و فرمانده‌ی لوکریان؛ کوتاه‌قامت اما تیزپا. در مسابقه‌ی دوی سرود ۲۳ ایلیاد، آتنا پایش را روی سرگین می‌لغزاند تا اودیسئوس برنده شود. در اودیسه، پروتئوس تعریف می‌کند که او پس از نجات از غرق شدن لاف زد که با وجود خواست خدایان جان به در برده است؛ پوزئیدون صخره‌ای را که بر آن پناه گرفته بود شکافت و او را غرق کرد.","Ajax the Lesser","Aias son of Oileus, Locrian Ajax, Oilean Ajax | آیاس کوچک","Son of Oileus and leader of the Locrians; small but fast. In the foot race of Iliad Book 23, Athena makes him slip in dung so Odysseus wins. In the Odyssey, Proteus tells how, after surviving a shipwreck, he boasted he had escaped despite the gods, and Poseidon split his rock and drowned him."],
["idomeneus","ایدومنئوس","Ἰδομενεύς","Idomeneus","achaean","B","پادشاه کرت و از سرداران پابه‌سن یونانی. سرود ۱۳ ایلیاد صحنه‌ی دلاوری اوست. در اودیسه، نستور می‌گوید او یارانش را به سلامت به کرت رساند و اودیسئوس در داستان‌های ساختگی‌اش بارها خود را کرتی و آشنای ایدومنئوس معرفی می‌کند.","Idomeneus","Idomeneus of Crete | ایدومنه","King of Crete and one of the older Greek commanders. Book 13 of the Iliad is his moment of glory. In the Odyssey, Nestor says he brought his men safely home, and Odysseus repeatedly poses as a Cretan who knew Idomeneus in his invented stories."],
["teucer","توکروس","Τεῦκρος","Teucer","achaean","I","کماندار ماهر و برادر ناتنی آژاکس که پشت سپر بزرگ او تیر می‌اندازد. در سرود ۱۵، درست وقتی هکتور را نشانه گرفته است، زئوس زه کمانش را پاره می‌کند.","Teucer","Teukros | توسر","A skilled archer and half-brother of Ajax, who shoots from behind Ajax's great shield. In Book 15, just as he aims at Hector, Zeus snaps his bowstring."],
["phoenix","فوینیکس","Φοῖνιξ","Phoenix","achaean","I","آموزگار سالخورده‌ی آشیل که او را پرورده است. در سفارت سرود ۹، داستان ملئاگروس را می‌گوید تا آشیل را از پافشاری بر خشم بازدارد، اما موفق نمی‌شود و نزد آشیل می‌ماند.","Phoenix","Phoinix, tutor of Achilles | فونیکس","Achilles' old tutor and foster father. In the embassy of Book 9 he tells the story of Meleager to warn Achilles against clinging to his anger, but fails and stays with Achilles."],
["antilochus","آنتیلوخوس","Ἀντίλοχος","Antilochus","achaean","B","پسر جوان نستور و دوست نزدیک آشیل. در سرود ۱۸ خبر مرگ پاتروکلوس را به آشیل می‌رساند و در مسابقه‌ی ارابه‌رانی با ترفند از منلائوس پیش می‌افتد و بعد پوزش می‌خواهد. در اودیسه از مرگش در تروا یاد می‌شود و سایه‌اش کنار آشیل در جهان زیرین است.","Antilochus","Antilokhos, son of Nestor | آنتیلوکوس","Nestor's young son and a close friend of Achilles. In Book 18 he brings Achilles the news of Patroclus' death, and in the chariot race he cuts in front of Menelaus, then apologizes. The Odyssey recalls his death at Troy, and his shade stands beside Achilles in the underworld."],
["machaon","ماخائون","Μαχάων","Machaon","achaean","I","پزشک سپاه یونان و پسر آسکلپیوس. در سرود ۱۱ تیر پاریس زخمی‌اش می‌کند و نستور او را به چادر می‌برد. آشیل پاتروکلوس را برای پرسیدن حال او می‌فرستد و همین دیدار با نستور، پاتروکلوس را به سوی جنگ می‌کشاند.","Machaon","Makhaon, son of Asclepius, physician | ماکائون","Healer of the Greek army and son of Asclepius. In Book 11 Paris wounds him with an arrow and Nestor carries him to his hut. Achilles sends Patroclus to ask after him, and that visit to Nestor sets Patroclus on the path to battle."],
["thersites","ترسیتس","Θερσίτης","Thersites","achaean","I","زشت‌روترین و بدزبان‌ترین مرد سپاه. در سرود ۲ آگاممنون را آشکارا به آزمندی متهم می‌کند و اودیسئوس با عصای شاهی او را می‌زند و سپاه می‌خندد. او تنها سرباز عادی ایلیاد است که صدایش شنیده می‌شود.","Thersites","Thersites | ترسیت","The ugliest and most foul-mouthed man in the army. In Book 2 he openly accuses Agamemnon of greed; Odysseus beats him with the royal scepter and the army laughs. He is the only common soldier in the Iliad who gets to speak."],
["calchas","کالخاس","Κάλχας","Calchas","achaean","I","پیشگوی سپاه یونان. در سرود ۱ با پشتیبانی آشیل فاش می‌کند که طاعون از خشم آپولون است، چون آگاممنون کاهنش را تحقیر کرده است. اودیسئوس در سرود ۲ پیشگویی قدیمی او را یادآوری می‌کند که جنگ ده سال طول خواهد کشید.","Calchas","Kalchas, seer | کالکاس","The Greek army's seer. In Book 1, under Achilles' protection, he reveals that the plague comes from Apollo's anger because Agamemnon insulted his priest. In Book 2 Odysseus recalls his old prophecy that the war would last ten years."],
["talthybius","تالتوبیوس","Ταλθύβιος","Talthybius","achaean","I","جارچی آگاممنون. در سرود ۱ همراه اوروباتس به چادر آشیل می‌رود تا بریسئیس را ببرد؛ آشیل آنان را مقصر نمی‌داند و با احترام می‌پذیرد.","Talthybius","Talthybios, herald | تالتیبیوس","Agamemnon's herald. In Book 1 he and Eurybates go to Achilles' hut to take Briseis; Achilles does not blame them and receives them courteously."],
["neoptolemus","نئوپتولموس","Νεοπτόλεμος","Neoptolemus","achaean","B","پسر آشیل که در جزیره‌ی اسکوروس بزرگ شد. آشیل در ایلیاد از او یاد می‌کند. در اودیسه، اودیسئوس به روح آشیل می‌گوید پسرش درون اسب چوبی آرام و دلیر بود؛ و در اسپارت جشن عروسی او با دختر منلائوس برپاست.","Neoptolemus","Pyrrhus, son of Achilles | پیروس, نئوپتولم","Achilles' son, raised on Skyros. Achilles mentions him in the Iliad. In the Odyssey, Odysseus tells Achilles' ghost that his son was calm and brave inside the Wooden Horse, and in Sparta his wedding to Menelaus' daughter is being celebrated."],
["peleus","پلئوس","Πηλεύς","Peleus","achaean","B","پدر سالخورده‌ی آشیل و شوهر تتیس، پادشاه فتیا. یاد او در سرود ۲۴ آشیل را به گریه می‌اندازد، وقتی پریام از پدران پیر سخن می‌گوید. در اودیسه، روح آشیل نگران است که مبادا پدرش در پیری خوار شده باشد.","Peleus","Peleus, father of Achilles | پله","Achilles' aged father and Thetis' husband, king of Phthia. In Book 24 the thought of him moves Achilles to tears when Priam speaks of old fathers. In the Odyssey, Achilles' ghost worries whether his father is still honored in his old age."],
["philoctetes","فیلوکتتس","Φιλοκτήτης","Philoctetes","achaean","B","کمانداری بزرگ که پس از مارگزیدگی در جزیره‌ی لمنوس رها شد؛ ایلیاد از او یاد می‌کند. در اودیسه، اودیسئوس می‌گوید در تیراندازی تنها فیلوکتتس از او بهتر بود، و نستور می‌گوید او به سلامت به خانه رسید.","Philoctetes","Philoktetes | فیلوکتت","A great archer abandoned on Lemnos after a snakebite; the Iliad mentions him. In the Odyssey, Odysseus says only Philoctetes surpassed him at archery, and Nestor reports he got home safely."],
["orestes","اورستس","Ὀρέστης","Orestes","achaean","B","پسر آگاممنون که انتقام پدر را از آیگیستوس گرفت. در ایلیاد آگاممنون از او نام می‌برد. در اودیسه بارها الگوی تلماخوس معرفی می‌شود: پسری که باید از حق خاندانش دفاع کند.","Orestes","Orestes, son of Agamemnon | اورست","Agamemnon's son, who avenged his father by killing Aegisthus. Agamemnon names him in the Iliad. In the Odyssey he is held up again and again as a model for Telemachus: a son who must defend his family's rights."],
["aegisthus","آیگیستوس","Αἴγισθος","Aegisthus","achaean","O","معشوق کلوتمنسترا و قاتل آگاممنون. در نخستین سخنان زئوس در اودیسه، او نمونه‌ی انسانی است که با وجود هشدار هرمس، با گناه خود بلا بر سر خویش آورد و به دست اورستس کشته شد.","Aegisthus","Aigisthos | اژیستوس","Clytemnestra's lover and Agamemnon's murderer. In Zeus' first speech in the Odyssey he is the example of a man who, despite Hermes' warning, brought ruin on himself through his own crimes and was killed by Orestes."],
["pisistratus","پیسیستراتوس","Πεισίστρατος","Pisistratus","achaean","O","کوچک‌ترین پسر نستور. با ارابه تلماخوس را از پولوس به اسپارت می‌برد و هم‌سفر و دوست او می‌شود.","Pisistratus","Peisistratos, son of Nestor | پیزیستراتوس","Nestor's youngest son. He drives Telemachus by chariot from Pylos to Sparta and becomes his companion and friend."],
// Ithaca
["mentor","منتور","Μέντωρ","Mentor","home","O","دوست قدیمی اودیسئوس که اودیسئوس هنگام رفتن، سرپرستی خانه‌اش را به او سپرده بود. آتنا بارها در هیئت او ظاهر می‌شود: در سفر تلماخوس، در نبرد با خواستگاران و در صلح پایانی. واژه‌ی «منتور» به معنای راهنما از نام او آمده است.","Mentor","Mentor | راهنما","An old friend to whom Odysseus entrusted his household. Athena repeatedly takes his form: on Telemachus' voyage, in the fight with the suitors and in the final peace. The word 'mentor' comes from his name."],
["anticlea","آنتیکلئیا","Ἀντίκλεια","Anticlea","home","O","مادر اودیسئوس که از دلتنگی برای پسرش درگذشت. در جهان زیرین اودیسئوس سه بار می‌کوشد او را در آغوش بگیرد و هر بار سایه‌اش از میان دستانش می‌گریزد.","Anticlea","Antikleia, mother of Odysseus | آنتیکلیا","Odysseus' mother, who died of longing for her son. In the underworld Odysseus tries three times to embrace her, and each time her shade slips through his arms."],
["eurymachus","اورومخوس","Εὐρύμαχος","Eurymachus","home","O","دومین سرکرده‌ی خواستگاران؛ چرب‌زبان و فریبکار. وقتی اودیسئوس خود را آشکار می‌کند، پیشنهاد غرامت می‌دهد و سپس با شمشیر حمله می‌کند و با تیر کشته می‌شود.","Eurymachus","Eurymakhos | اوریماخوس","The second leader of the suitors, smooth-tongued and deceitful. When Odysseus reveals himself he offers compensation, then charges with a sword and is shot down."],
["amphinomus","آمفینوموس","Ἀμφίνομος","Amphinomus","home","O","مهربان‌ترین خواستگار، که پنلوپه از سخنانش خوشش می‌آمد. اودیسئوس در جامه‌ی گدا به او هشدار می‌دهد که برود، اما او می‌ماند و در کشتار به دست تلماخوس کشته می‌شود.","Amphinomus","Amphinomos | آمفینوم","The kindest of the suitors, whose words Penelope liked. Odysseus, disguised as a beggar, warns him to leave, but he stays and is killed by Telemachus in the slaughter."],
["melanthius","ملانتیوس","Μελάνθιος","Melanthius","home","O","بزچران خیانتکار که با خواستگاران هم‌دست است. گدای ناشناس را لگد می‌زند و در نبرد پایانی برای خواستگاران سلاح می‌آورد؛ کیفرش سخت است.","Melanthius","Melanthios, goatherd | ملانتئوس","The treacherous goatherd who sides with the suitors. He kicks the unknown beggar and in the final fight brings weapons to the suitors; his punishment is brutal."],
["melantho","ملانتو","Μελανθώ","Melantho","home","O","کنیز گستاخ کاخ و خواهر ملانتیوس که معشوقه‌ی اورومخوس است و گدا را مسخره می‌کند. همراه دیگر کنیزان بی‌وفا در پایان کیفر می‌بیند.","Melantho","Melantho, maid | ملانتو","An insolent palace maid, sister of Melanthius and lover of Eurymachus, who mocks the beggar. She is punished with the other disloyal maids at the end."],
["philoetius","فیلویتیوس","Φιλοίτιος","Philoetius","home","O","گاوچران وفادار اودیسئوس. همراه ائومائوس در کشتار خواستگاران در کنار اودیسئوس و تلماخوس می‌جنگد.","Philoetius","Philoitios, cowherd | گاوچران","Odysseus' loyal cowherd. With Eumaeus he fights beside Odysseus and Telemachus in the slaughter of the suitors."],
["irus","ایروس","Ἶρος","Irus","home","O","گدای پرخور و لاف‌زن کاخ که می‌خواهد اودیسئوسِ گدانما را از کاخ بیرون کند. خواستگاران برای سرگرمی آن دو را به مشت‌زنی وامی‌دارند و اودیسئوس با یک ضربه او را نقش زمین می‌کند.","Irus","Iros, Arnaeus, beggar | گدا","A greedy, boastful beggar of the palace who tries to drive out the disguised Odysseus. The suitors make them box for entertainment, and Odysseus floors him with one blow."],
["phemius","فمیوس","Φήμιος","Phemius","home","O","خنیاگر کاخ ایتاکا که به اجبار برای خواستگاران می‌خواند. ترانه‌اش درباره‌ی بازگشت تلخ یونانیان پنلوپه را به گریه می‌اندازد. در کشتار، به خواهش تلماخوس بخشیده می‌شود.","Phemius","Phemios, bard of Ithaca | خنیاگر ایتاکا","The bard of the Ithacan palace, forced to sing for the suitors. His song of the Greeks' bitter homecoming brings Penelope to tears. In the slaughter he is spared at Telemachus' request."],
["theoclymenus","تئوکلومنوس","Θεοκλύμενος","Theoclymenus","home","O","مردی پیشگو و فراری که تلماخوس در پولوس او را به کشتی خود می‌پذیرد. در سرود ۲۰ در رؤیایی هولناک نابودی نزدیک خواستگاران را می‌بیند و آنان به او می‌خندند.","Theoclymenus","Theoklymenos, seer | تئوکلیمنوس","A fugitive seer whom Telemachus takes aboard at Pylos. In Book 20 he has a terrible vision of the suitors' coming doom, and they laugh at him."],
// voyage
["elpenor","الپنور","Ἐλπήνωρ","Elpenor","voyage","O","جوان‌ترین یار اودیسئوس که مست روی بام خانه‌ی کیرکه خوابیده بود، افتاد و گردنش شکست. نخستین روحی است که اودیسئوس در جهان زیرین می‌بیند و از او خاکسپاری می‌خواهد.","Elpenor","Elpenor | الپنور","The youngest of Odysseus' men, who fell asleep drunk on Circe's roof, fell and broke his neck. He is the first ghost Odysseus meets in the underworld, and asks to be buried."],
["eurylochus","اورولوخوس","Εὐρύλοχος","Eurylochus","voyage","O","معاون اودیسئوس و خویشاوند او. در خانه‌ی کیرکه به دام نمی‌افتد و خبر می‌آورد، اما در تریناکیه یاران را قانع می‌کند گاوهای هلیوس را بکشند.","Eurylochus","Eurylokhos | اوریلوکوس","Odysseus' second-in-command and kinsman. He avoids Circe's trap and brings back the news, but on Thrinacia he persuades the crew to kill the cattle of Helios."],
["arete","آرته","Ἀρήτη","Arete","voyage","O","ملکه‌ی فایاکیان و همسر آلکینوئوس که به خرد و نفوذ شهره است. نائوسیکا به اودیسئوس می‌گوید پیش از همه به دامن او پناه ببرد.","Arete","Arete, queen of the Phaeacians | آرت","Queen of the Phaeacians and wife of Alcinous, famous for her wisdom and influence. Nausicaa tells Odysseus to make his appeal to her first."],
["proteus","پروتئوس","Πρωτεύς","Proteus","voyage","O","پیر دریا که در جزیره‌ی فاروس، نزدیک مصر، زندگی می‌کند و می‌تواند به هر شکلی درآید. منلائوس به راهنمایی ائیدوتئا، دختر پروتئوس، در کمین او می‌نشیند، غافلگیرش می‌کند و با وجود همه‌ی دگرگونی‌هایش او را محکم نگه می‌دارد تا ناچار به سخن آید. آنگاه پروتئوس سرنوشت آژاکس کوچک و آگاممنون را بازمی‌گوید و خبر می‌دهد که اودیسئوس در جزیره‌ی کالیپسو گرفتار است.","Proteus","Old Man of the Sea, Pharos | پیر دریا","The Old Man of the Sea, who lives on Pharos off Egypt and can take any shape. Guided by Proteus' daughter Eidothea, Menelaus ambushes him and holds on through all his transformations until he is forced to speak. Proteus then reveals the fates of Ajax the Lesser and Agamemnon, and that Odysseus is held captive by Calypso."],
["leucothea","لئوکوتئا","Λευκοθέα · Ἰνώ","Leucothea (Ino)","voyage","O","ایزدبانوی دریا که پیش‌تر زنی میرا به نام اینو بوده. وقتی طوفان پوزئیدون قایق چوبی اودیسئوس را درهم می‌شکند، روسری خود را به او می‌دهد تا غرق نشود.","Leucothea","Ino, Leukothea, sea goddess, veil | اینو","A sea goddess who was once a mortal woman named Ino. When Poseidon's storm wrecks Odysseus' raft, she gives him her veil so he will not drown."],
["laestrygonians","لستروگون‌ها","Λαιστρυγόνες","Laestrygonians","voyage","O","غول‌های آدم‌خوار سرزمین تلپولوس. کشتی‌ها را با سنگ‌های بزرگ درهم می‌کوبند و مردان را مانند ماهی نیزه می‌زنند. از همه‌ی ناوگان تنها کشتی اودیسئوس می‌گریزد.","Laestrygonians","Laistrygones, Lestrigonians, Telepylus, Antiphates | لسترگونی‌ها","Cannibal giants of Telepylus. They smash the ships with boulders and spear the men like fish. Of the whole fleet, only Odysseus' ship escapes."],
["cicones","کیکون‌ها","Κίκονες","Cicones","voyage","O","نخستین ایستگاه پس از تروا. اودیسئوس شهرشان اسماروس را غارت می‌کند، اما یاران به جای گریختن به میگساری می‌مانند و کیکون‌ها از هر کشتی شش مرد می‌کشند. شراب نیرومندی که اینجا از کاهن آپولون می‌گیرد، بعدها پولیفموس را مست می‌کند.","Cicones","Kikones, Ismarus, Maron | ایسماروس","The first stop after Troy. Odysseus sacks their city, Ismarus, but his men linger drinking instead of fleeing, and the Cicones kill six men from each ship. The strong wine he receives here from a priest of Apollo later makes Polyphemus drunk."],
// Trojans
["astyanax","آستوآناکس","Ἀστυάναξ","Astyanax","trojan","I","پسر خردسال هکتور و آندروماخه. در سرود ۶ از دیدن کلاهخود یال‌دار پدر می‌ترسد و گریه می‌کند و پدر و مادر می‌خندند. آندروماخه در سوگ هکتور سرنوشت شوم او را پیش‌بینی می‌کند.","Astyanax","Scamandrius, son of Hector | آستیاناکس","The infant son of Hector and Andromache. In Book 6 he is frightened by his father's plumed helmet and cries, and his parents laugh. In her lament for Hector, Andromache foresees his grim fate."],
["deiphobus","دیفوبوس","Δηΐφοβος","Deiphobus","trojan","B","برادر هکتور. در سرود ۲۲ آتنا به شکل او درمی‌آید تا هکتور را به ایستادگی در برابر آشیل بفریبد؛ هکتور که برای نیزه‌ی دوم برمی‌گردد، کسی را نمی‌یابد. در اودیسه همسر هلن پس از پاریس است و در شب سقوط تروا اودیسئوس و منلائوس به خانه‌اش یورش می‌برند.","Deiphobus","Deiphobos | دیفوب","Hector's brother. In Book 22 Athena takes his form to trick Hector into standing against Achilles; when Hector turns for a second spear, no one is there. In the Odyssey he is Helen's husband after Paris, and on the night Troy falls Odysseus and Menelaus storm his house."],
["sarpedon","سارپدون","Σαρπηδών","Sarpedon","trojan","I","فرمانده‌ی لوکیایی‌ها، هم‌پیمان تروا و پسر زئوس. در سرود ۱۲ درباره‌ی وظیفه‌ی بزرگان سخنی ماندگار می‌گوید. پاتروکلوس او را می‌کشد؛ زئوس باران خونین می‌باراند و هوپنوس و تاناتوس، ایزدان خواب و مرگ، پیکرش را به لوکیا می‌برند.","Sarpedon","Sarpedon of Lycia | سارپدون","Leader of the Lycians, Troy's allies, and a son of Zeus. In Book 12 he gives a famous speech on the duty of nobles. Patroclus kills him; Zeus rains drops of blood and Sleep and Death carry his body home to Lycia."],
["glaucus","گلاوکوس","Γλαῦκος","Glaucus","trojan","I","جنگاور لوکیایی و یار سارپدون. در سرود ۶ با دیومدس روبه‌رو می‌شود و نسل‌های انسان را به برگ درختان مانند می‌کند. چون پدربزرگانشان میزبان یکدیگر بوده‌اند، از جنگ دست می‌کشند و زره عوض می‌کنند: زره زرین او با زره مفرغی دیومدس.","Glaucus","Glaukos of Lycia | گلاکوس","A Lycian warrior and Sarpedon's comrade. In Book 6 he faces Diomedes and compares the generations of men to leaves. Because their grandfathers were guest-friends, they refuse to fight and exchange armor: his gold for Diomedes' bronze."],
["pandarus","پانداروس","Πάνδαρος","Pandarus","trojan","I","کماندار تروآیی. در سرود ۴ آتنا او را وسوسه می‌کند به منلائوس تیر بیندازد و آتش‌بس را بشکند. در سرود ۵ به دست دیومدس کشته می‌شود.","Pandarus","Pandaros | پاندار","A Trojan archer. In Book 4 Athena tempts him to shoot Menelaus, breaking the truce. In Book 5 he is killed by Diomedes."],
["polydamas","پولوداماس","Πουλυδάμας","Polydamas","trojan","I","رایزن دوراندیش هکتور که در یک شب با او زاده شده. پس از بازگشت آشیل پیشنهاد می‌کند تروآییان به درون دیوارها برگردند؛ هکتور نمی‌پذیرد و بعدها از این خطا پشیمان می‌شود.","Polydamas","Poulydamas | پولیداماس","Hector's prudent adviser, born on the same night as him. After Achilles returns he advises the Trojans to withdraw inside the walls; Hector refuses and later regrets it."],
["dolon","دولون","Δόλων","Dolon","trojan","I","جاسوس تروآیی که شبانه به اردوگاه یونانیان فرستاده می‌شود. اودیسئوس و دیومدس او را می‌گیرند، اطلاعاتش را بیرون می‌کشند و می‌کشندش.","Dolon","Dolon, spy | دلون","A Trojan spy sent into the Greek camp by night. Odysseus and Diomedes capture him, extract information and kill him."],
["rhesus","رسوس","Ῥῆσος","Rhesus","trojan","I","پادشاه تراکیه و هم‌پیمان تروا با اسبان سپید و تیزتک. در سرود ۱۰ اودیسئوس و دیومدس او را در خواب می‌کشند و اسبانش را می‌برند.","Rhesus","Rhesos, Thracian king | رزوس","A Thracian king allied with Troy, famous for his swift white horses. In Book 10 Odysseus and Diomedes kill him in his sleep and steal his horses."],
["lycaon","لوکائون","Λυκάων","Lycaon","trojan","I","پسر جوان پریام که آشیل پیش‌تر اسیر کرده و فروخته بود. در سرود ۲۱ دوباره با آشیل روبه‌رو می‌شود و زانو می‌زند و امان می‌خواهد؛ آشیلِ داغدار پاسخ می‌دهد که مرگ سرنوشت همه است، حتی خود او، و او را می‌کشد.","Lycaon","Lykaon, son of Priam | لیکائون","A young son of Priam whom Achilles had once captured and sold. In Book 21 he meets Achilles again and begs for mercy on his knees; the grief-stricken Achilles answers that death comes to all, even to himself, and kills him."],
["antenor","آنتنور","Ἀντήνωρ","Antenor","trojan","I","از بزرگان خردمند تروا. پیش‌تر میزبان اودیسئوس و منلائوس بوده است، هنگامی که برای پس گرفتن هلن آمده بودند، و در سرود ۷ پیشنهاد می‌کند هلن را بازگردانند؛ پاریس نمی‌پذیرد.","Antenor","Antenor, Trojan elder | آنتنور","One of Troy's wise elders. He once hosted Odysseus and Menelaus when they came to reclaim Helen, and in Book 7 he proposes giving Helen back; Paris refuses."],
["anchises","آنخیسس","Ἀγχίσης","Anchises","trojan","I","شاهزاده‌ی تروآیی و پدر آئنئاس از آفرودیته. در ایلیاد تنها نامش در تبارنامه‌ی آئنئاس آمده، اما بعدها در «انه‌اید» نقش مهمی می‌یابد.","Anchises","Ankhises, father of Aeneas | آنشیز","A Trojan prince and father of Aeneas by Aphrodite. In the Iliad he appears only in Aeneas' genealogy, though he plays a major role later in Virgil's Aeneid."],
["cassandra","کاساندرا","Κασσάνδρη","Cassandra","trojan","B","زیباترین دختر پریام. در سرود ۲۴ ایلیاد نخستین کسی است که پدرش را با پیکر هکتور در راه بازگشت می‌بیند و فریاد می‌زند. در اودیسه، روح آگاممنون می‌گوید در واپسین لحظه‌ها فریاد کاساندرا را شنید که کلوتمنسترا او را در کنارش می‌کشت.","Cassandra","Kassandra, Alexandra | کاساندر","The most beautiful of Priam's daughters. In Iliad Book 24 she is the first to see her father returning with Hector's body and cries out. In the Odyssey, Agamemnon's ghost says he heard her scream as Clytemnestra killed her beside him."],
["euphorbus","اوفوربوس","Εὔφορβος","Euphorbus","trojan","I","جوان تروآیی که پس از ضربه‌ی آپولون نخستین زخم را به پاتروکلوس می‌زند و هکتور کارش را تمام می‌کند. در سرود ۱۷ به دست منلائوس کشته می‌شود.","Euphorbus","Euphorbos | اوفورب","A young Trojan who, after Apollo's blow, gives Patroclus the first wound before Hector finishes him. In Book 17 he is killed by Menelaus."],
// gods
["iris","ایریس","Ἶρις","Iris","god","I","ایزدبانوی رنگین‌کمان و پیام‌آور خدایان در ایلیاد (در اودیسه این نقش با هرمس است). پیام زئوس را به هکتور و دیگران می‌رساند و در سرود ۱۸ آشیل را به نمایان شدن بر سر خندق فرامی‌خواند.","Iris","Iris, rainbow | رنگین‌کمان","Goddess of the rainbow and messenger of the gods in the Iliad (Hermes takes this role in the Odyssey). She carries Zeus' messages to Hector and others, and in Book 18 urges Achilles to show himself at the trench."],
["artemis","آرتمیس","Ἄρτεμις","Artemis","god","B","ایزدبانوی شکار و خواهر آپولون. در نبرد خدایان در سرود ۲۱، هرا کمان آرتمیس را از دستش می‌گیرد و با همان بر گوش‌هایش می‌کوبد. در اودیسه، نائوسیکا به او تشبیه می‌شود و پنلوپه از او مرگی آرام می‌خواهد.","Artemis","Diana, huntress | دیانا","Goddess of the hunt and Apollo's sister. In the battle of the gods in Book 21, Hera boxes her ears with her own bow. In the Odyssey, Nausicaa is compared to her and Penelope prays to her for a gentle death."],
["leto","لتو","Λητώ","Leto","god","B","مادر آپولون و آرتمیس. بیت‌های آغازین ایلیاد آپولون را «پسر لتو و زئوس» می‌نامند. در اودیسه، اودیسئوس در جهان زیرین تیتوس را می‌بیند که به کیفر تجاوز به لتو عذاب می‌کشد.","Leto","Latona | لاتونا","Mother of Apollo and Artemis. The Iliad's opening lines call Apollo 'son of Leto and Zeus'. In the Odyssey, Odysseus sees Tityos in the underworld, punished for assaulting Leto."],
["persephone","پرسفونه","Περσεφόνεια","Persephone","god","B","ملکه‌ی جهان زیرین. در اودیسه، ارواح زنان نامدار را به سوی اودیسئوس می‌فرستد، و سرانجام ترس از اینکه پرسفونه سر گورگون را بفرستد، اودیسئوس را به بازگشت وامی‌دارد. در ایلیاد در نفرین پدر فوینیکس از او یاد می‌شود.","Persephone","Proserpina, Persephoneia, Kore | پروسرپینا","Queen of the underworld. In the Odyssey she sends the shades of famous women to Odysseus, and fear of her drives him back to his ship. In the Iliad she is invoked in the curse of Phoenix's father."],
["hypnos","هوپنوس (خواب)","Ὕπνος","Hypnos (Sleep)","god","I","ایزد خواب. در سرود ۱۴ هرا با وعده‌ی همسری یکی از خاریس‌ها (ایزدبانوان زیبایی) یاری او را به دست می‌آورد تا زئوس را بخواباند. در سرود ۱۶ همراه برادرش تاناتوس (مرگ) پیکر سارپدون را به لوکیا می‌برد.","Hypnos (Sleep)","Sleep, Somnus, Thanatos, Death | خواب, مرگ","God of sleep. In Book 14 Hera wins his help, with the promise of marriage to one of the Graces, to put Zeus to sleep. In Book 16 he and his brother Thanatos (Death) carry Sarpedon's body to Lycia."],
["helios","هلیوس","Ἠέλιος","Helios","god","B","ایزد خورشید که همه چیز را می‌بیند. در ایلیاد گواه سوگندهاست. در اودیسه پدر کیرکه است، خیانت آفرودیته را به هفائستوس خبر می‌دهد و پس از کشته شدن گاوهایش تهدید می‌کند که اگر گناهکاران کیفر نبینند، به جهان زیرین می‌رود و برای مردگان می‌درخشد.","Helios","Sun, Hyperion, Sol | خورشید, هوپریون","The all-seeing sun god. In the Iliad he witnesses oaths. In the Odyssey he is Circe's father, tells Hephaestus of Aphrodite's affair, and after his cattle are killed threatens to go shine among the dead unless they are punished."],
// places
["mycenae","موکنای","Μυκῆναι","Mycenae","place","B","شهر پرزر آگاممنون در پلوپونز. در فهرست کشتی‌ها بزرگ‌ترین ناوگان را می‌فرستد و آگاممنون پس از بازگشت به آنجا کشته می‌شود. تمدن «موکنایی» عصر مفرغ نام خود را از این شهر گرفته است.","Mycenae","Mykenai, Mycenaean | میسن","Agamemnon's city 'rich in gold' in the Peloponnese. In the Catalogue of Ships it sends the largest fleet, and Agamemnon is murdered on his return there. The Bronze Age 'Mycenaean' civilization is named after it."],
["argos_city","آرگوس (شهر)","Ἄργος","Argos (city)","place","B","شهر و سرزمین دیومدس در پلوپونز. هومر یونانیان را بارها «آرگوسی‌ها» می‌نامد. در اودیسه، منلائوس و دیگران از آرگوس به عنوان نام کلی سرزمین یونان یاد می‌کنند. با سگ اودیسئوس هم‌نام است.","Argos (city)","Argives, Argolid | آرگولید","Diomedes' city and region in the Peloponnese. Homer often calls the Greeks 'Argives', and in the Odyssey Argos stands for Greece as a whole. It shares its name with Odysseus' dog."],
["crete","کرت","Κρήτη","Crete","place","B","جزیره‌ی بزرگی که ایدومنئوس بر آن فرمان می‌راند و در ایلیاد صد شهر و در اودیسه نود شهر دارد. اودیسئوس در داستان‌های ساختگی‌اش خود را کرتی معرفی می‌کند.","Crete","Krete, Knossos | کریت","The great island ruled by Idomeneus, with a hundred cities in the Iliad and ninety in the Odyssey. In his invented stories, Odysseus claims to be a Cretan."],
["olympus","المپ","Ὄλυμπος","Olympus","place","B","کوهی در شمال یونان و سرای خدایان، جایی که انجمن‌هایشان را برگزار می‌کنند. ایلیاد بارها میان میدان جنگ و کاخ‌های خدایان جابه‌جا می‌شود؛ اودیسه نیز با انجمنی در آنجا آغاز می‌شود.","Olympus","Olympos, Mount Olympus | کوه المپ","A mountain in northern Greece and home of the gods, where they hold their councils. The Iliad cuts back and forth between the battlefield and these halls, and the Odyssey also opens with a council there."],
["ida","کوه ایدا","Ἴδη","Mount Ida","place","I","کوهی مشرف به دشت تروا. زئوس از قله‌ی آن، گارگاروس، نبرد را تماشا می‌کند و در سرود ۱۴ هرا در همان‌جا او را می‌فریبد.","Mount Ida","Ida, Gargarus, Gargaron | ایدا","A mountain overlooking the plain of Troy. Zeus watches the battle from its peak, Gargarus, and in Book 14 Hera seduces him there."],
["scamander","رود اسکاماندروس","Σκάμανδρος · Ξάνθος","Scamander (Xanthus)","place","I","رود دشت تروا که ایزدان آن را کسانتوس می‌نامند. در سرود ۲۱، رود از انبوه اجساد خشمگین می‌شود و با آشیل می‌جنگد تا آنکه هفائستوس با آتش آن را رام می‌کند.","Scamander (Xanthus)","Skamandros, Xanthus, Xanthos, river | کسانتوس, رود","The river of the Trojan plain, called Xanthus by the gods. In Book 21, choked with corpses, it rises in anger and fights Achilles until Hephaestus subdues it with fire."],
["phthia","فتیا","Φθίη","Phthia","place","B","سرزمین آشیل و پدرش پلئوس در شمال یونان. آشیل در سرود ۹ تهدید می‌کند که به آنجا بازمی‌گردد. در اودیسه، روح آشیل از وضع پدرش در فتیا می‌پرسد.","Phthia","Phthia, Myrmidons | میرمیدون‌ها","Homeland of Achilles and his father Peleus in northern Greece. In Book 9 Achilles threatens to sail back there. In the Odyssey, Achilles' ghost asks how his father fares in Phthia."],
["egypt","مصر","Αἴγυπτος","Egypt","place","B","در ایلیاد، آشیل از ثروت تبای صددروازه‌ی مصر یاد می‌کند. در اودیسه، منلائوس سال‌ها در مصر و جزیره‌ی فاروس گرفتار بود و هلن داروی فراموشی را از آنجا آورده است. اودیسئوس نیز در دروغ‌هایش از یورشی به مصر می‌گوید.","Egypt","Aigyptos, Egyptian Thebes, Nile | نیل","In the Iliad, Achilles mentions the wealth of hundred-gated Egyptian Thebes. In the Odyssey, Menelaus was stranded for years in Egypt and on Pharos, and Helen's drug of forgetfulness came from there. Odysseus' false tales also include a raid on Egypt."],
["scaean","دروازه‌ی اسکایی","Σκαιαὶ πύλαι","Scaean Gates","place","I","دروازه‌ی اصلی تروا رو به میدان نبرد. هلن از برج کنار آن سرداران را معرفی می‌کند، هکتور کنار آن با آندروماخه وداع می‌کند و در سرود ۲۲ تنها بیرون آن به انتظار آشیل می‌ایستد. هکتورِ در حال مرگ پیش‌بینی می‌کند آشیل همین‌جا کشته خواهد شد.","Scaean Gates","Skaian Gates, Scaean Gate, walls of Troy | دروازه‌ی تروا","The main gate of Troy facing the battlefield. Helen names the Greek leaders from the tower beside it, Hector says farewell to Andromache near it, and in Book 22 he waits alone outside it for Achilles. The dying Hector foretells that Achilles will die at this very gate."],
["ships","اردوگاه و کشتی‌های یونانیان","νῆες Ἀχαιῶν","Greek ships & camp","place","I","کشتی‌های یونانیان که بر ساحل تروا کشیده شده‌اند و اردوگاه و دیوار پیرامونشان. در غیاب آشیل، تروآییان تا کنار کشتی‌ها پیش می‌آیند و هکتور یکی را به آتش می‌کشد؛ و همین لحظه است که آشیل پاتروکلوس را به میدان می‌فرستد.","Greek ships & camp","ships, camp, Achaean camp, wall, Catalogue of Ships | کشتی‌ها, اردوگاه","The Greek ships drawn up on the shore of Troy, with the camp and wall around them. With Achilles absent, the Trojans push up to the ships and Hector sets one on fire; that moment sends Patroclus into battle."]
